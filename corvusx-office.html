<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORVUS X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg:#F0EEE8;
    --bg-gradient:linear-gradient(135deg,#FEFEFE 0%,#F5F4EF 30%,#EFEEE8 55%,#F5F4EF 80%,#FEFEFE 100%);
    --sidebar:#E8E6E0;
    --chat:#F0EEE8;
    --panel:#E8E6E0;
    --input:#FAFAF8;
    --surface:#FAFAF8;
    --surface-hi:#F5F4EF;
    --border:#B8B4A8;
    --border-soft:rgba(140,130,115,0.25);
    --text:#1A1915;
    --text-soft:#6B6560;
    --text-dim:#9A938A;
    --accent:#C96442;
    --accent-hover:#A8533A;
    --accent-alt:#8b5cf6;
    --gold:#c08835;
    --magenta:#c44a8b;
    --red:#b94141;
    --green:#3d8a55;
    --user-bubble:#C96442;
    --user-bubble-border:#B55737;
    --user-bubble-text:#FFFFFF;

    /* ─ Middle Management 오피스 팔레트 (파스텔 2.5D, 블롭 캐릭터) ───── */
    --floor-wood:#EDE8DD;            /* 밝은 베이지 바닥 (과거 우드 → 심플 아이보리) */
    --floor-wood-dark:#D8D0C0;
    --wall:#F2ECE0;
    --wall-shadow:#DDD5C4;
    --corridor:#D7CCC8;              /* 복도 — 따뜻한 베이지 */
    --corridor-stripe:#BCAAA4;

    /* 방별 파스텔 2단 그라데이션 — Middle Management 스타일 */
    --room-market:#BBDEFB;           /* 연파랑 */
    --room-market-2:#E3F2FD;
    --room-compete:#FFCDD2;          /* 연빨강 */
    --room-compete-2:#FFEBEE;
    --room-legal:#C5CAE9;            /* 연인디고 */
    --room-legal-2:#E8EAF6;
    --room-finance:#FFECB3;          /* 연노랑 */
    --room-finance-2:#FFF8E1;
    --room-marketing:#E1BEE7;        /* 연보라 */
    --room-marketing-2:#F3E5F5;
    --room-rnd:#B2DFDB;              /* 연청록 */
    --room-rnd-2:#E0F2F1;
    --room-data:#CFD8DC;             /* 연회색 */
    --room-data-2:#ECEFF1;
    --room-content:#FFE0B2;          /* 연주황 */
    --room-content-2:#FFF3E0;
    --room-sns:#C8E6C9;              /* 연초록 */
    --room-sns-2:#E8F5E9;
    --room-design:#F8BBD0;           /* 연핑크 — 디자인팀 */
    --room-design-2:#FCE4EC;
    --room-sanmoo:#F9E4A2;           /* 상무실 — 웜 골드 */
    --room-sanmoo-2:#FFF8E1;
    --room-break:#A5D6A7;            /* 휴게실 — 생기있는 초록 */
    --room-break-2:#E8F5E9;

    --gold-strong:#C9A84C;
    --gold-light:#E8C85A;
    --wood-dark:#5D4037;             /* 블롭/라벨 텍스트 딥 브라운 */
    --wood-mid:#795548;
    --wood-light:#A1887F;
    --text-dark:#2C2420;
    --text-mid:#5C4A3A;
    --text-light:#F5F0E8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    background:var(--bg-gradient);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;
    overflow:hidden;font-size:18px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* ─ layout: sidebar(resizable) / main / panel ───────────────────── */
  .app{
    display:grid;
    grid-template-columns:var(--sidebar-w,260px) 1fr var(--panel-w,300px);
    height:100vh;
    transition:grid-template-columns .22s ease;
  }
  .app.is-resizing{transition:none;user-select:none;-webkit-user-select:none}
  .app.is-resizing iframe{pointer-events:none}
  .app[data-sidebar="closed"]{grid-template-columns:0 1fr var(--panel-w,300px)}
  .app[data-panel="closed"]{grid-template-columns:var(--sidebar-w,260px) 1fr 34px}
  .app[data-sidebar="closed"][data-panel="closed"]{grid-template-columns:0 1fr 34px}

  /* ─ sidebar ─────────────────────────────────────────────────────── */
  .sidebar{background:var(--sidebar);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
  .sidebar-inner{width:100%;display:flex;flex-direction:column;min-width:0;height:100%;padding:8px 0 8px}
  .sidebar-resize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:5;background:transparent}
  .sidebar-resize:hover{background:rgba(201,100,66,.3)}

  .sb-head{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;position:relative}
  .sb-head .logo{flex:1;font-size:15px;font-weight:700;letter-spacing:.4px;color:var(--text);display:flex;align-items:center;gap:7px}
  .sb-head .logo .mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt))}
  .sb-head button.icon-btn{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sb-head button.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

  .nav-btn{display:flex;align-items:center;gap:9px;padding:8px 14px;color:var(--text-soft);cursor:pointer;font-size:15px;text-decoration:none;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s;border-radius:0}
  .nav-btn:hover{background:rgba(0,0,0,.04);color:var(--text)}
  .nav-btn.active{background:rgba(201,100,66,.12);color:var(--accent)}
  .nav-btn .ic{width:14px;height:14px;flex-shrink:0;opacity:.85}

  .nav-divider{padding:14px 14px 4px;font-size:12px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .nav-divider .add{color:var(--text-dim);cursor:pointer;font-size:15px;padding:2px 4px}
  .nav-divider .add:hover{color:var(--accent)}

  .sidebar-scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:8px}
  .sidebar-scroll::-webkit-scrollbar{width:5px}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:3px}

  .thread-item{padding:6px 14px 6px 22px;color:var(--text-soft);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:background .12s;position:relative}
  .thread-item .t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .thread-item .t-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread-item .t-meta{font-size:12px;color:var(--text-dim)}
  .thread-item .pin{color:var(--gold);font-size:12px}
  .thread-item:hover{background:rgba(0,0,0,.05);color:var(--text)}
  .thread-item.active{background:rgba(201,100,66,.12);color:var(--accent)}
  .thread-item .row-menu{opacity:.35;padding:2px 6px;font-size:16px;color:var(--text-dim);cursor:pointer;border-radius:4px;line-height:1;border:none;background:transparent;flex-shrink:0}
  .thread-item:hover .row-menu,.thread-item .row-menu.is-open{opacity:1}
  .thread-item .row-menu:hover{background:rgba(0,0,0,.08);color:var(--text)}

  .thread-rename-input{background:var(--input);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:14px;padding:2px 6px;outline:none;width:100%}

  .project-row{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--text);user-select:none;transition:background .12s}
  .project-row:hover{background:rgba(0,0,0,.05)}
  .project-row.active{background:rgba(201,100,66,.08)}
  .project-row .caret{font-size:9px;transition:transform .15s;width:10px;display:inline-block;text-align:center}
  .project-row.collapsed .caret{transform:rotate(-90deg)}
  .project-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .project-row .count{color:var(--text-dim);font-size:12px}
  .project-row .row-menu{opacity:.35;padding:2px 6px;font-size:16px;color:var(--text-dim);cursor:pointer;border-radius:4px;line-height:1;border:none;background:transparent;flex-shrink:0}
  .project-row:hover .row-menu,.project-row .row-menu.is-open{opacity:.85}
  .project-row .row-menu:hover{background:rgba(0,0,0,.08);color:var(--text);opacity:1}
  .project-new-thread{padding:4px 14px 6px 34px;color:var(--text-dim);font-size:13px;cursor:pointer}
  .project-new-thread:hover{color:var(--accent)}

  /* bubble menu */
  .bubble-menu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 10px 30px rgba(100,90,70,.18);font-size:14px}
  .bubble-menu .mi{padding:7px 10px;cursor:pointer;border-radius:5px;color:var(--text-soft);display:flex;align-items:center;gap:8px}
  .bubble-menu .mi:hover{background:rgba(0,0,0,.05);color:var(--text)}
  .bubble-menu .mi.danger:hover{background:rgba(185,65,65,.12);color:#fca5a5}
  .bubble-menu .mi .chev{margin-left:auto;color:var(--text-dim)}
  .bubble-menu .divider{height:1px;background:var(--border-soft);margin:4px 2px}
  .bubble-menu .sub{position:absolute;left:100%;top:0;margin-left:2px}

  /* ─ main column ─ */
  .main-col{display:grid;grid-template-rows:22% 78%;min-height:0;min-width:0;background:var(--bg)}
  .office-wrap{position:relative;background:#C8B89A;overflow:hidden;border-bottom:1px solid var(--border-soft)}
  .office-title{position:absolute;top:8px;left:14px;color:var(--text-soft);font-size:13px;letter-spacing:2px;font-weight:600;z-index:3;pointer-events:none;opacity:.7}
  .office-status{position:absolute;top:8px;right:14px;color:var(--text-soft);font-size:13px;display:flex;align-items:center;gap:6px;z-index:3;pointer-events:none}
  .office-status .dot{width:7px;height:7px;border-radius:50%;background:#374151}
  .office-status .dot.live{background:#22c55e;animation:pulse 1.4s ease-in-out infinite}
  .office-status .dot.err{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  #phaser-container{width:100%;height:100%;display:none}
  #phaser-container canvas{display:block}

  /* ─── 평면 2D top-down 오피스 (800×440 viewBox, SimCity 스타일) ───────── */
  #tph-stage{
    position:relative;width:100%;height:100%;
    background:#E8EAF0;
    overflow:hidden;
    color:var(--text-dark);
  }
  /* 2D 평면도 — crispEdges 만 유지 (픽셀 강제는 해제, 원/곡선 있음) */
  .tph-grid-bg{ shape-rendering:crispEdges }
  .tph-iso-svg{ display:none }

  /* 배경 SVG 내 desk 그룹 — 상태별 모니터 발광 (픽셀아트 팔레트) */
  .tph-grid-bg .desk{ transition:filter 0.2s }
  .tph-grid-bg .desk:hover{ filter:brightness(1.15) }
  .tph-grid-bg .desk[data-state="working"] .monitor-screen{ fill:#4AD9F5 }
  .tph-grid-bg .desk[data-state="done"]    .monitor-screen{ fill:#22C55E }
  .tph-grid-bg .desk[data-state="error"]   .monitor-screen{ fill:#EF4444 }
  .tph-grid-bg .desk[data-state="rework"]  .monitor-screen{ fill:#F59E0B }
  .tph-grid-bg .desk[data-state="briefing"].monitor-screen{ fill:#C9A84C }
  .tph-grid-bg .desk[data-state="collab"]  .monitor-screen{ fill:#BA68C8 }
  #tph-stage::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 20%, rgba(255,255,255,0.18) 0%, transparent 60%);
    pointer-events:none;
  }

  /* HUD 상단 바 — 민트/아이보리 파스텔 */
  .tph-hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 14px;height:32px;
    background:linear-gradient(180deg, #FFFDF7 0%, #F8EFD8 100%);
    border-bottom:2px solid var(--gold-strong);
    box-shadow:0 2px 6px rgba(107,78,10,0.12);
    z-index:5;font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .tph-hud__logo{color:var(--wood-dark);font-weight:800;letter-spacing:1.2px;font-size:11.5px}
  .tph-hud__mission{color:var(--text-mid);font-size:11px;flex:1;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 12px;font-weight:600}
  .tph-hud__progress{
    display:flex;align-items:center;gap:6px;color:var(--text-mid);font-size:11px;font-weight:700}
  .tph-hud__progress strong{color:var(--green)}
  .tph-hud__logout{
    margin-left:10px;padding:3px 10px;
    background:transparent;border:1px solid #A8ADB5;border-radius:3px;
    color:var(--text-mid);font-size:10px;font-weight:700;letter-spacing:1px;
    cursor:pointer;transition:all .15s;font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .tph-hud__logout:hover{border-color:#E24B4A;color:#E24B4A}

  /* 오픈 오피스 — .tph-grid 는 절대 좌표계 원점 역할. 방들은 각자 top/left 로 배치 */
  .tph-grid{
    position:absolute;
    top:46px;left:16px;right:16px;bottom:14px;
  }
  .tph-grid-bg{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:0;
    image-rendering:pixelated;
  }
  .tph-corridor{ display:none }
  /* 팀 책상 컨테이너 — 배경 SVG 위에 올려진 보이지 않는 히트박스 + 캐릭터 슬롯 */
  .tph-room{
    position:absolute;
    width:70px;height:62px;
    background:transparent;
    border:none;
    box-shadow:none;
    transition:filter .2s ease;
    z-index:2;
  }
  .tph-room::before, .tph-room::after{ content:none; display:none }

  /* 상태별 효과 — 방 박스 없이 캐릭터 주변 미세한 글로우 */
  .tph-room[data-state="working"] .tph-character{ filter:drop-shadow(0 0 6px rgba(66,165,245,0.7)) drop-shadow(0 1px 1px rgba(0,0,0,0.18)) }
  .tph-room[data-state="done"]    .tph-character{ filter:drop-shadow(0 0 5px rgba(102,187,106,0.6)) drop-shadow(0 1px 1px rgba(0,0,0,0.18)) }
  .tph-room[data-state="error"]   .tph-character{ filter:drop-shadow(0 0 5px rgba(239,83,80,0.7)) drop-shadow(0 1px 1px rgba(0,0,0,0.18)) }
  .tph-room[data-state="rework"]  .tph-character{ filter:drop-shadow(0 0 5px rgba(255,167,38,0.7)) drop-shadow(0 1px 1px rgba(0,0,0,0.18)) }
  @keyframes tph-working-pulse{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.18)}
  }
  @keyframes tph-shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(3px)}
  }

  /* 방 헤더 — 책상 위쪽 작은 라벨 (중앙) */
  .tph-room__head{
    position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;
    display:flex;align-items:center;gap:3px;
    padding:0;background:transparent;border-bottom:none;
    font-size:7.5px;font-weight:700;letter-spacing:0.3px;
    color:rgba(0,0,0,0.5);text-transform:none;
    white-space:nowrap;
  }
  .tph-room__icon{font-size:9px;line-height:1;flex-shrink:0;display:none}
  .tph-room__name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7.5px}
  /* IDLE 배지 — 라벨 옆에 작게 (캐릭터 머리 위쪽 영역) */
  .tph-room__badge{
    padding:0 3px;border-radius:3px;font-size:6px;font-weight:800;letter-spacing:0.4px;
    background:rgba(255,255,255,0.6);color:#616161;flex-shrink:0;line-height:1.5;
    text-transform:uppercase;text-shadow:none;
  }
  .tph-room[data-state="working"] .tph-room__badge{background:#42A5F5;color:#fff;animation:tph-blink 1s infinite}
  .tph-room[data-state="done"] .tph-room__badge{background:#66BB6A;color:#fff}
  .tph-room[data-state="error"] .tph-room__badge{background:#EF5350;color:#fff}
  .tph-room[data-state="rework"] .tph-room__badge{background:#FFA726;color:#fff;animation:tph-blink 1s infinite}
  @keyframes tph-blink{
    0%,100%{opacity:1}
    50%{opacity:0.55}
  }

  /* 방 내부 — 책상 + 블롭 캐릭터 */
  .tph-room__floor{position:relative;z-index:1;flex:1;height:100%;width:100%;overflow:visible;border-radius:10px}
  .tph-character{
    position:absolute;left:50%;bottom:28%;transform:translateX(-50%);
    width:22px;height:26px;
    z-index:3;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.18));
  }

  /* 기본 idle — 블롭 통통 튀기 */
  .tph-character{animation:tph-idle-bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
  .tph-room[data-state="idle"] .tph-character{
    animation:tph-idle-bob 1.8s ease-in-out infinite;
  }
  .tph-room[data-state="working"] .tph-character{
    animation:tph-working-wobble 0.7s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  .tph-room[data-state="done"] .tph-character{
    animation:tph-done-jump 0.55s ease-out 3;
    transform-origin:50% 100%;
  }
  .tph-room[data-state="error"] .tph-character{
    animation:tph-char-shake 0.3s ease-in-out 4;
  }
  .tph-room[data-state="rework"] .tph-character{
    animation:tph-working-wobble 0.8s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  .tph-room[data-state="walking"] .tph-character{
    animation:tph-walking 0.4s ease-in-out infinite;
    transform-origin:50% 100%;
  }

  /* 블롭 애니메이션 (Middle Management 스타일) */
  @keyframes tph-idle-bob{
    0%,100%{transform:translateX(-50%) translateY(0) scaleY(1)}
    50%{transform:translateX(-50%) translateY(-3px) scaleY(1.05)}
  }
  @keyframes tph-working-wobble{
    0%,100%{transform:translateX(-50%) rotate(-4deg)}
    50%{transform:translateX(-50%) rotate(4deg)}
  }
  @keyframes tph-done-jump{
    0%{transform:translateX(-50%) translateY(0) scale(1)}
    40%{transform:translateX(-50%) translateY(-10px) scale(1.1,0.95)}
    100%{transform:translateX(-50%) translateY(0) scale(1)}
  }
  @keyframes tph-char-shake{
    0%,100%{transform:translateX(-50%)}
    25%{transform:translate(calc(-50% - 3px))}
    75%{transform:translate(calc(-50% + 3px))}
  }
  @keyframes tph-walking{
    0%,100%{transform:translateX(-50%) translateY(0) scaleX(1)}
    25%{transform:translateX(-50%) translateY(-2px) scaleX(0.95)}
    75%{transform:translateX(-50%) translateY(-2px) scaleX(1.05)}
  }

  /* 캐릭터 머리 위 이모지 (휴게실 쉬는 중 표시) */
  .tph-char-emoji{
    position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    font-size:11px;line-height:1;margin-bottom:2px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));
    pointer-events:none;white-space:nowrap;
    animation:tph-emoji-fade 0.3s ease-out;
  }
  @keyframes tph-emoji-fade{from{opacity:0;transform:translate(-50%, 4px)}to{opacity:1;transform:translateX(-50%)}}

  /* ── 상무실/휴게실 이동 — 복도 경유 리프팅 캐릭터 ── */
  .tph-character.tph-walk-lifted{
    transition:left 0.55s ease-in-out, top 0.55s ease-in-out;
    z-index:50;
  }
  .tph-character.tph-walk-lifted.is-walking{
    animation:tph-walking-lifted 0.4s ease-in-out infinite;
  }
  .tph-character.tph-walk-lifted.is-reporting{
    animation:tph-reporting-bob 1.1s ease-in-out infinite;
  }
  @keyframes tph-walking-lifted{
    0%,100%{transform:translateY(0) scaleX(1)}
    25%{transform:translateY(-2px) scaleX(0.95)}
    75%{transform:translateY(-2px) scaleX(1.05)}
  }
  @keyframes tph-reporting-bob{
    0%,100%{transform:translateY(0) scaleY(1)}
    50%{transform:translateY(-2px) scaleY(1.04)}
  }

  /* 책상 — 심플 24×12 */
  .tph-desk{
    position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
    width:24px;height:12px;
    background:linear-gradient(180deg, #A1887F 0%, #6D4C41 100%);
    border:none;border-radius:2px;
    box-shadow:0 1px 0 #5D4037, inset 0 1px 0 rgba(255,255,255,0.22);
    z-index:2;
  }
  /* 의자 — 심플 10×8 */
  .tph-chair{
    position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
    width:10px;height:8px;
    background:#546E7A;
    border:none;
    border-radius:2px 2px 1px 1px;
    box-shadow:0 1px 0 #37474F;
    z-index:2;
  }
  /* 모니터/문/방 바닥/벽 하이라이트/화분 — 오픈 플로어에서 제거 */
  .tph-monitor,
  .tph-door,
  .tph-floor-planks,
  .tph-wall-top,
  .tph-plant{ display:none }

  /* 진행바 (방 하단) */
  .tph-room__progress{
    position:absolute;left:8px;right:8px;bottom:3px;height:3px;
    background:rgba(80,60,45,0.14);overflow:hidden;z-index:3;border-radius:2px;
  }
  .tph-room__progress-fill{
    height:100%;width:0;
    background:linear-gradient(90deg, #42A5F5, #64B5F6);
    transition:width 0.4s ease-out;border-radius:2px;
  }

  /* 말풍선 — 파스텔 모던 (흰 배경 + 소프트 섀도우) */
  .tph-bubble{
    position:absolute;left:50%;top:2px;transform:translateX(-50%);
    background:#FFFFFF;color:var(--text-dark);
    padding:3px 7px;font-size:10px;font-weight:600;border-radius:10px;
    border:1px solid rgba(80,60,45,0.2);
    white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
    pointer-events:none;z-index:8;
    opacity:0;transition:opacity 0.2s;
    box-shadow:0 2px 6px rgba(80,60,45,0.18);
  }
  .tph-bubble::after{
    content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#FFFFFF;
    filter:drop-shadow(0 1px 0 rgba(80,60,45,0.15));
  }
  .tph-bubble.show{opacity:1}

  /* 상무 테이블 — 우측 상단 (800×440 viewBox, sanmooZone 560,50→780,140 히트박스) */
  .tph-ceo-office{
    position:absolute;
    left:70%;top:11%;width:28%;height:21%;
    background:transparent;
    border:none;
    box-shadow:none;
    display:block;
    overflow:visible;
    z-index:3;
    pointer-events:none;
  }
  .tph-ceo-office.active{
    animation:tph-gold-pulse 1.4s ease-in-out infinite;
  }
  /* 구 상무실 내부 장식 (head / 바닥 데스크/화분) 숨김 — 배경 SVG 에 이미 그려짐 */
  .tph-ceo-office__head{ display:none }
  .tph-ceo-office__floor::before,
  .tph-ceo-office__floor::after{ content:none; display:none }
  /* 휴게실 내부 장식 숨김 */
  .tph-break-room__head,
  .tph-break-room__floor::before,
  .tph-break-room__floor::after,
  .tph-break-tv, .tph-break-vending, .tph-break-table,
  .tph-break-plant-l, .tph-break-plant-r{ display:none }
  @keyframes tph-gold-pulse{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.08)}
  }
  .tph-ceo-office__head{
    padding:3px 10px;
    background:transparent;
    color:#6B4E0A;font-weight:800;font-size:9px;letter-spacing:0.6px;
    border-bottom:none;
    text-shadow:0 1px 0 rgba(255,255,255,0.5);
  }
  .tph-ceo-office__floor{flex:1;position:relative;border-radius:0 0 12px 12px;overflow:hidden}
  .tph-ceo-character{
    position:absolute;left:50%;bottom:22%;transform:translateX(-50%);
    width:24px;height:28px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.2));
  }
  .tph-ceo-office.active .tph-ceo-character{animation:tph-done-jump 1.6s ease-in-out infinite}

  .tph-ceo-office__floor::before{
    content:"";position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:48px;height:9px;
    background:linear-gradient(180deg, #A1887F 0%, #6D4C41 100%);
    border:none;border-radius:3px;
    box-shadow:0 2px 0 #5D4037;
  }
  .tph-ceo-office__floor::after{
    content:"";position:absolute;right:6px;bottom:4px;
    width:9px;height:13px;
    background:radial-gradient(ellipse at 50% 35%, #81C784 0%, #388E3C 60%, transparent 65%),
               linear-gradient(180deg, transparent 65%, #A1887F 65%, #6D4C41 100%);
  }

  /* ── 휴게실 — 우측 하단 (800×440 viewBox, loungeZone 560,300→780,420 히트박스) ── */
  .tph-break-room{
    position:absolute;
    left:70%;top:68%;width:28%;height:27%;
    background:transparent;
    border:none;
    box-shadow:none;
    overflow:visible;
    display:block;
    z-index:3;
    pointer-events:none;
  }
  /* 미팅룸 — 우측 중단 (meetingZone 560,170→780,280 히트박스) */
  .tph-meeting-room{
    position:absolute;
    left:70%;top:39%;width:28%;height:25%;
    background:transparent;
    border:none;
    overflow:visible;
    z-index:3;
    pointer-events:none;
  }
  .tph-meeting-room.active{
    animation:tph-meeting-pulse 1.8s ease-in-out infinite;
  }
  @keyframes tph-meeting-pulse{
    0%,100%{ filter:none }
    50%    { filter:drop-shadow(0 0 8px rgba(90,122,168,0.55)) }
  }
  .tph-break-room__head{
    padding:4px 10px;background:transparent;
    color:rgba(50,70,50,0.85);font-weight:700;font-size:9px;letter-spacing:0.5px;
    border-bottom:none;text-shadow:0 1px 0 rgba(255,255,255,0.5);
  }
  .tph-break-room__floor{flex:1;position:relative}
  /* 소파 좌 */
  .tph-break-room__floor::before{
    content:"";position:absolute;left:10px;top:30%;
    width:26px;height:12px;
    background:linear-gradient(180deg, #8b5a2b 0%, #6b4219 100%);
    border:1px solid #3a2410;border-radius:3px 3px 1px 1px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 0 rgba(0,0,0,0.3);
  }
  /* 소파 우 */
  .tph-break-room__floor::after{
    content:"";position:absolute;right:10px;top:30%;
    width:26px;height:12px;
    background:linear-gradient(180deg, #8b5a2b 0%, #6b4219 100%);
    border:1px solid #3a2410;border-radius:3px 3px 1px 1px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 0 rgba(0,0,0,0.3);
  }
  /* 커피 테이블 / 자판기 / TV / 화분 */
  .tph-break-table{
    position:absolute;left:50%;top:52%;transform:translateX(-50%);
    width:22px;height:8px;
    background:linear-gradient(180deg, #a58844 0%, #6B4E0A 100%);
    border:1px solid #3a2410;border-radius:2px;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  .tph-break-table::after{
    content:"";position:absolute;top:1px;left:50%;transform:translateX(-50%);
    width:6px;height:3px;background:#6b3419;border-radius:1px;
  }
  .tph-break-vending{
    position:absolute;right:6px;bottom:6px;
    width:18px;height:28px;
    background:linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
    border:1.5px solid #5a1010;border-radius:2px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,0.15);
  }
  .tph-break-vending::before{
    content:"";position:absolute;top:3px;left:2px;
    width:13px;height:8px;background:#1a1a2e;border:1px solid #000;border-radius:1px;
  }
  .tph-break-vending::after{
    content:"";position:absolute;bottom:3px;left:2px;
    width:13px;height:4px;background:#fef9ec;border:1px solid #000;border-radius:1px;
  }
  .tph-break-tv{
    position:absolute;left:6px;top:6px;
    width:22px;height:14px;
    background:#1a1a2e;border:2px solid #2a1a0a;border-radius:2px;
    box-shadow:0 2px 0 rgba(0,0,0,0.3), inset 0 0 0 1px #374a70;
  }
  .tph-break-tv::after{
    content:"";position:absolute;inset:2px;
    background:linear-gradient(135deg, #4a90d9 0%, #2a5580 100%);
    animation:tph-tv-flicker 1.6s ease-in-out infinite;
  }
  @keyframes tph-tv-flicker{
    0%,100%{opacity:0.85}50%{opacity:1}
  }
  .tph-break-plant-l, .tph-break-plant-r{
    position:absolute;
    width:11px;height:15px;
    background:radial-gradient(ellipse at 50% 35%, #66BB6A 0%, #2E7D32 60%, transparent 65%),
               linear-gradient(180deg, transparent 62%, #8B6914 62%, #6B4E0A 100%);
  }
  .tph-break-plant-l{left:32px;bottom:6px}
  .tph-break-plant-r{right:30px;bottom:38px}

  /* CRITIC 캐릭터 (복도) */
  .tph-critic{
    position:absolute;
    width:24px;height:32px;
    transition:left 0.8s ease-in-out, top 0.8s ease-in-out;
    z-index:4;image-rendering:pixelated;
    pointer-events:none;
  }
  .tph-critic.show{opacity:1}
  .tph-critic.hide{opacity:0}

  /* 우하단 원형 게이지 — 휴게실 공간 확보를 위해 비활성 (HUD 에 카운터 노출됨) */
  .tph-gauge{
    display:none;
    position:absolute;right:24px;bottom:24px;
    width:80px;height:80px;
    background:rgba(245,240,232,0.92);border:3px solid var(--gold-strong);border-radius:50%;
    align-items:center;justify-content:center;
    flex-direction:column;
    box-shadow:0 0 18px rgba(201,168,76,0.35), 0 3px 0 rgba(107,78,10,0.3);
    z-index:5;
  }
  .tph-gauge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .tph-gauge__text{font-family:ui-monospace,monospace;font-weight:800;color:var(--wood-dark);font-size:14px;line-height:1.1;text-align:center;z-index:1}
  .tph-gauge__sub{font-size:9px;color:var(--text-mid);letter-spacing:0.6px;font-weight:700}

  /* ─── 채팅 패널 — 아이보리 (Phase A: 다크 테마 제거) ─────────────────── */
  .chat{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--chat);position:relative}
  .chat-header{padding:10px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .chat-title{font-size:15.5px;font-weight:600;color:var(--text);cursor:pointer;padding:3px 8px;border-radius:5px;border:1px solid transparent;outline:none;max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-title:hover{border-color:var(--border)}
  .chat-title[contenteditable="true"]{border-color:var(--accent);background:var(--input)}

  .chat-log{flex:1;overflow-y:auto;padding:18px 28px 12px;display:flex;flex-direction:column;gap:14px;min-height:0;scroll-behavior:smooth}
  .chat-log::-webkit-scrollbar{width:6px}
  .chat-log::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:4px}
  .chat-empty{color:var(--text-dim);font-size:15px;text-align:center;padding:80px 20px}
  .chat-empty h3{margin:0 0 6px;font-size:18px;color:var(--text-soft);font-weight:600}

  /* Project Home (activeThreadId === null && activeProjectId !== __general__) */
  .project-home{max-width:720px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;background:var(--chat)}
  .project-home__icon{font-size:48px;line-height:1;margin-bottom:2px}
  .project-home__title{font-size:20px;font-weight:700;color:var(--text);word-break:break-word}
  .project-home__desc{font-size:14px;color:var(--text-soft);line-height:1.6}
  .project-home__btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
  .project-home__btn:hover{background:var(--accent-hover)}
  .project-home__threads{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .project-thread-card{position:relative;display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
  .project-thread-card:hover{background:#E8E6E0;border-color:rgba(140,130,115,0.4)}
  .project-thread-card__info{flex:1;min-width:0}
  .project-thread-card__title{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:2px;word-break:break-word}
  .project-thread-card__meta{font-size:12px;color:var(--text-soft)}
  .project-thread-card__menu{flex-shrink:0;opacity:0;transition:opacity .12s}
  .project-thread-card:hover .project-thread-card__menu{opacity:1}
  .project-thread-card__menu-btn{width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:var(--text-soft);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .project-thread-card__menu-btn:hover{background:rgba(140,130,115,0.18);color:var(--text)}

  .msg{display:flex;flex-direction:column;gap:3px;animation:msg-in .2s ease-out;max-width:100%;position:relative}
  @keyframes msg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;align-items:flex-end;max-width:min(80%,760px)}
  .msg:not(.user){align-self:flex-start;align-items:flex-start;max-width:100%;width:100%}
  .msg .who{font-size:12.5px;color:var(--text-dim);margin-bottom:2px;padding:0 4px;display:flex;align-items:center;gap:5px}
  .msg .body{padding:11px 15px;border-radius:14px;font-size:15.5px;line-height:1.65;word-break:break-word;background:var(--surface);border:1px solid var(--border-soft);color:var(--text);max-width:100%;box-shadow:0 1px 3px rgba(100,90,70,.06)}
  .msg.user .body{background:var(--user-bubble);border-color:var(--user-bubble-border);color:var(--user-bubble-text);border-bottom-right-radius:4px;white-space:pre-wrap;box-shadow:0 2px 8px rgba(201,100,66,.18)}
  .msg:not(.user) .body{border-bottom-left-radius:4px}
  .msg.dept .who .dot{width:7px;height:7px;border-radius:50%;background:var(--dept-color,#9ca3af)}
  .msg.ceo .body{border:1px solid #C9A84C;border-left:4px solid #C9A84C;background:linear-gradient(135deg,#FDF8EC 0%,#FFF7DA 100%);box-shadow:0 0 14px rgba(201,168,76,.18),0 1px 3px rgba(100,90,70,.06)}
  .msg.ceo .who{color:#C9A84C;font-weight:700}
  .msg.ceo .who::before{content:'★ ';color:#C9A84C}
  .msg.critic .body{border-left:3px solid var(--magenta);background:#FBEFF3}
  .msg.critic .who{color:var(--magenta);font-weight:600}
  .msg.sys{align-self:center;max-width:100%;align-items:center}
  .msg.sys .body{background:transparent;border:none;padding:2px 6px;color:var(--text-dim);font-size:13.5px;font-style:italic}
  .msg.err .body{background:rgba(185,65,65,.08);border-color:rgba(185,65,65,.3);color:#fca5a5}

  /* markdown body */
  .md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;font-weight:700;color:var(--text)}
  .md h1{font-size:20px} .md h2{font-size:18px} .md h3{font-size:16.5px} .md h4{font-size:15px}
  .md p{margin:6px 0}
  .md ul,.md ol{margin:6px 0;padding-left:22px}
  .md li{margin:2px 0}
  .md code.inline{background:rgba(0,0,0,.06);border:1px solid var(--border-soft);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;color:#6c2fbf}
  .md pre{position:relative;background:#F7F5EE;border:1px solid var(--border-soft);border-radius:8px;padding:12px;margin:8px 0;overflow:auto;font-size:14.5px;color:#2a2520}
  .md pre code{font-family:ui-monospace,Menlo,Consolas,monospace;display:block;white-space:pre;background:transparent}
  .md pre .copy-code{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);border:1px solid var(--border-soft);color:var(--text-soft);font-size:12.5px;padding:2px 7px;border-radius:5px;cursor:pointer;opacity:0;transition:opacity .15s}
  .md pre:hover .copy-code{opacity:1}
  .md pre .copy-code:hover{background:rgba(140,130,115,.28)}
  .md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .md table{border-collapse:collapse;margin:8px 0;font-size:14.5px}
  .md th,.md td{border:1px solid var(--border);padding:5px 9px}
  .md th{background:rgba(0,0,0,.04);font-weight:600}
  .md strong{font-weight:700;color:var(--text)}
  .md em{font-style:italic}
  .md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid #C9A84C;background:rgba(201,168,76,.08);color:var(--text-soft);border-radius:0 4px 4px 0}
  .md del{text-decoration:line-through;color:var(--text-dim);opacity:.7}
  .md .sec{font-size:12.5px;color:var(--text-dim);font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:.4px}
  .md hr{border:none;border-top:1px solid var(--border-soft);margin:12px 0}

  .msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;margin-top:4px;padding:0 4px}
  .msg:hover .msg-actions,.msg-actions.is-open{opacity:1}
  .msg-actions button{background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:13.5px;padding:3px 7px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .msg-actions button:hover{background:rgba(0,0,0,.06);border-color:var(--border-soft);color:var(--text)}
  .msg-actions button.thumb-up.on{color:var(--green)}
  .msg-actions button.thumb-down.on{color:var(--red)}

  .edit-area{display:flex;flex-direction:column;gap:6px;width:100%}
  .edit-area textarea{background:var(--input);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:15px;min-height:64px;resize:vertical;outline:none}
  .edit-area .row{display:flex;gap:6px;justify-content:flex-end;font-size:13px;color:var(--text-dim)}
  .edit-area button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-soft);cursor:pointer;font-size:14px}
  .edit-area button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .ver-nav{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--text-dim);margin-left:6px}
  .ver-nav button{background:transparent;border:1px solid transparent;color:var(--text-dim);padding:0 5px;border-radius:4px;cursor:pointer;font-size:14px;line-height:1.3}
  .ver-nav button:hover:not(:disabled){color:var(--text);border-color:var(--border-soft)}
  .ver-nav button:disabled{opacity:.35;cursor:not-allowed}

  .to-bottom{position:absolute;right:24px;bottom:calc(var(--input-h,96px) + 8px);width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-soft);cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(100,90,70,.14);z-index:8}
  .to-bottom.visible{display:flex}
  .to-bottom:hover{color:var(--text);background:var(--surface-hi)}

  /* chat input */
  .chat-input{padding:10px 20px 16px;border-top:1px solid var(--border-soft);background:var(--chat);flex-shrink:0;position:relative}
  .chat-input.drag-over .chat-input-wrap{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
  .chat-input-wrap{position:relative;background:var(--input);border:1px solid var(--border);border-radius:16px;padding:12px 54px 12px 48px;transition:border-color .15s,box-shadow .15s}
  .chat-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.16)}
  .chat-input-wrap textarea{width:100%;height:auto;background:transparent;border:none;outline:none;resize:none;min-height:24px;max-height:160px;line-height:1.55;color:var(--text);font-size:16px;display:block;overflow-y:auto}
  .chat-input-wrap textarea::placeholder{color:var(--text-dim)}
  .chat-input-wrap textarea.is-locked{opacity:.55;cursor:not-allowed}
  .chat-input-wrap:has(textarea.is-locked){background:rgba(0,0,0,.03)}

  .attach-btn{position:absolute;left:8px;bottom:8px;width:32px;height:32px;border:none;border-radius:9px;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .attach-btn:hover{background:rgba(0,0,0,.06);color:var(--text)}

  .send-btn{position:absolute;right:7px;bottom:7px;width:34px;height:34px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .15s,background .15s}
  .send-btn:hover:not(:disabled){filter:brightness(1.1)}
  .send-btn:disabled{opacity:.45;cursor:not-allowed}
  .send-btn.stop{background:var(--red)}

  .chat-hint{margin-top:6px;font-size:12.5px;color:var(--text-dim)}
  .chat-hint kbd{background:var(--input);border:1px solid var(--border);padding:1px 5px;border-radius:3px;font-size:12px;color:var(--text-soft)}

  .attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .attach-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:3px 8px 3px 10px;font-size:13.5px;color:var(--text-soft);max-width:240px}
  .attach-chip .name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach-chip .size{color:var(--text-dim);font-size:12px}
  .attach-chip .rm{cursor:pointer;color:var(--text-dim);border:none;background:none;padding:2px 4px;border-radius:4px}
  .attach-chip .rm:hover{color:var(--red);background:rgba(185,65,65,.1)}
  .attach-chip img.thumb{width:18px;height:18px;border-radius:3px;object-fit:cover}

  /* slash command dropdown */
  .slash-menu{position:absolute;left:16px;right:16px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(100,90,70,.22);overflow:hidden;z-index:20;max-height:280px;overflow-y:auto}
  .slash-menu .item{padding:8px 12px;display:grid;grid-template-columns:56px 1fr;gap:10px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--border-soft)}
  .slash-menu .item:last-child{border-bottom:none}
  .slash-menu .item .cmd{color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:600}
  .slash-menu .item .desc{color:var(--text-soft);font-size:14px}
  .slash-menu .item.active{background:rgba(201,100,66,.12)}

  /* right panel */
  .panel{background:var(--panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
  .panel-resize{position:absolute;top:0;left:-3px;width:6px;height:100%;cursor:ew-resize;z-index:5;background:transparent}
  .panel-resize:hover{background:rgba(201,100,66,.25)}
  .panel-inner{width:100%;display:flex;flex-direction:column;min-width:0;height:100%}
  .panel-tabs{display:flex;border-bottom:1px solid var(--border-soft);flex-shrink:0}
  .tab-btn{flex:1;padding:12px 4px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12.5px;font-weight:500;transition:color .12s,background .12s;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab-btn:hover{color:var(--text-soft);background:rgba(255,255,255,.02)}
  .tab-btn.active{color:var(--text)}
  .tab-btn.active::after{content:'';position:absolute;bottom:0;left:12px;right:12px;height:2px;background:var(--accent);border-radius:2px}
  .panel-body{flex:1;overflow-y:auto;padding:14px 16px}
  .panel-body::-webkit-scrollbar{width:5px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:3px}
  .panel-sec{margin-bottom:16px}
  .panel-sec h4{font-size:12px;color:var(--text-dim);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}
  .dept-row{display:grid;grid-template-columns:18px 1fr 54px;gap:8px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--border-soft)}
  .dept-row:last-child{border-bottom:none}
  .dept-row .ddot{width:8px;height:8px;border-radius:50%;background:var(--dept-color,#374151)}
  .dept-row .dname{color:var(--text-soft)}
  .dept-row.working .dname{color:var(--text)}
  .dept-row .dstate{font-size:12.5px;color:var(--text-dim);text-align:right;letter-spacing:.3px}
  .dept-row.working .dstate{color:var(--accent)}
  .dept-row.done .dstate{color:var(--green)}
  .dept-row.err .dstate{color:var(--red)}
  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .kpi-tile{background:var(--surface);border:1px solid var(--border-soft);padding:9px 10px;border-radius:8px}
  .kpi-tile .label{font-size:12px;color:var(--text-dim);margin-bottom:2px}
  .kpi-tile .val{font-size:16px;font-weight:600;color:var(--text)}
  .panel-empty{color:var(--text-dim);font-size:13.5px;font-style:italic;padding:40px 8px;text-align:center}

  /* toggle buttons */
  .toggle-btn{position:fixed;z-index:50;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.88);color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:background .12s,color .12s,transform .2s}
  .toggle-btn:hover{background:var(--surface);color:var(--text)}
  .toggle-sidebar{top:10px;left:8px;transition:left .25s ease}
  .app[data-sidebar="open"] .toggle-sidebar{left:calc(var(--sidebar-w,260px) - 38px)}

  /* 우측 패널 상단 토글 버튼 (탭바 맨 오른쪽) */
  .panel-tab-toggle{
    margin-left:auto;background:transparent;border:none;cursor:pointer;
    color:var(--gold-strong);font-size:12px;font-weight:700;padding:4px 9px;
    border-left:1px solid var(--border-soft);align-self:stretch;flex-shrink:0;
    transition:background .15s;
  }
  .panel-tab-toggle:hover{background:rgba(201,168,76,0.15);color:#a07f2e}
  /* 패널 닫힘 상태: 탭/본문 숨기고 토글만 노출 */
  .app[data-panel="closed"] .tab-btn:not(.panel-tab-toggle){display:none}
  .app[data-panel="closed"] .panel-body{display:none}
  .app[data-panel="closed"] .panel-resize{display:none}
  .app[data-panel="closed"] .panel-tab-toggle{border-left:none;margin-left:0}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:14.5px;z-index:300;box-shadow:0 10px 30px rgba(100,90,70,.22);opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>

              <svg viewBox="0 0 24 28" width="100%" height="100%">

<script>
(() => {
  const API_BASE = location.origin.includes('localhost') ? 'http://localhost:8000' : '';

  // departments
  // shortKr: 방 카드 라벨 전용 (긴 이름 잘림 방지). 채팅 bubble 에서는 kr 사용.
  const DEPTS = [
    { id:'market',    kr:'시장조사', shortKr:'시장',   color:0x3b82f6, hex:'#3b82f6' },
    { id:'marketing', kr:'마케팅',   shortKr:'마케팅', color:0xec4899, hex:'#ec4899' },
    { id:'finance',   kr:'재무',     shortKr:'재무',   color:0x22c55e, hex:'#22c55e' },
    { id:'legal',     kr:'법무',     shortKr:'법무',   color:0xa855f7, hex:'#a855f7' },
    { id:'compete',   kr:'경쟁분석', shortKr:'경쟁',   color:0xef4444, hex:'#ef4444' },
    { id:'rnd',       kr:'R&D',      shortKr:'R&D',    color:0xf97316, hex:'#f97316' },
    { id:'data',      kr:'데이터',   shortKr:'데이터', color:0x06b6d4, hex:'#06b6d4' },
    { id:'content',   kr:'콘텐츠',   shortKr:'콘텐츠', color:0xeab308, hex:'#eab308' },
    { id:'sns',       kr:'SNS',      shortKr:'SNS',    color:0x14b8a6, hex:'#14b8a6' },
    { id:'design',    kr:'디자인',   shortKr:'디자인', color:0xD94A9B, hex:'#D94A9B' },
  ];
  const DEPT_BY_ID = Object.fromEntries(DEPTS.map(d => [d.id, d]));

  // ─── TPH (Two Point Hospital) 스타일 오피스 — DOM 기반 렌더 ─────────────────
  // CustomEvent('office-event') 를 구독해서 방/캐릭터/진행률 갱신.
  // Phaser 씬은 비활성 (display:none) 상태이지만 기존 핸들러는 그대로 유지.
  // 부모 React 앱과는 postMessage 로 진행 상태 동기화.
  const TPH_DEPT_ICON = {
    market: '📊', compete: '⚔️', legal: '⚖️', finance: '💰',
    marketing: '📣', rnd: '🔬', data: '📈', content: '✍️', sns: '📱', design: '🎨',
  };
  const TPH_DEPT_BODY = {
    market: '#3b82f6', compete: '#ef4444', legal: '#22c55e', finance: '#fbbf24',
    marketing: '#ec4899', rnd: '#06b6d4', data: '#94a3b8', content: '#f97316', sns: '#14b8a6', design: '#D94A9B',
  };
  // 5×2 그리드 배치 — 행1: 5개 + 상무실(우측), 행2: 5개 + 휴게실(우측)
  const TPH_LAYOUT = [
    'market', 'compete', 'legal', 'finance', 'marketing',
    'rnd', 'data', 'content', 'sns', 'design',
  ];

  // 부서별 블롭 캐릭터 액세서리 — 블롭 바디 위에 덧입히는 작은 포인트 요소
  // 좌표계: 24×30 (바디는 둥근 블롭, 얼굴 y=8-14 중앙, 액세서리는 머리/손에 얹음)
  function tphAccessorySvg(deptId) {
    switch (deptId) {
      case 'market':    // 작은 돋보기
        return `<circle cx="18" cy="13" r="2.2" fill="none" stroke="#37474F" stroke-width="1"/>

  function tphInitGrid() {
    const grid = document.getElementById('tphGrid');
    if (!grid) return;
    grid.innerHTML = '';
    // 배경 SVG (오픈 오피스 바닥 + 벽 + 책상 가구 + 3개 구역)
    grid.insertAdjacentHTML('beforeend', tphBuildOfficeBgSvg());
    TPH_LAYOUT.forEach((deptId) => {
      const d = DEPT_BY_ID[deptId];
      const pos = TPH_DESK_POS[deptId];
      const room = document.createElement('div');
      room.className = 'tph-room';
      room.dataset.dept = deptId;
      room.dataset.state = 'idle';
      // 70×62 컨테이너를 책상 좌표 중앙에 배치
      room.style.left = `calc(${(pos.x / VB_W * 100).toFixed(2)}% - 35px)`;
      room.style.top  = `calc(${(pos.y / VB_H * 100).toFixed(2)}% - 28px)`;
      room.innerHTML = `
        <div class="tph-room__head">
          <span class="tph-room__icon">${TPH_DEPT_ICON[deptId] || '📁'}</span>
          <span class="tph-room__name">${d ? (d.shortKr || d.kr) + '팀' : deptId.toUpperCase()}</span>
          <span class="tph-room__badge">IDLE</span>
        </div>
        <div class="tph-room__floor">
          <div class="tph-character">${tphBuildCharacterSvg(deptId)}</div>
          <div class="tph-bubble"></div>
          <div class="tph-room__progress"><div class="tph-room__progress-fill"></div></div>
        </div>`;
      grid.appendChild(room);
    });
  }

  const _tphState = { done: 0, total: 10, missionStartedAt: 0 };

  function tphSetMission(text) {
    const el = document.getElementById('tphMission');
    if (el) el.textContent = text || '— 대기 중 —';
  }

  // 부서별 진행바 interval ID — 누수 방지 위해 dept_done/error 시 반드시 정리.
  const _tphProgressIntervals = new Map();

  function tphClearProgressInterval(deptId) {
    const id = _tphProgressIntervals.get(deptId);
    if (id != null) { clearInterval(id); _tphProgressIntervals.delete(deptId); }
  }

  function tphSetRoomFill(deptId, percent, color) {
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    if (!room) return;
    const fill = room.querySelector('.tph-room__progress-fill');
    if (!fill) return;
    fill.style.width = Math.max(0, Math.min(100, percent)) + '%';
    fill.style.opacity = '1';
    if (color) fill.style.background = color;
  }

  function tphFadeRoomFill(deptId, ms = 500) {
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    if (!room) return;
    const fill = room.querySelector('.tph-room__progress-fill');
    if (!fill) return;
    fill.style.transition = `opacity ${ms}ms ease-out`;
    fill.style.opacity = '0';
    setTimeout(() => {
      fill.style.width = '0%';
      fill.style.transition = 'width 0.4s ease-out';
      fill.style.opacity = '';
    }, ms + 50);
  }

  function tphStartAutoProgress(deptId) {
    tphClearProgressInterval(deptId);
    let pct = 0;
    tphSetRoomFill(deptId, 0, 'linear-gradient(90deg, #3b82f6, #60a5fa)');
    const id = setInterval(() => {
      pct = Math.min(95, pct + 1.5);
      tphSetRoomFill(deptId, pct);
      if (pct >= 95) { clearInterval(id); _tphProgressIntervals.delete(deptId); }
    }, 1000);
    _tphProgressIntervals.set(deptId, id);
  }

  function tphSetRoomState(deptId, state) {
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    if (!room) return;
    room.dataset.state = state;
    const badge = room.querySelector('.tph-room__badge');
    if (badge) {
      const labels = { idle: 'IDLE', working: 'WORKING', done: 'DONE', error: 'ERROR', rework: 'REWORK' };
      badge.textContent = labels[state] || state.toUpperCase();
    }
    // 배경 SVG 책상에도 상태 반영 — 모니터 스크린 색상 전환용
    const desk = document.querySelector(`.tph-grid-bg .desk[data-dept="${deptId}"]`);
    if (desk) desk.dataset.state = state === 'idle' ? '' : state;
    // 진행바는 dept_start/done/error 핸들러에서 별도 제어 (state 변경만으로 강제 갱신하지 않음)
  }

  function tphSetBubble(deptId, text, ttlMs = 2400) {
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    if (!room) return;
    const bubble = room.querySelector('.tph-bubble');
    if (!bubble) return;
    bubble.textContent = text || '';
    bubble.classList.add('show');
    if (bubble._tphTimer) clearTimeout(bubble._tphTimer);
    bubble._tphTimer = setTimeout(() => { bubble.classList.remove('show'); }, ttlMs);
  }

  // working 상태 동안 말풍선 회전 (분석중/검색중/작성중/정리중)
  const TPH_WORKING_MESSAGES = ['분석 중 🔍', '검색 중 🌐', '작성 중 ✍️', '정리 중 📊'];
  const _tphWorkingBubbleTimers = new Map();
  function tphStartWorkingBubbleRotation(deptId) {
    tphStopWorkingBubbleRotation(deptId);
    let idx = 0;
    const tick = () => {
      const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
      if (!room || room.dataset.state !== 'working') {
        tphStopWorkingBubbleRotation(deptId);
        return;
      }
      tphSetBubble(deptId, TPH_WORKING_MESSAGES[idx % TPH_WORKING_MESSAGES.length], 2400);
      idx++;
    };
    tick();
    const id = setInterval(tick, 3000);
    _tphWorkingBubbleTimers.set(deptId, id);
  }
  function tphStopWorkingBubbleRotation(deptId) {
    const id = _tphWorkingBubbleTimers.get(deptId);
    if (id != null) { clearInterval(id); _tphWorkingBubbleTimers.delete(deptId); }
  }

  function tphUpdateProgress() {
    const text = document.getElementById('tphProgressText');
    const gaugeText = document.getElementById('tphGaugeText');
    const arc = document.getElementById('tphGaugeArc');
    const total = _tphState.total || 10;
    const done = Math.min(_tphState.done, total);
    if (text) text.textContent = String(done);
    if (gaugeText) gaugeText.textContent = `${done}/${total}`;
    if (arc) {
      const C = 213.6;  // 2*PI*34
      arc.setAttribute('stroke-dashoffset', String(C * (1 - done / total)));
    }
    // postMessage to parent (React app)
    try { window.parent.postMessage({ type: 'progress', done, total }, '*'); } catch {}
  }

  function tphResetAll() {
    _tphState.done = 0;
    for (const id of TPH_LAYOUT) {
      tphClearProgressInterval(id);
      tphStopWorkingBubbleRotation(id);
      tphSetRoomFill(id, 0);
      tphSetRoomState(id, 'idle');
    }
    document.getElementById('tphCeoOffice')?.classList.remove('active');
    const critic = document.getElementById('tphCritic');
    if (critic) critic.classList.add('hide');
    tphUpdateProgress();
  }

  function tphCriticWalkTo(deptId) {
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    const critic = document.getElementById('tphCritic');
    const stage = document.getElementById('tph-stage');
    if (!room || !critic || !stage) return;
    const stageRect = stage.getBoundingClientRect();
    const roomRect = room.getBoundingClientRect();
    const left = roomRect.left - stageRect.left + roomRect.width / 2 - 12;
    const top = roomRect.top - stageRect.top - 36;
    critic.classList.remove('hide');
    critic.classList.add('show');
    critic.style.left = left + 'px';
    critic.style.top = top + 'px';
    setTimeout(() => critic.classList.add('hide'), 4000);
  }

  /* ── Phase C: 부서 캐릭터 상무실 왕복 애니메이션 ─────────────────────
   * flow: 방 내부 .tph-character → #tph-stage 로 리프팅 →
   *       상무실 중앙으로 transition → holdMs 대기 →
   *       원래 방으로 transition → 원래 parent 로 복귀 → onReturn()
   *
   * 호출 중첩 방지: 같은 deptId 에 대해 진행 중이면 큐잉 대신 즉시 onReturn().
   */
  const _tphWalking = new Set();

  // 복도 Y좌표 (stage 기준) — 행1과 행2 사이. 복도 요소가 없으면 null.
  function _tphCorridorY(stageRect){
    const c = document.getElementById('tphCorridor');
    if (!c) return null;
    const cr = c.getBoundingClientRect();
    return cr.top - stageRect.top + cr.height / 2 - 12;
  }

  function tphWalkToSanmoo(deptId, holdMs, onReturn) {
    if (_tphWalking.has(deptId)) { onReturn?.(); return; }
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    const char = room?.querySelector('.tph-character');
    const ceo = document.getElementById('tphCeoOffice');
    const stage = document.getElementById('tph-stage');
    if (!room || !char || !ceo || !stage) { onReturn?.(); return; }

    _tphWalking.add(deptId);

    if (!char._tphHome) {
      char._tphHome = { parent: char.parentElement, nextSibling: char.nextSibling };
    }

    const charRect = char.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const ceoRect = ceo.getBoundingClientRect();
    const startX = charRect.left - stageRect.left;
    const startY = charRect.top - stageRect.top;
    const sanmooX = ceoRect.left - stageRect.left + ceoRect.width / 2 - 12;
    const sanmooY = ceoRect.top - stageRect.top + ceoRect.height * 0.55;
    const corridorY = _tphCorridorY(stageRect);

    stage.appendChild(char);
    char.classList.add('tph-walk-lifted', 'is-walking');
    char.style.position = 'absolute';
    char.style.left = startX + 'px';
    char.style.top = startY + 'px';
    char.style.bottom = 'auto';
    char.style.transform = 'none';

    // 복도 경유 이동 (3단: 방 → 복도 → 상무실) — 복도 없으면 직행
    const step2Delay = corridorY != null ? 400 : 0;
    const step3Delay = corridorY != null ? 550 : 700;

    requestAnimationFrame(() => {
      if (corridorY != null) {
        // 1단계: 자기 열에서 복도로 내려감
        char.style.left = startX + 'px';
        char.style.top = corridorY + 'px';
      } else {
        char.style.left = sanmooX + 'px';
        char.style.top = sanmooY + 'px';
      }
    });

    setTimeout(() => {
      if (corridorY != null) {
        // 2단계: 복도를 따라 상무실 방향으로 수평 이동
        char.style.left = sanmooX + 'px';
        char.style.top = corridorY + 'px';
      }
    }, step2Delay);

    setTimeout(() => {
      if (corridorY != null) {
        // 3단계: 복도에서 상무실 안으로 올라감
        char.style.left = sanmooX + 'px';
        char.style.top = sanmooY + 'px';
      }
    }, step2Delay + step3Delay);

    // 이동 완료 시점 = step2Delay + step3Delay + 550ms
    const arrivalMs = corridorY != null ? (step2Delay + step3Delay + 550) : 700;

    setTimeout(() => {
      char.classList.remove('is-walking');
      char.classList.add('is-reporting');
      setTimeout(() => {
        // 복귀: 복도 경유 반대 방향
        char.classList.remove('is-reporting');
        char.classList.add('is-walking');
        const rct = room.getBoundingClientRect();
        const srct = stage.getBoundingClientRect();
        const homeX = rct.left - srct.left + rct.width / 2 - 12;
        const homeY = rct.top - srct.top + rct.height * 0.62;
        const cY = _tphCorridorY(srct);

        if (cY != null) {
          // 1단계: 상무실 → 복도 (내려감)
          char.style.left = sanmooX + 'px';
          char.style.top = cY + 'px';
          // 2단계: 복도 수평 이동
          setTimeout(() => {
            char.style.left = homeX + 'px';
            char.style.top = cY + 'px';
          }, 400);
          // 3단계: 복도 → 자기 방 (올라감)
          setTimeout(() => {
            char.style.left = homeX + 'px';
            char.style.top = homeY + 'px';
          }, 950);
        } else {
          char.style.left = homeX + 'px';
          char.style.top = homeY + 'px';
        }

        const returnMs = cY != null ? 1500 : 700;
        setTimeout(() => {
          char.classList.remove('tph-walk-lifted', 'is-walking', 'is-reporting');
          char.style.cssText = '';
          const home = char._tphHome;
          if (home?.parent && home.parent.isConnected) {
            if (home.nextSibling && home.nextSibling.parentElement === home.parent) {
              home.parent.insertBefore(char, home.nextSibling);
            } else {
              home.parent.appendChild(char);
            }
          }
          _tphWalking.delete(deptId);
          onReturn?.();
        }, returnMs);
      }, holdMs);
    }, arrivalMs);
  }

  /* ── Collab 모드: 미팅룸 집결 (≥3 부서 선별 시) ───────────────────────── */
  function tphWalkToMeeting(deptId, holdMs, seatIdx, onReturn) {
    if (_tphWalking.has(deptId)) { onReturn?.(); return; }
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    const char = room?.querySelector('.tph-character');
    const meeting = document.getElementById('tphMeetingRoom');
    const stage = document.getElementById('tph-stage');
    if (!room || !char || !meeting || !stage) { onReturn?.(); return; }
    _tphWalking.add(deptId);
    if (!char._tphHome) char._tphHome = { parent: char.parentElement, nextSibling: char.nextSibling };
    const charRect = char.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const mRect = meeting.getBoundingClientRect();
    const startX = charRect.left - stageRect.left;
    const startY = charRect.top - stageRect.top;
    // 6 좌석 대각 배치 (테이블 주변)
    const col = seatIdx % 3, row = Math.floor(seatIdx / 3);
    const offsetX = col * 20 - 20;
    const offsetY = row * 16;
    const targetX = mRect.left - stageRect.left + mRect.width * 0.5 - 12 + offsetX;
    const targetY = mRect.top - stageRect.top + mRect.height * 0.55 + offsetY;

    stage.appendChild(char);
    char.classList.add('tph-walk-lifted', 'is-walking');
    char.style.position = 'absolute';
    char.style.left = startX + 'px';
    char.style.top = startY + 'px';
    char.style.bottom = 'auto';
    char.style.transform = 'none';
    requestAnimationFrame(() => {
      char.style.left = targetX + 'px';
      char.style.top = targetY + 'px';
    });

    setTimeout(() => {
      char.classList.remove('is-walking');
      char.classList.add('is-reporting');
      setTimeout(() => {
        char.classList.remove('is-reporting');
        char.classList.add('is-walking');
        const rct = room.getBoundingClientRect();
        const srct = stage.getBoundingClientRect();
        const homeX = rct.left - srct.left + rct.width / 2 - 12;
        const homeY = rct.top - srct.top + rct.height * 0.62;
        char.style.left = homeX + 'px';
        char.style.top = homeY + 'px';
        setTimeout(() => {
          char.classList.remove('tph-walk-lifted', 'is-walking', 'is-reporting');
          char.style.cssText = '';
          const home = char._tphHome;
          if (home?.parent && home.parent.isConnected) {
            if (home.nextSibling && home.nextSibling.parentElement === home.parent) {
              home.parent.insertBefore(char, home.nextSibling);
            } else {
              home.parent.appendChild(char);
            }
          }
          _tphWalking.delete(deptId);
          onReturn?.();
        }, 750);
      }, holdMs);
    }, 900);
  }

  function tphRunCollab(deptIds) {
    if (!Array.isArray(deptIds) || deptIds.length < 3) return;
    const meeting = document.getElementById('tphMeetingRoom');
    meeting?.classList.add('active');
    deptIds.forEach((id, i) => {
      setTimeout(() => {
        tphSetBubble(id, '협업 중 🤝', 2500);
        tphWalkToMeeting(id, 1800, i, () => {
          if (i === deptIds.length - 1) meeting?.classList.remove('active');
        });
      }, i * 180);
    });
  }

  /* ── Phase D: 휴게실 wander (idle 직원 주기적 방문) ─────────────────────
   * _charLocation: 각 부서 캐릭터의 현재 위치 ('desk' | 'break')
   * _breakReturnTimers: 휴게실에서 복귀 예약된 setTimeout id
   * dept_start 시 휴게실에 있으면 먼저 복귀 후 상무실 왕복.
   */
  const _charLocation = new Map();      // deptId → 'desk' | 'break'
  const _breakReturnTimers = new Map(); // deptId → timeoutId
  const BREAK_EMOJIS = ['☕', '😴', '🎵', '📱', '🍫'];
  const IDLE_WANDER_INTERVAL_MS = 15000;
  const BREAK_PROBABILITY = 0.25;
  const BREAK_REST_MIN_MS = 30000;
  const BREAK_REST_MAX_MS = 60000;

  // 휴게실 내부 랜덤 좌석 좌표 (소파 좌/우 중앙)
  function _tphBreakSeat() {
    const br = document.getElementById('tphBreakRoom');
    const stage = document.getElementById('tph-stage');
    if (!br || !stage) return null;
    const brRect = br.getBoundingClientRect();
    const stRect = stage.getBoundingClientRect();
    const leftSeat  = { x: brRect.left - stRect.left + 22, y: brRect.top - stRect.top + brRect.height * 0.35 };
    const rightSeat = { x: brRect.left - stRect.left + brRect.width - 32, y: brRect.top - stRect.top + brRect.height * 0.35 };
    return Math.random() < 0.5 ? leftSeat : rightSeat;
  }

  function tphGoToBreakRoom(deptId) {
    if (_tphWalking.has(deptId)) return;
    if (_charLocation.get(deptId) === 'break') return;
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    const char = room?.querySelector('.tph-character');
    const stage = document.getElementById('tph-stage');
    const seat = _tphBreakSeat();
    if (!room || !char || !stage || !seat) return;

    _tphWalking.add(deptId);
    _charLocation.set(deptId, 'break');

    if (!char._tphHome) {
      char._tphHome = { parent: char.parentElement, nextSibling: char.nextSibling };
    }
    const charRect = char.getBoundingClientRect();
    const stRect = stage.getBoundingClientRect();
    const startX = charRect.left - stRect.left;
    const startY = charRect.top - stRect.top;
    const corridorY = _tphCorridorY(stRect);
    stage.appendChild(char);
    char.classList.add('tph-walk-lifted', 'is-walking');
    char.style.position = 'absolute';
    char.style.left = startX + 'px';
    char.style.top = startY + 'px';
    char.style.bottom = 'auto';
    char.style.transform = 'none';

    // 복도 경유: 방 → 복도 Y → 휴게실 좌석
    requestAnimationFrame(() => {
      if (corridorY != null) {
        char.style.left = startX + 'px';
        char.style.top = corridorY + 'px';
      } else {
        char.style.left = seat.x + 'px';
        char.style.top = seat.y + 'px';
      }
    });
    setTimeout(() => {
      if (corridorY != null) {
        char.style.left = seat.x + 'px';
        char.style.top = corridorY + 'px';
      }
    }, 400);
    setTimeout(() => {
      if (corridorY != null) {
        char.style.left = seat.x + 'px';
        char.style.top = seat.y + 'px';
      }
    }, 950);

    const arriveMs = corridorY != null ? 1500 : 900;
    setTimeout(() => {
      char.classList.remove('is-walking');
      char.classList.add('is-reporting');
      _tphWalking.delete(deptId);
      const existing = char.querySelector('.tph-char-emoji');
      if (existing) existing.remove();
      const em = document.createElement('div');
      em.className = 'tph-char-emoji';
      em.textContent = BREAK_EMOJIS[Math.floor(Math.random() * BREAK_EMOJIS.length)];
      char.appendChild(em);

      const rest = BREAK_REST_MIN_MS + Math.random() * (BREAK_REST_MAX_MS - BREAK_REST_MIN_MS);
      const tid = setTimeout(() => {
        _breakReturnTimers.delete(deptId);
        tphReturnFromBreak(deptId);
      }, rest);
      _breakReturnTimers.set(deptId, tid);
    }, arriveMs);
  }

  function tphReturnFromBreak(deptId, onDone) {
    // 예약된 자동 복귀 타이머 취소
    const tid = _breakReturnTimers.get(deptId);
    if (tid != null) { clearTimeout(tid); _breakReturnTimers.delete(deptId); }

    if (_charLocation.get(deptId) !== 'break') { onDone?.(); return; }
    const char = document.querySelector(`#tph-stage > .tph-character`);
    // Above selector matches ANY lifted char; we need the right one via _tphHome ownership.
    // Iterate lifted chars and find the one whose _tphHome maps to this deptId's room.
    const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
    if (!room) { _charLocation.delete(deptId); onDone?.(); return; }
    const stage = document.getElementById('tph-stage');
    const liftedChars = stage.querySelectorAll(':scope > .tph-character');
    let myChar = null;
    for (const c of liftedChars) {
      if (c._tphHome && c._tphHome.parent && room.contains(c._tphHome.parent)) { myChar = c; break; }
    }
    if (!myChar) { _charLocation.delete(deptId); onDone?.(); return; }

    _tphWalking.add(deptId);
    myChar.querySelector('.tph-char-emoji')?.remove();
    myChar.classList.remove('is-reporting');
    myChar.classList.add('is-walking');

    const rct = room.getBoundingClientRect();
    const srct = stage.getBoundingClientRect();
    const homeX = rct.left - srct.left + rct.width / 2 - 10;
    const homeY = rct.top - srct.top + rct.height * 0.62;
    const corridorY = _tphCorridorY(srct);
    const curLeft = parseFloat(myChar.style.left) || homeX;

    // 복도 경유: 휴게실 → 복도 → 자기 방
    if (corridorY != null) {
      // 1: 휴게실에서 복도로 내려감
      myChar.style.left = curLeft + 'px';
      myChar.style.top = corridorY + 'px';
      // 2: 복도 수평 이동
      setTimeout(() => {
        myChar.style.left = homeX + 'px';
        myChar.style.top = corridorY + 'px';
      }, 400);
      // 3: 자기 방으로 올라감
      setTimeout(() => {
        myChar.style.left = homeX + 'px';
        myChar.style.top = homeY + 'px';
      }, 950);
    } else {
      myChar.style.left = homeX + 'px';
      myChar.style.top = homeY + 'px';
    }

    const doneMs = corridorY != null ? 1500 : 750;
    setTimeout(() => {
      myChar.classList.remove('tph-walk-lifted', 'is-walking', 'is-reporting');
      myChar.style.cssText = '';
      const home = myChar._tphHome;
      if (home?.parent && home.parent.isConnected) {
        if (home.nextSibling && home.nextSibling.parentElement === home.parent) {
          home.parent.insertBefore(myChar, home.nextSibling);
        } else {
          home.parent.appendChild(myChar);
        }
      }
      _tphWalking.delete(deptId);
      _charLocation.set(deptId, 'desk');
      onDone?.();
    }, doneMs);
  }

  function tphStartIdleWander() {
    setInterval(() => {
      // 미션 진행 중이면 wander 중단 (현재 어떤 부서도 working 이면 idle time 아님)
      const anyWorking = TPH_LAYOUT.some(id => {
        const r = document.querySelector(`.tph-room[data-dept="${id}"]`);
        return r && ['working','rework'].includes(r.dataset.state);
      });
      if (anyWorking) return;

      for (const deptId of TPH_LAYOUT) {
        const room = document.querySelector(`.tph-room[data-dept="${deptId}"]`);
        if (!room || room.dataset.state !== 'idle') continue;
        if (_tphWalking.has(deptId)) continue;
        if (_charLocation.get(deptId) === 'break') continue;
        if (Math.random() < BREAK_PROBABILITY) {
          tphGoToBreakRoom(deptId);
        }
      }
    }, IDLE_WANDER_INTERVAL_MS);

    // 초기 3초 후 — 랜덤 1~2명 휴게실 선배치 (ambiance)
    setTimeout(() => {
      const candidates = ['content', 'sns', 'data', 'design'];
      const pickCount = 1 + Math.floor(Math.random() * 2);
      const shuffled = candidates.slice().sort(() => Math.random() - 0.5);
      shuffled.slice(0, pickCount).forEach(d => tphGoToBreakRoom(d));
    }, 3000);
  }

  function tphHandleEvent(e) {
    const d = (e && e.detail) || {};
    switch (d.type) {
      case 'mission_start': {
        const topic = String(d.topic || '').trim();
        tphSetMission(topic ? topic.slice(0, 60) : '— 미션 수행 중 —');
        const total = Number(d.deptCount) || 10;
        _tphState.total = total;
        _tphState.done = 0;
        _tphState.missionStartedAt = Date.now();
        tphUpdateProgress();
        try { window.parent.postMessage({ type: 'missionStart', topic }, '*'); } catch {}
        break;
      }
      case 'executive_gate_done': {
        const ids = (d.departments || []).map(x => (x && x.id) || x).filter(Boolean);
        _tphState.total = Math.max(1, ids.length || 10);
        _tphState.done = 0;
        _tphState.missionStartedAt = Date.now();
        for (const id of TPH_LAYOUT) tphSetRoomState(id, ids.includes(id) ? 'idle' : 'idle');
        tphUpdateProgress();
        try { window.parent.postMessage({ type: 'missionStart', topic: '' }, '*'); } catch {}
        // ≥3 부서 선별 시 미팅룸 집결 (collab 모드) — dept_start 이전에 잠깐 모이는 컷신
        if (ids.length >= 3) tphRunCollab(ids);
        break;
      }
      case 'dept_start': {
        // Phase C/D: 휴게실에 있으면 먼저 복귀 → 상무실 왕복(미팅중) → working(분석중 회전)
        tphSetBubble(d.deptId, '미팅 중 💬', 2200);
        const runStart = () => {
          tphWalkToSanmoo(d.deptId, 1200, () => {
            tphSetRoomState(d.deptId, 'working');
            tphStartWorkingBubbleRotation(d.deptId);
            tphStartAutoProgress(d.deptId);
          });
        };
        if (_charLocation.get(d.deptId) === 'break') {
          tphReturnFromBreak(d.deptId, runStart);
        } else {
          runStart();
        }
        break;
      }
      case 'dept_progress':
        // 백엔드가 percent 를 보내면 즉시 적용 (자동 증가 중단)
        if (typeof d.percent === 'number') {
          tphClearProgressInterval(d.deptId);
          tphSetRoomFill(d.deptId, d.percent);
        }
        if (d.message) tphSetBubble(d.deptId, String(d.message).slice(0, 32), 2000);
        break;
      case 'dept_done':
        // Phase C: 보고하러 상무실 이동 → 복귀 → done 표시
        tphClearProgressInterval(d.deptId);
        tphStopWorkingBubbleRotation(d.deptId);
        tphSetRoomFill(d.deptId, 100, 'linear-gradient(90deg, #22c55e, #4ade80)');
        tphSetBubble(d.deptId, '보고 중 📋', 2200);
        tphWalkToSanmoo(d.deptId, 800, () => {
          tphSetRoomState(d.deptId, 'done');
          tphSetBubble(d.deptId, '✓ 완료', 1800);
          tphFadeRoomFill(d.deptId, 500);
          _tphState.done++;
          tphUpdateProgress();
        });
        break;
      case 'dept_error':
        tphClearProgressInterval(d.deptId);
        tphStopWorkingBubbleRotation(d.deptId);
        tphSetRoomFill(d.deptId, 100, 'linear-gradient(90deg, #ef4444, #f87171)');
        tphSetRoomState(d.deptId, 'error');
        tphSetBubble(d.deptId, '✗ 오류', 2800);
        _tphState.done++;
        tphUpdateProgress();
        break;
      case 'dept_rework_start':
        tphClearProgressInterval(d.deptId);
        tphSetRoomState(d.deptId, 'rework');
        tphSetBubble(d.deptId, '🔁 ' + (d.reason || '보강'), 3000);
        tphStartAutoProgress(d.deptId);  // 재작업도 자동 증가
        break;
      case 'ensemble_start':
        tphSetBubble(d.deptId, '🧠 3-AI 앙상블', 2400);
        break;
      case 'ensemble_voice': {
        const label = String(d.model || 'AI').replace(/^claude.*/i, 'Claude').replace(/^gpt.*/i, 'GPT').replace(/^gemini.*/i, 'Gemini');
        const conf = (typeof d.confidence === 'number') ? ` ${Math.round(d.confidence * 100)}%` : '';
        tphSetBubble(d.deptId, `${label}${conf}: ${(d.message || '').slice(0, 24)}`, 3000);
        break;
      }
      case 'ensemble_done': {
        const v = d.verdict === 'consensus' ? '✓ 합의' : d.verdict === 'split' ? '△ 분기' : d.verdict === 'contradictory' ? '⚠ 충돌' : '? 불확실';
        tphSetBubble(d.deptId, v, 2200);
        break;
      }
      case 'critic_start':
        // critic 캐릭터 첫 부서로 이동
        tphCriticWalkTo(TPH_LAYOUT[0]);
        break;
      case 'critic_done':
        document.getElementById('tphCritic')?.classList.add('hide');
        break;
      case 'ceo_briefing':
        document.getElementById('tphCeoOffice')?.classList.add('active');
        setTimeout(() => document.getElementById('tphCeoOffice')?.classList.remove('active'), 6000);
        break;
      case 'all_done':
        // 모두 완료 — HUD 미션 텍스트 리셋
        tphSetMission('— 완료 —');
        try { window.parent.postMessage({ type: 'directorDone', total: _tphState.total }, '*'); } catch {}
        break;
    }
  }
