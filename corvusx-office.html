  // ─── SSE ─────────────────────────────────────────────────────────
  // ─── Per-thread run state ───────────────────────────────────────
  // Each thread has its own EventSource + dept status, runs independently.
  // The Phaser scene + chat log reflect the currently active thread only.
  function ensureRun(threadId){
    if (!state.threadRuns) state.threadRuns = {};
    if (!state.threadRuns[threadId]) {
      state.threadRuns[threadId] = {
        es:null, running:false,
        deptStates:Object.fromEntries(DEPTS.map(d => [d.id, 'idle'])),
        missionDeptCount:9, deptCompletedCount:0, executiveActive:false,
        lastBriefing:null, lastCritic:null,
      };
    }
    return state.threadRuns[threadId];
  }
  function isActive(threadId){ return state.activeThreadId === threadId; }
  function applyRunToUI(run){
    // Reflect current run state on shared office + panel + button
    Object.assign(state.deptStates, run.deptStates);
    state.missionDeptCount = run.missionDeptCount;
    state.deptCompletedCount = run.deptCompletedCount;
    state.executiveActive = run.executiveActive;
    state.lastBriefing = run.lastBriefing;
    state.lastCritic = run.lastCritic;
    state.running = run.running;
    dom.officeStatusDot.className = 'dot' + (run.running ? ' live' : '');
    dom.officeStatusText.textContent = run.running ? '실행 중...' : '대기 중';
    // [Phaser removed] scene replay + lightExecutive
    // Send button toggles to stop if running
    if (run.running) {
      dom.sendBtn.classList.add('stop'); dom.sendBtn.title = '중단';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="10" height="10"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>';
      // 입력창 잠금 — 처리 중 중복 전송/입력 방지 (중단 버튼은 유효)
      dom.directive.disabled = true;
      dom.directive.placeholder = '처리 중입니다...';
      dom.directive.classList.add('is-locked');
    } else {
      dom.sendBtn.classList.remove('stop'); dom.sendBtn.title = '전송';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
      dom.directive.disabled = false;
      dom.directive.placeholder = '';
      dom.directive.classList.remove('is-locked');
    }
    renderPanel();
  }

  function onRunEvent(threadId, ev){
    let p; try { p = JSON.parse(ev.data); } catch { return; }
    const type = p.type || ev.type;
    const run = ensureRun(threadId);
    const active = isActive(threadId);
    switch (type) {
      case 'executive_gate_start': {
        run.executiveStatus = 'reviewing';
        run.directive = p.directive || '';
        // [Phaser removed] HUD 미션 텍스트 + officeStatusText
        // "판단중..." 임시 메시지 — gate_redirect 시 제거하기 위해 ID 캡처
        const gateMsgId = 'gate_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        run.gateMsgId = gateMsgId;
        addMsgForThread(threadId, { id: gateMsgId, who:'상무', body:'지시를 분석하고 업무를 배분합니다...', kind:'sys' });
        break;
      }
      case 'executive_gate_done': {
        const action = p.action || 'single_agent';
        const depts = Array.isArray(p.departments) ? p.departments : [];
        run.executiveStatus = 'done';
        run.gateResult = { action, complexity: p.complexity, departments: depts, reason: p.reason };
        if (action === 'director' && depts.length) {
          // director 경로: 판단중 메시지 유지 가능하지만 라인 하나 더 추가
          const names = depts.map(d => (DEPT_BY_ID[d.id]?.kr || d.id) + '팀').join(', ');
          addMsgForThread(threadId, { who:'상무', body:`배분 완료: ${names}`, kind:'sys' });
          // Phaser: 선택된 부서만 "일어나기" 반응
        }
        // single_agent 인 경우 별도 버블 추가 금지 (redirect 에서 "판단중" 제거 + 단일 에이전트 스트리밍)
        // [Phaser removed] director 선택 부서 반응 애니메이션
        break;
      }
      case 'executive_gate_redirect': {
        run.executiveStatus = 'done';
        // [Phaser removed] 판단중 메시지 제거 애니메이션
        if (run.gateMsgId) {
          removeMessageFromThread(threadId, run.gateMsgId);
          run.gateMsgId = null;
        }
        // 단일 에이전트 SSE 스트림에 연결 — 새 버블에 스트리밍 누적
        const directive = run.directive || '';
        if (directive) {
          startSingleAgentStreamInto(threadId, directive);
        }
        break;
      }
      case 'mission_start':
        run.missionDeptCount = Number(p.deptCount || 9);
        run.deptCompletedCount = 0; run.executiveActive = false;
        // [Phaser removed] mission_start dispatch
        break;
      case 'dept_start':
        run.deptStates[p.deptId] = 'working';
        break;
      case 'dept_progress':
        // [Phaser removed] dept_progress dispatch
        break;
      case 'dept_done':
        run.deptStates[p.deptId] = 'done';
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        checkRunAllDone(threadId);
        break;
      case 'dept_error':
        run.deptStates[p.deptId] = 'err';
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`오류: ${p.error || '알 수 없는 오류'}`, kind:'err' });
        checkRunAllDone(threadId);
        break;
      case 'critic_start':
        run.executiveStatus = 'reviewing';
        break;
      case 'critic_done':
        run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        run.lastCritic = p.review;
        // [Phaser removed] critic animation
        addThreadMsgByCritic(threadId, p.review);
        break;
      case 'critic_review':
        run.lastCritic = p.review;
        if (!run.executiveStatus || run.executiveStatus === 'idle') {
          run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        }
        // [Phaser removed] critic review animation
        if (!run._criticMsgShown) { run._criticMsgShown = true; addThreadMsgByCritic(threadId, p.review); }
        if ((p.review?.verdict === 'needs_followup' || p.review?.verdict === 'needs_rework') && (p.review?.targetDeptId || p.deptId)) {
          const tgt = p.review.targetDeptId || p.deptId;
          // [Phaser removed] rework target animation
        }
        break;
      case 'critic_rework':
        run.reworkDepts = Array.isArray(p.rework) ? p.rework.slice() : [];
        run.reworkReasons = p.rework_reason || {};
        for (const d of run.reworkDepts) run.deptStates[d] = 'rework';
        addMsgForThread(threadId, { who:'상무', body:`${run.reworkDepts.length}개 부서에 보강 지시`, kind:'sys' });
        break;
      case 'dept_rework_start':
        run.deptStates[p.deptId] = 'rework';
        // [Phaser removed] rework start animation
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`보강중: ${p.reason || ''}`, kind:'sys' });
        break;
      case 'dept_rework_done':
        run.deptStates[p.deptId] = 'rework_done';
        // [Phaser removed] rework done animation
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        break;
      case 'ensemble_start':
        break;
      case 'ensemble_voice':
        break;
      case 'ensemble_done':
        // 통합 synthesis 가 있으면 부서 메시지로 추가 (마크다운 그대로 렌더)
        if (p.synthesis && typeof p.synthesis === 'string' && p.synthesis.trim()) {
          const d = DEPT_BY_ID[p.deptId];
          const nm = d ? `${d.kr}팀 · 3-AI 앙상블` : `${p.deptId} · 3-AI 앙상블`;
          const verdictBadge = p.verdict === 'consensus' ? '✓ 합의'
                            : p.verdict === 'split' ? '△ 분기'
                            : p.verdict === 'contradictory' ? '⚠ 충돌'
                            : '? 불확실';
          const simStr = typeof p.similarity === 'number' ? ` (유사도 ${p.similarity.toFixed(2)})` : '';
          const headerLine = `**${verdictBadge}${simStr}**\n\n`;
          addMsgForThread(threadId, { who:nm, body: headerLine + p.synthesis, kind:'dept', deptId:p.deptId });
        }
        break;
      case 'ceo_briefing':
        run.lastBriefing = p.briefing;
        // [Phaser removed] briefing animation
        addThreadMsgByBriefing(threadId, p.briefing);
        break;
      case 'all_done':
        finishRun(threadId);
        // 대시보드 뷰가 활성화돼 있으면 즉시 갱신
        if (state.activeView === 'dashboard' && dom.dashboardBody) loadCostData(dom.dashboardBody, true);
        break;
      case 'stream_end': if (run.running) finishRun(threadId, false); break;
      case 'error':
        addMsgForThread(threadId, { who:'오류', body:p.message, kind:'err' });
        finishRun(threadId, true);
        break;
    }
    if (active) applyRunToUI(run);
    else if (type === 'dept_done' || type === 'dept_error' || type === 'all_done') renderSidebar();
  }
  function checkRunAllDone(threadId){
    const run = ensureRun(threadId);
    run.deptCompletedCount++;
    if (!run.executiveActive && run.deptCompletedCount >= run.missionDeptCount) {
      run.executiveActive = true;
      if (isActive(threadId)) addMsgForThread(threadId, { who:'', body:'상무 검토 중...', kind:'sys' });
    }
  }

  // Wrappers to addMsg into a specific thread even when not active
  function addMsgForThread(threadId, payload){
    if (isActive(threadId)) { addMsg(payload); return; }
    // persist-only path: append to that thread's messages
    const id = payload.id || ('m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    const stored = { id, kind:payload.kind || 'ai', who:payload.who, body:payload.body, deptId:payload.deptId || null, html:!!payload.html, attachments:payload.attachments || [], ts:Date.now() };
    appendMessageToThread(threadId, stored);
  }

  // Remove a message from UI (if active) and from thread storage.
  function removeMessageFromThread(threadId, messageId){
    if (!messageId) return;
    if (isActive(threadId)) {
      const el = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(messageId)}"]`);
      if (el) el.remove();
    }
    for (const pid of Object.keys(state.threads)) {
      const t = state.threads[pid].find(x => x.id === threadId);
      if (t) {
        const before = t.messages.length;
        t.messages = t.messages.filter(m => m.id !== messageId);
        if (t.messages.length !== before) { saveThreads(); debouncedSaveMessages(threadId); }
        return;
      }
    }
  }

  // 단일 에이전트 SSE 스트림 연결 — 동일 버블에 누적.
  // /api/chat/stream 은 POST-only SSE → fetch ReadableStream 으로 파싱.
  async function startSingleAgentStreamInto(threadId, directive){
    if (!directive) return;
    const bubbleId = 'single_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    addMsgForThread(threadId, { id: bubbleId, who:'AI', body:'', kind:'ai' });
    // body 엘리먼트 찾기 — addMsg 가 방금 DOM 에 넣었음
    let bodyEl = null;
    if (isActive(threadId)) {
      const node = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(bubbleId)}"] .body`);
      if (node) bodyEl = node;
    }
    let accumulated = '';
    const appendChunk = (text) => {
      accumulated += text;
      if (bodyEl) { bodyEl.textContent = accumulated; autoScrollIfNeeded(); }
      // 저장소 동기화
      for (const pid of Object.keys(state.threads)) {
        const t = state.threads[pid].find(x => x.id === threadId);
        if (t) {
          const m = t.messages.find(x => x.id === bubbleId);
          if (m) m.body = accumulated;
          t.updatedAt = Date.now();
        }
      }
    };

    try {
      const res = await fetch(API_BASE + '/api/chat/stream', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        // thread_id 포함 — 서버 sseRegistry 가 같은 스레드 신규 연결 시 기존 종료
        body: JSON.stringify({
          message: directive,
          thread_id: threadId,
          project_id: state.activeProjectId || null,
          force_single_agent: true,
          stream: true,
        }),
      });
      if (!res.ok || !res.body) {
        appendChunk(`\n[단일 에이전트 호출 실패: HTTP ${res.status}]`);
        debouncedSaveMessages(threadId);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        // 간단한 SSE 파서 — "data: {...}\n\n" 라인 단위
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = frame.split('\n');
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (!payload) continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'chunk' || ev.type === 'token' || ev.type === 'provider_chunk') {
                appendChunk(extractText(ev.content ?? ev.delta ?? ev.text ?? ev));
              } else if (ev.type === 'done') {
                const finalText = extractText(ev.payload) || extractText(ev);
                if (finalText && !accumulated) appendChunk(finalText);
              }
            } catch {/* ignore non-JSON frames */}
          }
        }
      }
      // 스트리밍 완료 — 마크다운 렌더링 적용
      if (bodyEl && accumulated) {
        bodyEl.classList.add('md');
        bodyEl.innerHTML = renderMarkdown(accumulated);
        bindCopyButtons(bodyEl);
        autoScrollIfNeeded();
      }
      debouncedSaveMessages(threadId);
    } catch (err) {
      appendChunk(`\n[오류: ${err && err.message || String(err)}]`);
      debouncedSaveMessages(threadId);
    }
  }

  // ─── startRun / finishRun (per-thread) ──────────────────────────
  async function startRun(){
    const rawText = dom.directive.value.trim();
    if (!rawText && !state.attachments.length) return;
    // ensure we have an active thread before proceeding
    ensureThread();
    const threadId = state.activeThreadId;
    if (!threadId) return;
    const run = ensureRun(threadId);
    if (run.running) return;

    const atts = state.attachments.map(a => ({ id:a.id, name:a.name, size:a.size, type:a.type, thumb:a.thumb || null, text:a.text || null }));
    addMsg({ who:'', body:rawText, kind:'user', attachments:atts });

    let directive = rawText;
    for (const a of state.attachments) {
      if (a.text) directive += `\n\n[첨부: ${a.name}]\n${a.text.slice(0, 6000)}`;
      else directive += `\n\n[첨부: ${a.name} (${fmtSize(a.size)})]`;
    }

    // reset this run's state
    run.running = true;
    run.missionDeptCount = 9; run.deptCompletedCount = 0; run.executiveActive = false;
    run.lastBriefing = null; run.lastCritic = null;
    run.executiveStatus = 'idle';
    run.gateResult = null;
    run.gateMsgId = null;
    run.directive = directive;  // gate_redirect 시 /api/chat/stream 재호출에 사용
    run.reworkDepts = []; run.reworkReasons = {}; run._criticMsgShown = false;
    for (const d of DEPTS) run.deptStates[d.id] = 'idle';
    // [Phaser removed] reset scene
    const cur = getActiveThread();
    if (cur && (!cur.title || cur.title === '신규 대화')) {
      cur.title = directive.slice(0, 30); saveThreads(); renderSidebar();
      dom.chatTitle.textContent = cur.title;
      apiSaveThread(cur).catch(() => {});
    }
    applyRunToUI(run);
    dom.directive.value = ''; autoSize(); clearAttachments();

    const url = new URL(API_BASE + '/api/director/stream', location.href);
    url.searchParams.set('directive', directive);
    url.searchParams.set('projectName', getProjectTitleOrGeneral());
    // sessionId = threadId — 같은 스레드 재진입 시 서버 sseRegistry 가 기존 SSE 종료 후 교체
    if (threadId) url.searchParams.set('sessionId', threadId);

    // SSE 타임아웃 — 540s 총 상한, 360s 경고, 연결 오류시 5s 간격 재연결 (2회 한정)
    const SSE_TOTAL_TIMEOUT_MS = 540000;
    const SSE_WARNING_MS = 360000;
    const RECONNECT_DELAY_MS = 5000;
    const MAX_RECONNECTS = 2;
    run.reconnects = 0;

    const openSse = () => {
      try {
        const es = new EventSource(url.toString(), { withCredentials:true });
        run.es = es;
        const listener = (ev) => onRunEvent(threadId, ev);
        ['executive_gate_start','executive_gate_done','executive_gate_redirect',
         'mission_start','dept_start','dept_progress','dept_done','dept_error',
         'critic_review','critic_start','critic_done','critic_rework',
         'dept_rework_start','dept_rework_done',
         'ensemble_start','ensemble_voice','ensemble_done',
         'ceo_briefing','all_done','error','stream_end']
          .forEach(n => es.addEventListener(n, listener));
        es.onerror = () => {
          if (!run.running) return;
          if (run.reconnects < MAX_RECONNECTS) {
            run.reconnects++;
            try { es.close(); } catch {}
            addMsgForThread(threadId, { who:'', body:`연결 끊김 — 5초 후 재연결 시도 (${run.reconnects}/${MAX_RECONNECTS})`, kind:'sys' });
            setTimeout(() => { if (run.running) openSse(); }, RECONNECT_DELAY_MS);
            return;
          }
          addMsgForThread(threadId, { who:'', body:'연결 오류 (재연결 한도 초과).', kind:'err' });
          finishRun(threadId, true);
        };
      } catch (e) {
        addMsgForThread(threadId, { who:'', body:'연결 실패: ' + e.message, kind:'err' });
        finishRun(threadId, true);
      }
    };
    openSse();

    // 180s 경고
    run.warnTimer = setTimeout(() => {
      if (run.running) addMsgForThread(threadId, { who:'', body:'응답이 없습니다 (6분 경과)', kind:'sys' });
    }, SSE_WARNING_MS);
    // 360s 전체 타임아웃 — 강제 종료
    run.totalTimer = setTimeout(() => {
      if (run.running) {
        addMsgForThread(threadId, { who:'', body:'응답 타임아웃 (9분) — 연결 종료', kind:'err' });
        finishRun(threadId, true);
      }
    }, SSE_TOTAL_TIMEOUT_MS);
  }
  function finishRun(threadId, isErr = false){
    const run = ensureRun(threadId);
    if (!run.running && !run.es) return;
    run.running = false;
    if (run.es) { try { run.es.close(); } catch {} run.es = null; }
    if (run.warnTimer) { clearTimeout(run.warnTimer); run.warnTimer = null; }
    if (run.totalTimer) { clearTimeout(run.totalTimer); run.totalTimer = null; }
    if (isActive(threadId)) {
      dom.officeStatusDot.className = 'dot' + (isErr ? ' err' : '');
      dom.officeStatusText.textContent = isErr ? '오류' : '대기 중'; applyRunToUI(run);
    }
    renderSidebar();
  }

  // ─── Cost Dashboard (Phase 5 2026-04-25, 리디자인 2026-04-25) ────
  // 실시간 비용 대시보드. /api/cost/stats 폴링.
  // 골드 제거 — 기존 CSS 변수만 사용 (--accent 빨강 #C96442 강조).
  const COST_DEPT_LABELS = {
    market: '시장', compete: '경쟁', legal: '법무', finance: '재무',
    marketing: '마케팅', rnd: 'R&D', data: '데이터', content: '콘텐츠',
    sns: 'SNS', design: '디자인', single_agent: '단일 에이전트',
    classifier: '분류', planner: 'Planner', critic: 'Critic', briefing: '브리핑',
    unknown: '기타',
  };
  function costDeptLabel(d) { return COST_DEPT_LABELS[d] || d; }

  // 6 프로바이더 메타. label/icon/topup URL은 백엔드에서도 오지만 UI 폴백 용도로 보관.
  const PROVIDER_ORDER = ['anthropic', 'openai', 'google', 'deepseek', 'perplexity', 'fal'];
  const PROVIDER_META = {
    anthropic:  { label: 'Anthropic',       icon: 'A', url: 'https://console.anthropic.com/settings/billing' },
    openai:     { label: 'OpenAI',          icon: 'O', url: 'https://platform.openai.com/settings/organization/billing/overview' },
    google:     { label: 'Google · Gemini', icon: 'G', url: 'https://aistudio.google.com/app/apikey' },
    deepseek:   { label: 'DeepSeek',        icon: 'D', url: 'https://platform.deepseek.com/top_up' },
    perplexity: { label: 'Perplexity',      icon: 'P', url: 'https://www.perplexity.ai/settings/api' },
    fal:        { label: 'fal.ai',          icon: 'F', url: 'https://fal.ai/dashboard/billing' },
  };

  // 잔액별 색상 (카드 강조선/숫자 색).
  function balanceTone(bal) {
    if (bal == null || isNaN(bal)) return { color: 'var(--text-dim)', border: 'var(--border-soft)', glow: '' };
    if (bal < 1) return { color: '#f87171', border: '#f87171', glow: '0 0 16px rgba(248,113,113,.35)' };
    if (bal < 10) return { color: '#fb923c', border: '#fb923c', glow: '' };
    return { color: 'var(--text)', border: 'var(--border-soft)', glow: '' };
  }

  function fmtUsd(n) {
    if (n == null || isNaN(n)) return '—';
    const v = Number(n);
    if (Math.abs(v) >= 100) return '\$' + v.toFixed(0);
    if (Math.abs(v) >= 10) return '\$' + v.toFixed(1);
    return '\$' + v.toFixed(2);
  }

  function renderProviderCard(pid, p) {
    const meta = PROVIDER_META[pid] || { label: pid, icon: '?', url: '#' };
    const safe = p || { displayBalance: 0, apiBalance: null, apiSupported: false, totalCharged: 0, totalUsed: 0, lastApiFetch: null, topupUrl: meta.url };
    const tone = balanceTone(safe.displayBalance);
    const isApi = !!safe.apiSupported;
    const apiOk = isApi && safe.apiBalance != null;
    const dotColor = apiOk ? '#22c55e' : (isApi ? '#fb923c' : 'var(--text-dim)');
    const labelText = apiOk ? 'API 실시간' : (isApi ? 'API 조회 실패 — 수동' : '수동 관리');
    const lastFetchTxt = safe.lastApiFetch
      ? new Date(safe.lastApiFetch).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })
      : null;
    const topupUrl = safe.topupUrl || meta.url;

    return `
      <div style="background:var(--surface);border:2px solid ${tone.border};border-radius:10px;padding:16px;${tone.glow ? 'box-shadow:' + tone.glow + ';' : ''}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="width:24px;height:24px;border-radius:6px;background:var(--surface-hi);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-soft);font-family:monospace;">${meta.icon}</div>
          <div style="flex:1;font-size:13px;font-weight:600;color:var(--text);">${escapeHtml(meta.label)}</div>
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${dotColor};"></span>
          <span style="font-size:10px;color:var(--text-dim);">${escapeHtml(labelText)}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px;">
          <div style="font-size:32px;font-weight:700;color:${tone.color};font-family:monospace;letter-spacing:-1px;line-height:1;">${fmtUsd(safe.displayBalance)}</div>
          ${isApi ? `<button type="button" data-credit-action="refresh" data-provider="${pid}" title="API 강제 재조회" style="background:transparent;color:var(--text-soft);border:1px solid var(--border-soft);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;line-height:1;">↻</button>` : ''}
        </div>
        ${lastFetchTxt ? `<div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">갱신 ${escapeHtml(lastFetchTxt)}</div>` : '<div style="height:14px;"></div>'}
        <div style="border-top:1px solid var(--border-soft);padding-top:8px;font-size:11px;color:var(--text-soft);display:flex;justify-content:space-between;margin-bottom:12px;">
          <span>사용 <span style="color:var(--text);font-family:monospace;">\$${Number(safe.totalUsed || 0).toFixed(2)}</span></span>
          <span>충전 <span style="color:var(--text);font-family:monospace;">\$${Number(safe.totalCharged || 0).toFixed(2)}</span></span>
        </div>
        <div style="display:flex;gap:6px;">
          <button type="button" data-credit-action="manual" data-provider="${pid}" style="flex:1;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:11px;cursor:pointer;font-weight:500;">수동 입력</button>
          <button type="button" data-credit-action="topup" data-provider="${pid}" data-url="${escapeHtml(topupUrl)}" style="flex:1;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:11px;cursor:pointer;font-weight:600;">충전하러가기 →</button>
        </div>
      </div>`;
  }

  async function refreshOneProvider(body, provider) {
    try {
      const r = await fetch(API_BASE + '/api/cost/credit/refresh', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ provider }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
      toast(provider + ' 잔액 갱신');
      if (state.activeView === 'dashboard') loadCostData(body, true);
    } catch (err) {
      toast('재조회 실패: ' + (err.message || err));
    }
  }
  async function refreshAllProviders(body) {
    try {
      const r = await fetch(API_BASE + '/api/cost/credit/refresh', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: '{}',
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
      toast('전체 잔액 갱신');
      if (state.activeView === 'dashboard') loadCostData(body, true);
    } catch (err) {
      toast('전체 재조회 실패: ' + (err.message || err));
    }
  }
  function costAlertCssVar(level) {
    if (level === 'danger') return 'var(--red)';        // #b94141
    if (level === 'warning') return 'var(--accent)';    // #C96442
    return 'var(--border)';                              // #B8B4A8 (normal — subtle)
  }
  function costFmt(n) {
    const v = Number(n) || 0;
    if (v >= 1) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }
  function costBarRow(label, value, total) {
    const pct = total > 0 ? Math.min((value / total) * 100, 100) : 0;
    const percent = total > 0 ? ((value / total) * 100).toFixed(1) : '0.0';
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--text);">
          <span style="font-weight:500;">${escapeHtml(label)}</span>
          <span style="color:var(--text-soft);">${costFmt(value)} <span style="color:var(--text-dim);">· ${percent}%</span></span>
        </div>
        <div style="background:var(--surface-hi);border:1px solid var(--border-soft);border-radius:3px;height:7px;overflow:hidden;">
          <div style="background:var(--accent);width:${pct}%;height:100%;transition:width .5s ease;"></div>
        </div>
      </div>`;
  }

  let costPollTimer = null;
  function stopCostPolling() {
    if (costPollTimer) { clearInterval(costPollTimer); costPollTimer = null; }
  }
  function startCostPolling(body) {
    stopCostPolling();
    costPollTimer = setInterval(() => {
      if (state.activeView !== 'dashboard') { stopCostPolling(); return; }
      loadCostData(body, true);
    }, 30000);
  }

  async function loadCostData(body, isPoll) {
    if (!isPoll) body.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:40px;font-size:13px;">대시보드 로딩중...</div>';
    try {
      const r = await fetch(API_BASE + '/api/cost/stats', { credentials: 'include' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (d && d.ok === false) throw new Error(d.error || 'unknown');
      if (state.activeView !== 'dashboard') return;

      const total = Number(d.todayTotal ?? 0);
      const alert = d.alertLevel || 'normal';
      const alertVar = costAlertCssVar(alert);
      const updatedAt = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const byModel = Array.isArray(d.todayByModel) ? d.todayByModel : [];
      const byDept = Array.isArray(d.todayByDept) ? d.todayByDept : [];
      const last7 = Array.isArray(d.last7Days) ? d.last7Days : [];
      const recent = Array.isArray(d.recentCalls) ? d.recentCalls : [];

      const max7 = Math.max(0.000001, ...last7.map(x => Number(x.total) || 0));

      const last7Bars = last7.map(item => {
        const v = Number(item.total) || 0;
        const h = Math.max(3, Math.round((v / max7) * 120));
        const day = String(item.date).slice(5).replace('-', '/');
        const isToday = item.date === d.date;
        const barColor = isToday ? 'var(--accent)' : 'var(--text-dim)';
        return `
          <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:30px;height:100%;justify-content:flex-end;">
            <div style="font-size:10px;color:var(--text-dim);margin-bottom:3px;">${v > 0 ? '\$' + v.toFixed(2) : ''}</div>
            <div title="${escapeHtml(item.date)}: \$${v.toFixed(6)}"
                 style="background:${barColor};width:80%;height:${h}px;border-radius:3px 3px 0 0;transition:height .5s ease;"></div>
            <div style="font-size:10px;color:var(--text-soft);margin-top:5px;font-weight:${isToday ? '600' : '400'};">${escapeHtml(day)}</div>
          </div>`;
      }).join('');

      const modelRows = byModel.length === 0
        ? '<div style="color:var(--text-dim);font-size:12px;text-align:center;padding:14px;">데이터 없음</div>'
        : byModel.map(r => costBarRow(r.model, Number(r.cost), total)).join('');

      const deptRows = byDept.length === 0
        ? '<div style="color:var(--text-dim);font-size:12px;text-align:center;padding:14px;">데이터 없음</div>'
        : byDept.map(r => costBarRow(costDeptLabel(r.dept), Number(r.cost), total)).join('');

      const recentRows = recent.length === 0
        ? '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);font-size:12px;padding:14px;">호출 기록 없음</td></tr>'
        : recent.map(c => `
            <tr style="border-bottom:1px solid var(--border-soft);">
              <td style="padding:6px 8px;color:var(--text-soft);font-family:monospace;font-size:11px;">${escapeHtml(c.time)}</td>
              <td style="padding:6px 8px;color:var(--text);font-size:11px;font-weight:500;">${escapeHtml(c.model)}</td>
              <td style="padding:6px 8px;color:var(--text-soft);font-size:11px;">${escapeHtml(costDeptLabel(c.dept))}</td>
              <td style="padding:6px 8px;text-align:right;color:var(--text);font-size:11px;font-family:monospace;font-weight:500;">${costFmt(c.cost)}</td>
            </tr>`).join('');

      const sectionTitle = (label) => `<div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:14px;text-transform:uppercase;letter-spacing:1.2px;">${label}</div>`;
      const cardStyle = `background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:18px;`;

      // ── 6 프로바이더 카드 ──
      const providers = d.providers || {};
      const providerCardsHtml = PROVIDER_ORDER.map(pid => renderProviderCard(pid, providers[pid])).join('');

      body.innerHTML = `
        <div style="max-width:1200px;margin:0 auto;font-family:inherit;color:var(--text);">
          <div style="${cardStyle}border-color:${alertVar};border-width:2px;text-align:center;margin-bottom:18px;">
            <div style="font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;">오늘 총 비용 · KST ${escapeHtml(d.date || '')}</div>
            <div style="font-size:48px;font-weight:700;color:${alertVar};font-family:monospace;letter-spacing:-2px;line-height:1;">${costFmt(total)}</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <span>경고 \$${d.thresholds?.warning ?? 5} · 위험 \$${d.thresholds?.danger ?? 10}</span>
              <span>↻ ${escapeHtml(updatedAt)} · 30s</span>
            </div>
          </div>

          <div style="margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <div style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:1.2px;">프로바이더 크레딧 (6)</div>
              <button id="creditRefreshAllBtn" type="button" style="background:transparent;color:var(--text-soft);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;">↻ 전체 새로고침</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;">
              ${providerCardsHtml}
            </div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px;">
            <div style="${cardStyle}">
              ${sectionTitle('모델별 비용')}
              ${modelRows}
            </div>
            <div style="${cardStyle}">
              ${sectionTitle('부서별 비용')}
              ${deptRows}
            </div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;">
            <div style="${cardStyle}">
              ${sectionTitle('최근 7일 트렌드')}
              <div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 6px;">
                ${last7Bars}
              </div>
            </div>
            <div style="${cardStyle}">
              ${sectionTitle('최근 호출 (10건)')}
              <table style="width:100%;border-collapse:collapse;">
                <thead>
                  <tr style="border-bottom:1px solid var(--border);">
                    <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.5px;">시각</th>
                    <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.5px;">모델</th>
                    <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.5px;">부서</th>
                    <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.5px;">비용</th>
                  </tr>
                </thead>
                <tbody>${recentRows}</tbody>
              </table>
            </div>
          </div>
        </div>`;

      // 카드 버튼 핸들러 위임
      body.querySelectorAll('[data-credit-action]').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          const action = btn.getAttribute('data-credit-action');
          const provider = btn.getAttribute('data-provider');
          if (action === 'manual') openCreditChargeModal(body, provider);
          else if (action === 'topup') {
            const url = btn.getAttribute('data-url');
            if (url) window.open(url, '_blank', 'noopener');
          } else if (action === 'refresh') {
            refreshOneProvider(body, provider);
          }
        };
      });
      const refreshAllBtn = body.querySelector('#creditRefreshAllBtn');
      if (refreshAllBtn) refreshAllBtn.onclick = () => refreshAllProviders(body);

      if (!isPoll && state.activeView === 'dashboard') startCostPolling(body);
    } catch (err) {
      body.innerHTML = `<div style="color:var(--red);text-align:center;padding:40px;font-size:13px;">비용 대시보드 로드 실패: ${escapeHtml(String(err.message || err))}</div>`;
      stopCostPolling();
    }
  }

  // ─── 크레딧 충전 모달 (provider별) ───────────────────────────────
  function openCreditChargeModal(dashBody, provider) {
    const meta = PROVIDER_META[provider] || { label: provider || '크레딧' };
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
    overlay.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;width:360px;max-width:92vw;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.25);">
        <div style="font-size:13px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;">크레딧 수동 입력</div>
        <div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:16px;">${escapeHtml(meta.label)}</div>
        <label style="display:block;font-size:11px;color:var(--text-soft);margin-bottom:6px;">충전 금액 (USD)</label>
        <input id="creditAmtInput" type="number" min="0.01" step="0.01" placeholder="예: 33"
               style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-hi);color:var(--text);font-family:monospace;font-size:14px;margin-bottom:14px;box-sizing:border-box;">
        <label style="display:block;font-size:11px;color:var(--text-soft);margin-bottom:6px;">메모 (선택)</label>
        <input id="creditMemoInput" type="text" maxlength="200" placeholder="예: 4월 25일 충전"
               style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-hi);color:var(--text);font-size:13px;margin-bottom:18px;box-sizing:border-box;">
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" data-action="cancel" style="background:transparent;color:var(--text-soft);border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:12px;cursor:pointer;">취소</button>
          <button type="button" data-action="confirm" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;">확인</button>
        </div>
      </div>`;
    const close = () => { if (overlay.parentNode) document.body.removeChild(overlay); };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('[data-action="cancel"]').onclick = close;

    const amtInput = overlay.querySelector('#creditAmtInput');
    const memoInput = overlay.querySelector('#creditMemoInput');
    setTimeout(() => amtInput.focus(), 30);

    const submit = async () => {
      const amount = Number(amtInput.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        toast('금액은 0보다 큰 숫자여야 합니다');
        amtInput.focus();
        return;
      }
      if (!provider) {
        toast('provider 누락');
        return;
      }
      const memo = memoInput.value.trim();
      try {
        const r = await fetch(API_BASE + '/api/cost/credit', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, amount, memo: memo || undefined }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        close();
        toast(`${meta.label} +$${amount.toFixed(2)} 충전됨`);
        if (dashBody && state.activeView === 'dashboard') loadCostData(dashBody, true);
      } catch (err) {
        toast('충전 실패: ' + (err.message || err));
      }
    };

    overlay.querySelector('[data-action="confirm"]').onclick = submit;
    [amtInput, memoInput].forEach(el => {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    });

    document.body.appendChild(overlay);
  }

  // ─── Gallery (사이드바 '이미지') ─────────────────────────────────
  // 기존 CSS 변수만 사용. /api/media/list 로드 → 그리드 + 라이트박스 + 삭제 모달.
  const galleryState = {
    items: [],
    selected: new Set(),
    sort: 'newest',  // 'newest' | 'oldest'
    lightboxIndex: -1,
  };

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }
  function fmtDate(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch { return iso; }
  }
  function gallerySorted() {
    const arr = [...galleryState.items];
    arr.sort((a, b) => galleryState.sort === 'newest'
      ? (a.createdAt < b.createdAt ? 1 : -1)
      : (a.createdAt > b.createdAt ? 1 : -1));
    return arr;
  }

  async function loadGallery() {
    const body = dom.galleryBody;
    if (!body) return;
    body.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:60px;font-size:13px;">불러오는 중...</div>';
    try {
      const r = await fetch(API_BASE + '/api/media/list', { credentials:'include' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (d && d.ok === false) throw new Error(d.error || 'unknown');
      if (state.activeView !== 'gallery') return;
      galleryState.items = Array.isArray(d.items) ? d.items : [];
      galleryState.selected.clear();
      renderGallery();
    } catch (err) {
      body.innerHTML = `<div style="color:var(--red);text-align:center;padding:60px;font-size:13px;">갤러리 로드 실패: ${escapeHtml(String(err.message || err))}</div>`;
    }
  }

  function renderGallery() {
    const body = dom.galleryBody;
    if (!body) return;
    const items = gallerySorted();
    const total = items.length;
    const totalSize = items.reduce((s, it) => s + (Number(it.size) || 0), 0);
    const selCount = galleryState.selected.size;
    const allChecked = total > 0 && selCount === total;
    const deleteEnabled = selCount > 0;

    if (total === 0) {
      body.innerHTML = `
        <div style="max-width:1200px;margin:0 auto;">
          <div style="background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:80px 24px;text-align:center;color:var(--text-dim);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="opacity:.5;margin-bottom:14px;"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8" cy="11" r="2"/><path d="M3 17l5-5 4 4 4-3 5 4"/></svg>
            <div style="font-size:14px;color:var(--text-soft);">아직 생성된 이미지가 없습니다</div>
            <div style="font-size:12px;margin-top:6px;">채팅에서 이미지/동영상을 생성하면 여기에 자동 저장됩니다</div>
          </div>
        </div>`;
      return;
    }

    const gridCards = items.map((it) => {
      const sel = galleryState.selected.has(it.id);
      const isVideo = it.type === 'video';
      const media = isVideo
        ? `<video src="${escapeHtml(it.url)}" preload="metadata" style="width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;display:block;"></video>
           <div class="play-overlay">▶</div>`
        : `<img src="${escapeHtml(it.url)}" alt="" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface-hi);display:block;" />`;
      return `
        <div class="gallery-card${sel ? ' selected' : ''}" data-id="${escapeHtml(it.id)}">
          <div class="check" data-action="toggle" title="선택">${sel ? '✓' : ''}</div>
          <div data-action="open">${media}</div>
          <div style="padding:8px 10px;border-top:1px solid var(--border-soft);">
            <div style="font-size:11px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(it.filename)}">${escapeHtml(it.filename)}</div>
            <div style="font-size:10px;color:var(--text-dim);margin-top:3px;display:flex;justify-content:space-between;">
              <span>${escapeHtml(fmtDate(it.createdAt))}</span>
              <span>${fmtBytes(it.size)}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    body.innerHTML = `
      <div style="max-width:1200px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;margin-bottom:16px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text);">
            <input type="checkbox" id="gallerySelectAll" ${allChecked ? 'checked' : ''} style="cursor:pointer;accent-color:var(--accent);" />
            전체선택
          </label>
          <button id="galleryDeleteBtn" type="button" ${deleteEnabled ? '' : 'disabled'}
            style="padding:6px 14px;border-radius:5px;font-size:12px;cursor:${deleteEnabled ? 'pointer' : 'not-allowed'};border:1px solid ${deleteEnabled ? 'var(--accent)' : 'var(--border-soft)'};background:${deleteEnabled ? 'var(--accent)' : 'transparent'};color:${deleteEnabled ? '#fff' : 'var(--text-dim)'};transition:background .15s;">
            선택삭제 ${deleteEnabled ? `(${selCount})` : ''}
          </button>
          <div style="margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-soft);">
            <span>${total}개 · ${fmtBytes(totalSize)}</span>
            <select id="gallerySort" style="background:var(--input);border:1px solid var(--border-soft);border-radius:5px;padding:4px 8px;color:var(--text);font-size:12px;cursor:pointer;">
              <option value="newest" ${galleryState.sort === 'newest' ? 'selected' : ''}>최신순</option>
              <option value="oldest" ${galleryState.sort === 'oldest' ? 'selected' : ''}>오래된순</option>
            </select>
          </div>
        </div>
        <div id="galleryGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">
          ${gridCards}
        </div>
      </div>`;

    // Wire toolbar
    const selectAll = document.getElementById('gallerySelectAll');
    if (selectAll) selectAll.addEventListener('change', () => {
      if (selectAll.checked) items.forEach(it => galleryState.selected.add(it.id));
      else galleryState.selected.clear();
      renderGallery();
    });
    const sortSel = document.getElementById('gallerySort');
    if (sortSel) sortSel.addEventListener('change', () => { galleryState.sort = sortSel.value; renderGallery(); });
    const delBtn = document.getElementById('galleryDeleteBtn');
    if (delBtn) delBtn.addEventListener('click', () => {
      if (galleryState.selected.size === 0) return;
      openGalleryDeleteModal([...galleryState.selected]);
    });

    // Wire grid card actions (event delegation)
    const grid = document.getElementById('galleryGrid');
    if (grid) grid.addEventListener('click', (e) => {
      const card = e.target.closest('.gallery-card');
      if (!card) return;
      const id = card.dataset.id;
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'toggle') {
        if (galleryState.selected.has(id)) galleryState.selected.delete(id);
        else galleryState.selected.add(id);
        renderGallery();
      } else if (action === 'open') {
        const sortedItems = gallerySorted();
        const idx = sortedItems.findIndex(it => it.id === id);
        if (idx >= 0) openLightbox(idx);
      }
    });
  }

  // ─── Lightbox ───────────────────────────────────────────────────
  let lightboxKeyHandler = null;
  function openLightbox(index) {
    const items = gallerySorted();
    if (index < 0 || index >= items.length) return;
    galleryState.lightboxIndex = index;
    renderLightbox();
    lightboxKeyHandler = (e) => {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') navLightbox(-1);
      else if (e.key === 'ArrowRight') navLightbox(1);
    };
    document.addEventListener('keydown', lightboxKeyHandler);
  }
  function closeLightbox() {
    galleryState.lightboxIndex = -1;
    const lb = document.getElementById('galleryLightbox');
    if (lb) lb.remove();
    if (lightboxKeyHandler) { document.removeEventListener('keydown', lightboxKeyHandler); lightboxKeyHandler = null; }
  }
  function navLightbox(delta) {
    const items = gallerySorted();
    if (items.length === 0) return;
    const next = (galleryState.lightboxIndex + delta + items.length) % items.length;
    galleryState.lightboxIndex = next;
    renderLightbox();
  }
  function renderLightbox() {
    const items = gallerySorted();
    const it = items[galleryState.lightboxIndex];
    if (!it) { closeLightbox(); return; }
    let lb = document.getElementById('galleryLightbox');
    if (!lb) {
      lb = document.createElement('div');
      lb.id = 'galleryLightbox';
      lb.className = 'gallery-lightbox';
      lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
      document.body.appendChild(lb);
    }
    const isVideo = it.type === 'video';
    const mediaTag = isVideo
      ? `<video class="gallery-lightbox-media" src="${escapeHtml(it.url)}" controls autoplay></video>`
      : `<img class="gallery-lightbox-media" src="${escapeHtml(it.url)}" alt="" />`;
    lb.innerHTML = `
      <button class="gallery-lightbox-close" type="button" title="닫기 (ESC)">×</button>
      <button class="gallery-lightbox-nav prev" type="button" title="이전 (←)">‹</button>
      ${mediaTag}
      <button class="gallery-lightbox-nav next" type="button" title="다음 (→)">›</button>
      <div class="gallery-lightbox-info">
        ${it.prompt ? `<div class="prompt">${escapeHtml(it.prompt)}</div>` : ''}
        <div class="meta">
          <span>${escapeHtml(it.filename)}</span>
          <span>${escapeHtml(fmtDate(it.createdAt))}</span>
          <span>${fmtBytes(it.size)}</span>
          ${it.model ? `<span>${escapeHtml(it.model)}</span>` : ''}
          <button type="button" id="lightboxDelete">삭제</button>
        </div>
      </div>`;
    lb.querySelector('.gallery-lightbox-close').onclick = closeLightbox;
    lb.querySelector('.gallery-lightbox-nav.prev').onclick = (e) => { e.stopPropagation(); navLightbox(-1); };
    lb.querySelector('.gallery-lightbox-nav.next').onclick = (e) => { e.stopPropagation(); navLightbox(1); };
    const delBtn = lb.querySelector('#lightboxDelete');
    if (delBtn) delBtn.onclick = (e) => { e.stopPropagation(); openGalleryDeleteModal([it.id], true); };
  }

  // ─── Delete Confirm Modal ───────────────────────────────────────
  function openGalleryDeleteModal(ids, fromLightbox) {
    const overlay = document.createElement('div');
    overlay.className = 'gallery-modal';
    overlay.innerHTML = `
      <div class="gallery-modal-card">
        <div class="gallery-modal-title">파일 삭제</div>
        <div class="gallery-modal-msg">${ids.length}개 파일을 삭제하시겠습니까?<br><span style="color:var(--text-dim);font-size:12px;">삭제된 파일은 복구할 수 없습니다.</span></div>
        <div class="gallery-modal-actions">
          <button type="button" class="gallery-modal-btn" data-action="cancel">취소</button>
          <button type="button" class="gallery-modal-btn danger" data-action="confirm">삭제</button>
        </div>
      </div>`;
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) document.body.removeChild(overlay);
    });
    overlay.querySelector('[data-action="cancel"]').onclick = () => document.body.removeChild(overlay);
    overlay.querySelector('[data-action="confirm"]').onclick = async () => {
      document.body.removeChild(overlay);
      try {
        const r = await fetch(API_BASE + '/api/media/delete', {
          method: 'DELETE', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
        toast(`${d.deleted || ids.length}개 파일 삭제됨`);
        if (fromLightbox) closeLightbox();
        await loadGallery();
      } catch (err) {
        toast('삭제 실패: ' + (err.message || err));
      }
    };
    document.body.appendChild(overlay);
  }

  // ─── API ─────────────────────────────────────────────────────────
  async function apiLoadWorkspace(){
    try {
      const r = await fetch(API_BASE + '/api/workspace', { credentials:'include' });
      if (!r.ok) return null;
      const j = await r.json();
      return j?.data || null;
    } catch { return null; }
  }
  async function apiSaveProject(p){
    return fetch(API_BASE + '/api/workspace/projects', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id:p.id, title:p.title, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), meta:p.meta || {} }),
    });
  }
  async function apiDeleteProject(id){ return fetch(API_BASE + '/api/workspace/projects/' + encodeURIComponent(id), { method:'DELETE', credentials:'include' }); }
  async function apiSaveThread(t){
    return fetch(API_BASE + '/api/workspace/threads', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id:t.id, projectId:t.projectId || GENERAL, title:t.title || '신규 대화',
        createdAt:new Date(t.updatedAt || Date.now()).toISOString(),
        updatedAt:new Date(t.updatedAt || Date.now()).toISOString(),
        meta:t.meta || {},
      }),
    });
  }
  async function apiDeleteThread(id){ return fetch(API_BASE + '/api/workspace/threads/' + encodeURIComponent(id), { method:'DELETE', credentials:'include' }); }
  async function apiSaveMessages(threadId, messages){
    // 서버 messages 테이블은 role CHECK('user','assistant') 가 걸려 있다.
    // 로컬 메시지 모델(kind/body/ts/attachments) → 서버 스키마(role/content/createdAt/attachedFiles) 로 정규화.
    const normalized = (messages || []).map(m => {
      if (!m || typeof m !== 'object') return null;
      const kind = String(m.kind || '').toLowerCase();
      const role = kind === 'user' ? 'user' : 'assistant';
      const body = m.content ?? m.body ?? '';
      const content = typeof body === 'string' ? body : String(body ?? '');
      if (!m.id || !content) return null;
      const createdAt = typeof m.createdAt === 'string'
        ? m.createdAt
        : new Date(typeof m.ts === 'number' ? m.ts : Date.now()).toISOString();
      const requestMeta = {
        kind: kind || undefined,
        who: m.who ?? undefined,
        deptId: m.deptId ?? undefined,
        html: m.html ? true : undefined,
      };
      const attachedFiles = Array.isArray(m.attachments) && m.attachments.length ? m.attachments : undefined;
      return {
        id: m.id,
        role,
        content,
        createdAt,
        status: m.status || 'done',
        requestMeta,
        attachedFiles,
      };
    }).filter(Boolean);
    return fetch(API_BASE + '/api/workspace/messages', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ threadId, messages: normalized }),
    });
  }
  let syncStateTimer = null;
  function apiSyncState(){
    if (syncStateTimer) clearTimeout(syncStateTimer);
    syncStateTimer = setTimeout(() => {
      fetch(API_BASE + '/api/workspace/sync-state', {
        method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ activeProjectId:state.activeProjectId || GENERAL, activeThreadId:state.activeThreadId }),
      }).catch(() => {});
    }, 500);
  }

  // ─── Initial ────────────────────────────────────────────────────
  async function init(){
    applyToggles();
    // Pull server snapshot (auth required); falls back silently to localStorage
    const ws = await apiLoadWorkspace();
    if (ws?.projects && Array.isArray(ws.projects)) {
      // 서버 스냅샷에 __general__ 가 있어도 사이드바에는 절대 추가하지 않음
      state.projects = ws.projects
        .filter(p => p && p.id && p.id !== GENERAL)
        .map(p => ({ id:p.id, title:p.title, updatedAt:new Date(p.updatedAt || p.createdAt || Date.now()).getTime(), meta:p.meta || {} }));
      saveProjects();
    }
    if (ws?.threads && Array.isArray(ws.threads)) {
      const map = {};
      for (const t of ws.threads) {
        const pid = t.projectId || GENERAL;
        if (!map[pid]) map[pid] = [];
        map[pid].push({
          id:t.id, projectId:pid, title:t.title || '신규 대화',
          messages:Array.isArray(t.messages) ? t.messages : [],
          meta:t.meta || {}, updatedAt:new Date(t.updatedAt || Date.now()).getTime(),
        });
      }
      state.threads = map; saveThreads();
    }
    if (ws?.activeThreadId) { state.activeThreadId = ws.activeThreadId; localStorage.setItem(LS.ACTIVE_THREAD, ws.activeThreadId); }
    if (ws?.activeProjectId) state.activeProjectId = ws.activeProjectId;

    renderSidebar();
    switchTab(state.currentTab);

    const cur = getActiveThread();
    if (cur) {
      state.activeProjectId = cur.projectId || GENERAL;
      dom.chatTitle.textContent = cur.title || '신규 대화';
      if (cur.messages.length > 0) {
        dom.chatLog.innerHTML = '';
        for (const m of cur.messages) addMsg(m, false);
      }
    } else {
      // 스레드 없음 — 프로젝트 홈 또는 빈 채팅 placeholder 표시 (자동 스레드 생성 금지)
      state.activeThreadId = null;
      renderMainArea();
    }

    dom.navNewChat.addEventListener('click', (e) => { e.preventDefault(); showChat(); newChat(); });
    if (dom.navDashboard) dom.navDashboard.addEventListener('click', (e) => { e.preventDefault(); showDashboard(); });
    if (dom.navImages) dom.navImages.addEventListener('click', (e) => { e.preventDefault(); showGallery(); });
    dom.newProject.addEventListener('click', (e) => { e.stopPropagation(); newProject(); });

    setTimeout(() => { dom.directive.focus(); autoSize(); }, 200);
  }
  init();
})();
</script>
</body>
</html>
