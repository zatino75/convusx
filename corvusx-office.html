<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>CORVUS X</title>
<style>
  :root {
    --bg:#f5f5f5;
    --surface:#ffffff;
    --border:#e5e7eb;
    --text:#1f2937;
    --text-soft:#6b7280;
    --text-dim:#9ca3af;
    --accent:#3b82f6;
    --accent-soft:#dbeafe;
    --gold:#d97706;
    --red:#ef4444;
    --office-bg:#0d1117;
    --office-wall:#1f2937;
    --office-text:#9ca3af;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 2px 8px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;
    overflow:hidden;
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  kbd{font-family:inherit}

  /* ─ layout ─────────────────────────────────────────────────────────── */
  .app{display:grid;grid-template-columns:200px 1fr 280px;height:100vh;background:var(--bg)}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 0 12px}
  .chat{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--border)}
  .office{background:var(--office-bg);display:flex;flex-direction:column;overflow:hidden;color:var(--office-text)}

  /* ─ sidebar ────────────────────────────────────────────────────────── */
  .logo{padding:0 16px 20px;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:6px}
  .logo .mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:0;color:var(--text);cursor:pointer;font-size:13px;text-decoration:none;border:none;background:none;width:100%;text-align:left;transition:background .12s}
  .nav-btn:hover{background:#f9fafb}
  .nav-btn.active{background:#f3f4f6;font-weight:600}
  .nav-btn .ic{width:14px;height:14px;flex-shrink:0;opacity:.7}
  .nav-divider{padding:16px 16px 6px;font-size:10px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
  .nav-projects{flex-shrink:0;max-height:220px;overflow-y:auto}
  .nav-project{padding:6px 16px 6px 30px;color:var(--text-soft);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s}
  .nav-project:hover{background:#f9fafb;color:var(--text)}
  .nav-project.active{background:#eff6ff;color:var(--accent);font-weight:500}
  .nav-project .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4}
  .nav-new{padding:6px 16px 6px 30px;color:var(--text-dim);font-size:12px;cursor:pointer;font-style:normal;transition:color .12s}
  .nav-new:hover{color:var(--accent)}

  /* ─ chat ───────────────────────────────────────────────────────────── */
  .chat-header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .chat-title{font-size:15px;font-weight:600;color:var(--text);cursor:pointer;padding:3px 8px;border-radius:4px;border:1px solid transparent;outline:none}
  .chat-title:hover{border-color:var(--border)}
  .chat-title[contenteditable="true"]{border-color:var(--accent);background:#fff}
  .chat-status{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
  .chat-status .dot{width:7px;height:7px;border-radius:50%;background:#d1d5db}
  .chat-status .dot.live{background:#10b981;animation:pulse 1.4s ease-in-out infinite}
  .chat-status .dot.err{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  .chat-log{flex:1;overflow-y:auto;padding:24px 24px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
  .chat-log::-webkit-scrollbar{width:6px}
  .chat-log::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:3px}
  .chat-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:60px 20px}
  .chat-empty h3{margin:0 0 6px;font-size:14px;color:var(--text-soft);font-weight:600}

  .msg{display:flex;flex-direction:column;gap:4px;animation:msg-in .25s ease-out;max-width:78%}
  @keyframes msg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.ai,.msg.dept,.msg.ceo,.msg.critic,.msg.sys,.msg.err{align-self:flex-start;align-items:flex-start}
  .msg .who{font-size:11px;color:var(--text-dim);margin-bottom:2px;padding:0 4px}
  .msg .body{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
  .msg.user .body{background:var(--accent-soft);color:#1e3a8a;border-bottom-right-radius:4px}
  .msg.ai .body{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);border-bottom-left-radius:4px}
  .msg.dept .body{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);border-bottom-left-radius:4px}
  .msg.dept .who{display:flex;align-items:center;gap:5px;font-weight:500}
  .msg.dept .who .dot{width:8px;height:8px;border-radius:50%;background:var(--dept-color,#9ca3af)}
  .msg.ceo .body{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);border-left:4px solid var(--gold);border-bottom-left-radius:4px;font-weight:500}
  .msg.ceo .who{color:var(--gold);font-weight:600}
  .msg.critic .body{background:#fef2f2;border:1px solid #fecaca;border-bottom-left-radius:4px}
  .msg.critic .who{color:#dc2626;font-weight:500}
  .msg.sys{max-width:100%}
  .msg.sys .body{background:transparent;padding:4px 8px;color:var(--text-dim);font-size:12px;font-style:italic}
  .msg.err .body{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-bottom-left-radius:4px}
  .msg .body ul{margin:6px 0 2px;padding-left:20px}
  .msg .body li{font-size:12.5px;margin:2px 0}
  .msg .body .sec-label{font-size:11px;color:var(--text-dim);font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:.5px}

  .chat-input{padding:14px 20px 20px;border-top:1px solid var(--border);background:var(--surface)}
  .chat-input-wrap{position:relative;background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:10px 52px 10px 14px;transition:border-color .15s,box-shadow .15s}
  .chat-input-wrap:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .chat-input-wrap textarea{width:100%;background:transparent;border:none;outline:none;resize:none;height:24px;max-height:200px;line-height:1.5;color:var(--text);font-size:14px;display:block}
  .chat-input-wrap textarea::placeholder{color:var(--text-dim)}
  .send-btn{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
  .send-btn:hover{background:#2563eb}
  .send-btn:disabled{background:#cbd5e1;cursor:not-allowed}
  .send-btn.stop{background:var(--red)}
  .send-btn.stop:hover{background:#dc2626}
  .chat-hint{margin-top:8px;font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center}
  .chat-hint kbd{background:#f3f4f6;border:1px solid var(--border);padding:1px 5px;border-radius:3px;font-size:10px;color:var(--text-soft)}

  /* ─ office (right panel) ───────────────────────────────────────────── */
  .office-header{padding:14px 16px 10px;font-size:10px;color:var(--office-text);letter-spacing:2px;font-weight:700;border-bottom:1px solid var(--office-wall);display:flex;justify-content:space-between;align-items:center}
  .office-header .running{width:6px;height:6px;border-radius:50%;background:#374151}
  .office-header .running.live{background:#10b981;animation:pulse 1.4s ease-in-out infinite}
  .office-stage{flex:1;position:relative;overflow:hidden;padding:18px 14px;display:flex;align-items:center;justify-content:center}
  .office-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:18px 14px;width:100%;height:100%;max-width:248px;max-height:540px}

  /* ─ desk + pixel character ─────────────────────────────────────────── */
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .slot .name{position:absolute;bottom:-14px;font-size:8px;color:var(--office-text);letter-spacing:.5px;opacity:.55;white-space:nowrap}
  .slot.working .name{color:#fff;opacity:1}
  .desk{width:52px;height:18px;background:#4a3622;background:linear-gradient(180deg,#5b4228,#3d2c19);border-radius:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45);position:relative;z-index:1}
  .pxc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:12px;height:22px;z-index:2}
  .pxc .head{position:absolute;top:0;left:2px;width:8px;height:8px;background:#f6d5ad;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  .pxc .hair{position:absolute;top:0;left:2px;width:8px;height:2px;background:#2d1f10}
  .pxc .eye-l,.pxc .eye-r{position:absolute;top:4px;width:1px;height:1px;background:#000}
  .pxc .eye-l{left:4px}
  .pxc .eye-r{left:7px}
  .pxc .body{position:absolute;top:8px;left:2px;width:8px;height:10px;background:var(--c,#9ca3af);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .pxc .arm-l,.pxc .arm-r{position:absolute;top:8px;width:2px;height:6px;background:var(--c,#9ca3af)}
  .pxc .arm-l{left:0}
  .pxc .arm-r{left:10px}
  .pxc .leg-l,.pxc .leg-r{position:absolute;top:18px;width:3px;height:4px;background:#1f2937}
  .pxc .leg-l{left:3px}
  .pxc .leg-r{left:6px}

  /* idle: gentle bob */
  .slot .pxc{animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-1px)}}

  /* working: typing — arms wiggle + faster bob */
  .slot.working .pxc{animation:bob 0.7s ease-in-out infinite}
  .slot.working .pxc .arm-l{animation:type-l 0.3s linear infinite}
  .slot.working .pxc .arm-r{animation:type-r 0.3s linear infinite}
  @keyframes type-l{0%,100%{top:8px;height:6px}50%{top:10px;height:4px}}
  @keyframes type-r{0%,100%{top:10px;height:4px}50%{top:8px;height:6px}}

  /* done: jump + check */
  .slot.done .pxc{animation:jump 0.55s ease-out 1}
  @keyframes jump{0%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-8px)}100%{transform:translateX(-50%) translateY(0)}}
  .slot .check{position:absolute;top:-4px;right:-2px;width:12px;height:12px;background:#10b981;color:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:9px;font-weight:bold;animation:check-pop 0.4s ease-out 1}
  .slot.done .check{display:flex}
  @keyframes check-pop{from{transform:scale(0)}to{transform:scale(1)}}

  /* bubble */
  .slot .bubble{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:#fff;color:#1f2937;font-size:9px;padding:3px 6px;border-radius:4px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:3;animation:bubble-in .2s ease-out}
  .slot .bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#fff}
  @keyframes bubble-in{from{opacity:0;transform:translateX(-50%) translateY(2px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* err */
  .slot.err .pxc .body{background:var(--red)!important}
  .slot.err .check{display:flex;background:var(--red)}
  .slot.err .check::before{content:'!';}
  .slot.err .check::after{content:none}
</style>
</head>
<body>
<div class="app">

  <!-- ─ sidebar ───────────────────────────────────────────────────── -->
  <nav class="sidebar">
    <div class="logo"><span class="mark"></span>CORVUS X</div>

    <button class="nav-btn active" id="navNewChat">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
      새 채팅
    </button>

    <div class="nav-divider">프로젝트</div>
    <div class="nav-projects" id="navProjects">
      <div class="nav-new" id="navProjectNew">+ 새 프로젝트</div>
    </div>

    <div class="nav-divider">운영</div>
    <a href="/?view=dashboard" class="nav-btn">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="5" height="5"/><rect x="9" y="3" width="5" height="5"/><rect x="2" y="10" width="5" height="3"/><rect x="9" y="10" width="5" height="3"/></svg>
      매출 대시보드
    </a>
    <a href="/?view=store-ops" class="nav-btn">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5l1.5-3h9L14 5M2 5v8h12V5M2 5h12M6 8h4"/></svg>
      매장 운영
    </a>
    <a href="/?view=pos" class="nav-btn">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M5 13h6M8 11v2"/></svg>
      POS 관리
    </a>
  </nav>

  <!-- ─ chat ──────────────────────────────────────────────────────── -->
  <section class="chat">
    <div class="chat-header">
      <span class="chat-title" id="projectName">신규 프로젝트</span>
      <span class="chat-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">대기 중</span>
      </span>
    </div>

    <div class="chat-log" id="chatLog">
      <div class="chat-empty">
        <h3>무엇을 도와드릴까요?</h3>
        <p>지시를 입력하면 필요한 부서만 자동으로 움직입니다.</p>
      </div>
    </div>

    <div class="chat-input">
      <div class="chat-input-wrap">
        <textarea id="directive" rows="1" placeholder="무엇이든 물어보세요..."></textarea>
        <button class="send-btn" id="sendBtn" title="전송" aria-label="전송">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
      </div>
      <div class="chat-hint">
        <span><kbd>Enter</kbd> 전송 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈</span>
        <span id="runInfo"></span>
      </div>
    </div>
  </section>

  <!-- ─ pixel office ──────────────────────────────────────────────── -->
  <aside class="office">
    <div class="office-header">
      <span>◢ OFFICE</span>
      <span class="running" id="officeRunning" title="상태"></span>
    </div>
    <div class="office-stage">
      <div class="office-grid" id="officeGrid"><!-- rendered --></div>
    </div>
  </aside>
</div>

<script>
(() => {
  const API_BASE = location.origin.includes('localhost') ? 'http://localhost:8000' : '';
  const DEPTS = [
    {id:'market',    kr:'시장',  color:'#3b82f6'},
    {id:'compete',   kr:'경쟁',  color:'#f97316'},
    {id:'legal',     kr:'법무',  color:'#a855f7'},
    {id:'finance',   kr:'재무',  color:'#eab308'},
    {id:'marketing', kr:'마케팅',color:'#ec4899'},
    {id:'rnd',       kr:'R&D',  color:'#22c55e'},
    {id:'data',      kr:'데이터',color:'#06b6d4'},
    {id:'content',   kr:'콘텐츠',color:'#ef4444'},
    {id:'sns',       kr:'SNS',  color:'#d946ef'},
  ];
  const DEPT_BY_ID = Object.fromEntries(DEPTS.map(d => [d.id, d]));

  const LS_PROJECT = 'corvus-x-office.current-project';
  const LS_PROJECTS = 'corvus-x-office.projects';

  const state = {
    es: null,
    running: false,
    currentProject: loadLS(LS_PROJECT, '신규 프로젝트'),
    projects: loadLS(LS_PROJECTS, []),
    deptBubbleCache: {},
    startTs: 0,
  };

  const $ = (id) => document.getElementById(id);
  const dom = {
    statusDot: $('statusDot'),
    statusText: $('statusText'),
    officeRunning: $('officeRunning'),
    projectName: $('projectName'),
    officeGrid: $('officeGrid'),
    chatLog: $('chatLog'),
    directive: $('directive'),
    sendBtn: $('sendBtn'),
    navNewChat: $('navNewChat'),
    navProjects: $('navProjects'),
    runInfo: $('runInfo'),
  };

  function loadLS(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed ?? fallback;
    } catch {
      return fallback;
    }
  }
  function saveLS(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }

  // ─ office grid ─────────────────────────────────────────────────────
  function renderOffice() {
    dom.officeGrid.innerHTML = '';
    DEPTS.forEach(d => {
      const slot = document.createElement('div');
      slot.className = 'slot idle';
      slot.dataset.dept = d.id;
      slot.innerHTML = `
        <div class="desk"></div>
        <div class="pxc" style="--c:${d.color}">
          <div class="hair"></div>
          <div class="head"></div>
          <div class="eye-l"></div><div class="eye-r"></div>
          <div class="body"></div>
          <div class="arm-l"></div><div class="arm-r"></div>
          <div class="leg-l"></div><div class="leg-r"></div>
        </div>
        <div class="check"><span>✓</span></div>
        <div class="name">${d.kr}</div>
      `;
      dom.officeGrid.appendChild(slot);
    });
  }

  function setDeptState(deptId, name) {
    const slot = dom.officeGrid.querySelector(`.slot[data-dept="${deptId}"]`);
    if (!slot) return;
    slot.classList.remove('idle','working','done','err');
    slot.classList.add(name);
  }
  function setBubble(deptId, text) {
    const slot = dom.officeGrid.querySelector(`.slot[data-dept="${deptId}"]`);
    if (!slot || !text) return;
    let b = slot.querySelector('.bubble');
    if (!b) {
      b = document.createElement('div');
      b.className = 'bubble';
      slot.appendChild(b);
    }
    b.textContent = text.slice(0, 24);
    b.title = text;
  }
  function clearBubble(deptId) {
    const b = dom.officeGrid.querySelector(`.slot[data-dept="${deptId}"] .bubble`);
    if (b) b.remove();
  }
  function resetOffice() {
    DEPTS.forEach(d => { setDeptState(d.id, 'idle'); clearBubble(d.id); });
  }

  // ─ chat rendering ──────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function addMsg({ who, body, kind = 'ai', deptId = null, html = false }) {
    const empty = dom.chatLog.querySelector('.chat-empty');
    if (empty) empty.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + kind;
    if (deptId && DEPT_BY_ID[deptId]) {
      msg.style.setProperty('--dept-color', DEPT_BY_ID[deptId].color);
    }
    const whoEl = document.createElement('div');
    whoEl.className = 'who';
    if (kind === 'dept') {
      whoEl.innerHTML = `<span class="dot"></span>${escapeHtml(who)}`;
    } else if (who) {
      whoEl.textContent = who;
    }
    const bodyEl = document.createElement('div');
    bodyEl.className = 'body';
    if (html) bodyEl.innerHTML = body;
    else bodyEl.textContent = body;

    if (kind !== 'user' || who) msg.appendChild(whoEl);
    msg.appendChild(bodyEl);
    dom.chatLog.appendChild(msg);
    dom.chatLog.scrollTop = dom.chatLog.scrollHeight;
    return msg;
  }

  function renderDeptReport(deptId, report) {
    const d = DEPT_BY_ID[deptId];
    const name = d ? `${d.kr}팀` : deptId;
    const st = report?.structured;
    let html = '';
    if (st?.summary) html += escapeHtml(st.summary);
    if (st?.keyFindings?.length) {
      html += '<div class="sec-label">핵심</div><ul>' +
        st.keyFindings.slice(0, 4).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (st?.risks?.length) {
      html += '<div class="sec-label">리스크</div><ul>' +
        st.risks.slice(0, 3).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (!html && report?.sections?.[0]) {
      const s = report.sections[0];
      html = `<div class="sec-label">${escapeHtml(s.heading)}</div><ul>` +
        (s.items || []).slice(0, 4).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (!html) html = '(보고 내용 없음)';
    addMsg({ who: name, body: html, kind: 'dept', deptId, html: true });
  }
  function renderCeoBriefing(b) {
    let html = '';
    if (b?.summary) html += escapeHtml(b.summary);
    if (b?.opportunities?.length) {
      html += '<div class="sec-label">기회</div><ul>' + b.opportunities.slice(0, 3).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (b?.risks?.length) {
      html += '<div class="sec-label">리스크</div><ul>' + b.risks.slice(0, 3).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (b?.recommendations?.length) {
      html += '<div class="sec-label">권고</div><ul>' + b.recommendations.slice(0, 3).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    }
    if (typeof b?.overallConfidence === 'number') {
      html += `<div class="sec-label">신뢰도 ${Math.round(b.overallConfidence * 100)}%</div>`;
    }
    addMsg({ who: 'CEO 브리핑', body: html || '통합 브리핑', kind: 'ceo', html: true });
  }
  function renderCriticReview(r) {
    const verdict = r?.verdict === 'pass' ? '✓ PASS' : '⚠ 보강 필요';
    let html = `<b>${verdict}</b><br>${escapeHtml(r?.summary || '')}`;
    const issues = (r?.keyIssues || []).concat(r?.contradictions || []).slice(0, 3);
    if (issues.length) html += '<ul>' + issues.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    addMsg({ who: 'CRITIC 검증', body: html, kind: 'critic', html: true });
  }

  // ─ SSE events ──────────────────────────────────────────────────────
  function onEvent(ev) {
    let p;
    try { p = JSON.parse(ev.data); } catch { return; }
    const type = p.type || ev.type;

    switch (type) {
      case 'dept_start':
        setDeptState(p.deptId, 'working');
        if (p.objective) setBubble(p.deptId, p.objective);
        break;

      case 'dept_progress':
        if (p.message && state.deptBubbleCache[p.deptId] !== p.message) {
          setBubble(p.deptId, p.message);
          state.deptBubbleCache[p.deptId] = p.message;
        }
        break;

      case 'dept_done':
        setDeptState(p.deptId, 'done');
        clearBubble(p.deptId);
        if (p.report) renderDeptReport(p.deptId, p.report);
        break;

      case 'dept_error':
        setDeptState(p.deptId, 'err');
        clearBubble(p.deptId);
        addMsg({
          who: (DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀',
          body: `오류: ${p.error || '알 수 없는 오류'}`,
          kind: 'err',
        });
        break;

      case 'critic_review':
        renderCriticReview(p.review);
        break;

      case 'ceo_briefing':
        renderCeoBriefing(p.briefing);
        break;

      case 'all_done':
        finishRun();
        break;

      case 'error':
        addMsg({ who: '오류', body: p.message, kind: 'err' });
        finishRun(true);
        break;

      // 조용한 이벤트 (채팅 미출력):
      // mission_start / pmo_plan / ensemble_* / stream_end
    }
  }

  // ─ actions ─────────────────────────────────────────────────────────
  function startRun() {
    const directive = dom.directive.value.trim();
    if (!directive) return;
    if (state.running) return;

    addMsg({ who: '', body: directive, kind: 'user' });
    resetOffice();
    state.running = true;
    state.startTs = Date.now();
    state.deptBubbleCache = {};

    dom.statusDot.className = 'dot live';
    dom.statusText.textContent = '실행 중...';
    dom.officeRunning.className = 'running live';
    dom.sendBtn.classList.add('stop');
    dom.sendBtn.title = '중단';
    dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="10" height="10"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>';

    const projectName = state.currentProject || '신규 프로젝트';
    const url = new URL(API_BASE + '/api/director/stream', location.href);
    url.searchParams.set('directive', directive);
    url.searchParams.set('projectName', projectName);

    try {
      const es = new EventSource(url.toString(), { withCredentials: true });
      state.es = es;
      ['dept_start','dept_progress','dept_done','dept_error','critic_review','ceo_briefing','all_done','error','stream_end']
        .forEach(name => es.addEventListener(name, onEvent));
      es.onerror = () => {
        if (state.running) {
          addMsg({ who: '', body: '연결 오류. 잠시 후 다시 시도하세요.', kind: 'err' });
          finishRun(true);
        }
      };
    } catch (err) {
      addMsg({ who: '', body: '연결 실패: ' + err.message, kind: 'err' });
      finishRun(true);
    }

    dom.directive.value = '';
    autoSizeInput();
  }

  function finishRun(isErr = false) {
    state.running = false;
    if (state.es) { try { state.es.close(); } catch {} state.es = null; }
    dom.statusDot.className = 'dot' + (isErr ? ' err' : '');
    dom.statusText.textContent = isErr ? '오류' : '대기 중';
    dom.officeRunning.className = 'running';
    dom.sendBtn.classList.remove('stop');
    dom.sendBtn.title = '전송';
    dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';

    if (!isErr && state.startTs) {
      const sec = Math.round((Date.now() - state.startTs) / 1000);
      dom.runInfo.textContent = `마지막 실행 ${sec}초`;
    }
  }

  function newChat() {
    if (state.running) return;
    dom.chatLog.innerHTML = `
      <div class="chat-empty">
        <h3>무엇을 도와드릴까요?</h3>
        <p>지시를 입력하면 필요한 부서만 자동으로 움직입니다.</p>
      </div>
    `;
    resetOffice();
    dom.directive.value = '';
    dom.directive.focus();
    dom.runInfo.textContent = '';
  }

  // ─ projects ────────────────────────────────────────────────────────
  function renderProjectName() {
    dom.projectName.textContent = state.currentProject || '신규 프로젝트';
  }
  function saveProjectName(name) {
    const trimmed = (name || '').trim() || '신규 프로젝트';
    state.currentProject = trimmed;
    if (trimmed !== '신규 프로젝트' && !state.projects.includes(trimmed)) {
      state.projects.push(trimmed);
      saveLS(LS_PROJECTS, state.projects);
    }
    saveLS(LS_PROJECT, trimmed);
    renderProjectName();
    renderProjectsNav();
  }
  function renderProjectsNav() {
    dom.navProjects.innerHTML = '';
    state.projects.forEach(p => {
      const el = document.createElement('div');
      el.className = 'nav-project' + (p === state.currentProject ? ' active' : '');
      el.innerHTML = `<span class="dot"></span><span>${escapeHtml(p)}</span>`;
      el.onclick = () => { saveProjectName(p); newChat(); };
      dom.navProjects.appendChild(el);
    });
    const addEl = document.createElement('div');
    addEl.className = 'nav-new';
    addEl.id = 'navProjectNew';
    addEl.textContent = '+ 새 프로젝트';
    addEl.onclick = () => {
      const name = prompt('새 프로젝트 이름');
      if (name && name.trim()) { saveProjectName(name.trim()); newChat(); }
    };
    dom.navProjects.appendChild(addEl);
  }

  // ─ input autosize ──────────────────────────────────────────────────
  function autoSizeInput() {
    const ta = dom.directive;
    ta.style.height = '24px';
    const max = 200;
    ta.style.height = Math.min(ta.scrollHeight, max) + 'px';
  }

  // ─ bind ────────────────────────────────────────────────────────────
  function bind() {
    dom.sendBtn.addEventListener('click', () => {
      if (state.running) { finishRun(); addMsg({ who: '', body: '중단됨', kind: 'sys' }); }
      else startRun();
    });
    dom.directive.addEventListener('input', autoSizeInput);
    dom.directive.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        startRun();
      }
    });

    dom.navNewChat.addEventListener('click', (e) => { e.preventDefault(); newChat(); });

    dom.projectName.addEventListener('click', () => {
      dom.projectName.contentEditable = 'true';
      dom.projectName.focus();
      document.execCommand('selectAll', false, null);
    });
    dom.projectName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); dom.projectName.blur(); }
      if (e.key === 'Escape') { dom.projectName.textContent = state.currentProject; dom.projectName.blur(); }
    });
    dom.projectName.addEventListener('blur', () => {
      dom.projectName.contentEditable = 'false';
      saveProjectName(dom.projectName.textContent);
    });
  }

  // ─ go ─────────────────────────────────────────────────────────────
  renderOffice();
  renderProjectName();
  renderProjectsNav();
  bind();
  setTimeout(() => dom.directive.focus(), 100);
})();
</script>
</body>
</html>
