  });
  function openMenu(anchor, items){
    closeMenu();
    const m = document.createElement('div'); m.className = 'bubble-menu';
    for (const it of items) {
      if (it.divider) { const d = document.createElement('div'); d.className = 'divider'; m.appendChild(d); continue; }
      const mi = document.createElement('div'); mi.className = 'mi' + (it.danger ? ' danger' : '');
      mi.innerHTML = `<span>${escapeHtml(it.label)}</span>${it.submenu ? '<span class="chev">▸</span>' : ''}`;
      if (it.submenu) {
        mi.addEventListener('mouseenter', () => {
          // render submenu
          const existing = mi.querySelector('.bubble-menu.sub'); if (existing) return;
          const sub = document.createElement('div'); sub.className = 'bubble-menu sub';
          for (const s of it.submenu) {
            const si = document.createElement('div'); si.className = 'mi'; si.textContent = s.label;
            si.onclick = (e) => { e.stopPropagation(); s.onClick(); closeMenu(); };
            sub.appendChild(si);
          }
          mi.style.position = 'relative'; mi.appendChild(sub);
        });
        mi.addEventListener('mouseleave', () => { const sub = mi.querySelector('.bubble-menu.sub'); if (sub) sub.remove(); });
      } else if (it.onClick) {
        mi.onclick = (e) => { e.stopPropagation(); it.onClick(); closeMenu(); };
      }
      m.appendChild(mi);
    }
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    let left = r.right + 4, top = r.top;
    if (left + 220 > window.innerWidth) left = r.left - 220;
    if (top + m.offsetHeight > window.innerHeight) top = window.innerHeight - m.offsetHeight - 8;
    m.style.left = left + 'px'; m.style.top = top + 'px';
    currentMenu = m;
  }

  // ─── Attachments ────────────────────────────────────────────────
  const MAX_ATTACH = 10, MAX_BYTES = 20 * 1024 * 1024;
  function addAttachments(files){
    const list = [...files];
    for (const f of list) {
      if (state.attachments.length >= MAX_ATTACH) { toast('첨부 최대 10개'); break; }
      if (f.size > MAX_BYTES) { toast(`${f.name} 너무 큼 (20MB 초과)`); continue; }
      const reader = new FileReader();
      const id = 'att_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const chip = { id, name:f.name, size:f.size, type:f.type, dataUrl:null, text:null, thumb:null };
      state.attachments.push(chip);
      reader.onload = () => {
        chip.dataUrl = reader.result;
        if (/^image\//.test(f.type)) chip.thumb = reader.result;
        else if (/text\//.test(f.type) || /json|xml|csv|md|yml|yaml/i.test(f.name)) {
          try { chip.text = typeof reader.result === 'string' ? reader.result : ''; } catch {}
        }
        renderAttachRow();
      };
      if (/^image\//.test(f.type)) reader.readAsDataURL(f);
      else reader.readAsText(f);
      renderAttachRow();
    }
  }
  function renderAttachRow(){
    if (!state.attachments.length) { dom.attachRow.style.display = 'none'; dom.attachRow.innerHTML = ''; return; }
    dom.attachRow.style.display = 'flex';
    dom.attachRow.innerHTML = '';
    for (const a of state.attachments) {
      const chip = document.createElement('div'); chip.className = 'attach-chip';
      if (a.thumb) { const img = document.createElement('img'); img.className = 'thumb'; img.src = a.thumb; chip.appendChild(img); }
      const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = a.name; chip.appendChild(nm);
      const sz = document.createElement('span'); sz.className = 'size'; sz.textContent = fmtSize(a.size); chip.appendChild(sz);
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕'; rm.type = 'button';
      rm.onclick = () => { state.attachments = state.attachments.filter(x => x.id !== a.id); renderAttachRow(); };
      chip.appendChild(rm); dom.attachRow.appendChild(chip);
    }
  }

  // ─── Slash commands ─────────────────────────────────────────────
  let slashActive = -1;
  function updateSlashMenu(){
    const v = dom.directive.value;
    const m = v.match(/^\/(\S*)$/);
    if (!m) { dom.slashMenu.style.display = 'none'; slashActive = -1; return; }
    const q = m[1].toLowerCase();
    const items = SLASH_COMMANDS.filter(c => c.cmd.slice(1).toLowerCase().startsWith(q));
    if (!items.length) { dom.slashMenu.style.display = 'none'; slashActive = -1; return; }
    dom.slashMenu.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div'); el.className = 'item' + (i === 0 ? ' active' : '');
      el.innerHTML = `<span class="cmd">${it.cmd}</span><span class="desc">${escapeHtml(it.desc)}</span>`;
      el.onclick = () => { applySlash(it.cmd); };
      dom.slashMenu.appendChild(el);
    });
    dom.slashMenu.style.display = 'block';
    slashActive = 0;
  }
  function applySlash(cmd){
    dom.directive.value = cmd + ' ';
    dom.slashMenu.style.display = 'none';
    slashActive = -1;
    dom.directive.focus();
    autoSize();
  }
  function moveSlash(delta){
    const items = [...dom.slashMenu.querySelectorAll('.item')];
    if (!items.length) return;
    slashActive = (slashActive + delta + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('active', i === slashActive));
  }
  function selectSlash(){
    const items = [...dom.slashMenu.querySelectorAll('.item')];
    if (slashActive >= 0 && items[slashActive]) items[slashActive].click();
  }

  // ─── SSE ─────────────────────────────────────────────────────────
  // ─── Per-thread run state ───────────────────────────────────────
  // Each thread has its own EventSource + dept status, runs independently.
  // The Phaser scene + chat log reflect the currently active thread only.
  function ensureRun(threadId){
    if (!state.threadRuns) state.threadRuns = {};
    if (!state.threadRuns[threadId]) {
      state.threadRuns[threadId] = {
        es:null, running:false,
        deptStates:Object.fromEntries(DEPTS.map(d => [d.id, 'idle'])),
        missionDeptCount:9, deptCompletedCount:0, executiveActive:false,
        lastBriefing:null, lastCritic:null,
      };
    }
    return state.threadRuns[threadId];
  }
  function isActive(threadId){ return state.activeThreadId === threadId; }
  function applyRunToUI(run){
    // Reflect current run state on shared office + panel + button
    Object.assign(state.deptStates, run.deptStates);
    state.missionDeptCount = run.missionDeptCount;
    state.deptCompletedCount = run.deptCompletedCount;
    state.executiveActive = run.executiveActive;
    state.lastBriefing = run.lastBriefing;
    state.lastCritic = run.lastCritic;
    state.running = run.running;
    dom.officeStatusDot.className = 'dot' + (run.running ? ' live' : '');
    dom.officeStatusText.textContent = run.running ? '실행 중...' : '대기 중';
    // Phaser scene — replay current dept glows/positions
    const scene = state.scene;
    if (scene) {
      for (const d of DEPTS) {
        const s = run.deptStates[d.id] || 'idle';
        scene.setDeskGlow(d.id, s === 'working', d.hex);
      }
      scene.lightExecutive(run.executiveActive);
    }
    // Send button toggles to stop if running
    if (run.running) {
      dom.sendBtn.classList.add('stop'); dom.sendBtn.title = '중단';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="10" height="10"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>';
    } else {
      dom.sendBtn.classList.remove('stop'); dom.sendBtn.title = '전송';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
    }
    renderPanel();
  }

  function onRunEvent(threadId, ev){
    let p; try { p = JSON.parse(ev.data); } catch { return; }
    const type = p.type || ev.type;
    const run = ensureRun(threadId);
    const active = isActive(threadId);
    const scene = state.scene;
    switch (type) {
      case 'executive_gate_start': {
        run.executiveStatus = 'reviewing';
        if (active) scene?.lightExecutive(true);
        // "판단중..." 임시 메시지 — gate_redirect 시 제거하기 위해 ID 캡처
        const gateMsgId = 'gate_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        run.gateMsgId = gateMsgId;
        addMsgForThread(threadId, { id: gateMsgId, who:'상무', body:'지시를 분석하고 업무를 배분합니다...', kind:'sys' });
        break;
      }
      case 'executive_gate_done': {
        const action = p.action || 'single_agent';
        const depts = Array.isArray(p.departments) ? p.departments : [];
        run.executiveStatus = 'done';
        run.gateResult = { action, complexity: p.complexity, departments: depts, reason: p.reason };
        if (action === 'director' && depts.length) {
          // director 경로: 판단중 메시지 유지 가능하지만 라인 하나 더 추가
          const names = depts.map(d => (DEPT_BY_ID[d.id]?.kr || d.id) + '팀').join(', ');
          addMsgForThread(threadId, { who:'상무', body:`배분 완료: ${names}`, kind:'sys' });
        }
        // single_agent 인 경우 별도 버블 추가 금지 (redirect 에서 "판단중" 제거 + 단일 에이전트 스트리밍)
        if (active && action === 'director') setTimeout(() => scene?.lightExecutive(false), 2500);
        break;
      }
      case 'executive_gate_redirect': {
        run.executiveStatus = 'done';
        if (active) scene?.lightExecutive(false);
        // "판단중..." 임시 메시지 제거
        if (run.gateMsgId) {
          removeMessageFromThread(threadId, run.gateMsgId);
          run.gateMsgId = null;
        }
        // 단일 에이전트 SSE 스트림에 연결 — 새 버블에 스트리밍 누적
        const directive = run.directive || '';
        if (directive) {
          startSingleAgentStreamInto(threadId, directive);
        }
        break;
      }
      case 'mission_start':
        run.missionDeptCount = Number(p.deptCount || 9);
        run.deptCompletedCount = 0; run.executiveActive = false;
        break;
      case 'dept_start':
        run.deptStates[p.deptId] = 'working';
        if (active) { scene?.goWork(p.deptId, p.objective); }
        break;
      case 'dept_progress':
        if (active) scene?.progressMsg(p.deptId, p.message);
        break;
      case 'dept_done':
        run.deptStates[p.deptId] = 'done';
        if (active) scene?.goDone(p.deptId);
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        checkRunAllDone(threadId);
        break;
      case 'dept_error':
        run.deptStates[p.deptId] = 'err';
        if (active) scene?.goError(p.deptId);
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`오류: ${p.error || '알 수 없는 오류'}`, kind:'err' });
        checkRunAllDone(threadId);
        break;
      case 'critic_start':
        run.executiveStatus = 'reviewing';
        if (active) { scene?.lightExecutive(true); }
        break;
      case 'critic_done':
        run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        run.lastCritic = p.review;
        if (active) { scene?.lightExecutive(true); setTimeout(() => scene?.lightExecutive(false), 5000); }
        addThreadMsgByCritic(threadId, p.review);
        break;
      case 'critic_review':
        run.lastCritic = p.review;
        if (!run.executiveStatus || run.executiveStatus === 'idle') {
          run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        }
        if (active) { scene?.lightExecutive(true); setTimeout(() => scene?.lightExecutive(false), 5000); }
        if (!run._criticMsgShown) { run._criticMsgShown = true; addThreadMsgByCritic(threadId, p.review); }
        if ((p.review?.verdict === 'needs_followup' || p.review?.verdict === 'needs_rework') && (p.review?.targetDeptId || p.deptId)) {
          const tgt = p.review.targetDeptId || p.deptId;
          if (active) setTimeout(() => scene?.recallToMeeting(tgt, '상무 보완 지시'), 800);
        }
        break;
      case 'critic_rework':
        run.reworkDepts = Array.isArray(p.rework) ? p.rework.slice() : [];
        run.reworkReasons = p.rework_reason || {};
        for (const d of run.reworkDepts) run.deptStates[d] = 'rework';
        addMsgForThread(threadId, { who:'상무', body:`${run.reworkDepts.length}개 부서에 보강 지시`, kind:'sys' });
        break;
      case 'dept_rework_start':
        run.deptStates[p.deptId] = 'rework';
        if (active) { scene?.goWork(p.deptId, '[보강] ' + (p.reason || '')); }
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`보강중: ${p.reason || ''}`, kind:'sys' });
        break;
      case 'dept_rework_done':
        run.deptStates[p.deptId] = 'rework_done';
        if (active) scene?.goDone(p.deptId);
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        break;
      case 'ceo_briefing':
        run.lastBriefing = p.briefing;
        if (active) { scene?.lightCeo(true); setTimeout(() => scene?.lightCeo(false), 6000); }
        addThreadMsgByBriefing(threadId, p.briefing);
        break;
      case 'all_done':   finishRun(threadId); break;
      case 'stream_end': if (run.running) finishRun(threadId, false); break;
      case 'error':
        addMsgForThread(threadId, { who:'오류', body:p.message, kind:'err' });
        finishRun(threadId, true);
        break;
    }
    if (active) applyRunToUI(run);
    else if (type === 'dept_done' || type === 'dept_error' || type === 'all_done') renderSidebar();
  }
  function checkRunAllDone(threadId){
    const run = ensureRun(threadId);
    run.deptCompletedCount++;
    if (!run.executiveActive && run.deptCompletedCount >= run.missionDeptCount) {
      run.executiveActive = true;
      if (isActive(threadId)) state.scene?.lightExecutive(true);
      addMsgForThread(threadId, { who:'', body:'상무 검토 중...', kind:'sys' });
    }
  }

  // Wrappers to addMsg into a specific thread even when not active
  function addMsgForThread(threadId, payload){
    if (isActive(threadId)) { addMsg(payload); return; }
    // persist-only path: append to that thread's messages
    const id = payload.id || ('m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    const stored = { id, kind:payload.kind || 'ai', who:payload.who, body:payload.body, deptId:payload.deptId || null, html:!!payload.html, attachments:payload.attachments || [], ts:Date.now() };
    appendMessageToThread(threadId, stored);
  }

  // Remove a message from UI (if active) and from thread storage.
  function removeMessageFromThread(threadId, messageId){
    if (!messageId) return;
    if (isActive(threadId)) {
      const el = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(messageId)}"]`);
      if (el) el.remove();
    }
    for (const pid of Object.keys(state.threads)) {
      const t = state.threads[pid].find(x => x.id === threadId);
      if (t) {
        const before = t.messages.length;
        t.messages = t.messages.filter(m => m.id !== messageId);
        if (t.messages.length !== before) { saveThreads(); debouncedSaveMessages(threadId); }
        return;
      }
    }
  }

  // 단일 에이전트 SSE 스트림 연결 — 동일 버블에 누적.
  // /api/chat/stream 은 POST-only SSE → fetch ReadableStream 으로 파싱.
  async function startSingleAgentStreamInto(threadId, directive){
    if (!directive) return;
    const bubbleId = 'single_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    addMsgForThread(threadId, { id: bubbleId, who:'AI', body:'', kind:'ai' });
    // body 엘리먼트 찾기 — addMsg 가 방금 DOM 에 넣었음
    let bodyEl = null;
    if (isActive(threadId)) {
      const node = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(bubbleId)}"] .body`);
      if (node) bodyEl = node;
    }
    let accumulated = '';
    const appendChunk = (text) => {
      accumulated += text;
      if (bodyEl) { bodyEl.textContent = accumulated; autoScrollIfNeeded(); }
      // 저장소 동기화
      for (const pid of Object.keys(state.threads)) {
        const t = state.threads[pid].find(x => x.id === threadId);
        if (t) {
          const m = t.messages.find(x => x.id === bubbleId);
          if (m) m.body = accumulated;
          t.updatedAt = Date.now();
        }
      }
    };

    try {
      const res = await fetch(API_BASE + '/api/chat/stream', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: directive, force_single_agent: true, stream: true }),
      });
      if (!res.ok || !res.body) {
        appendChunk(`\n[단일 에이전트 호출 실패: HTTP ${res.status}]`);
        debouncedSaveMessages(threadId);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        // 간단한 SSE 파서 — "data: {...}\n\n" 라인 단위
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = frame.split('\n');
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (!payload) continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'chunk' || ev.type === 'token' || ev.type === 'provider_chunk') {
                appendChunk(extractText(ev.content ?? ev.delta ?? ev.text ?? ev));
              } else if (ev.type === 'done') {
                const finalText = extractText(ev.payload) || extractText(ev);
                if (finalText && !accumulated) appendChunk(finalText);
              }
            } catch {/* ignore non-JSON frames */}
          }
        }
      }
      debouncedSaveMessages(threadId);
    } catch (err) {
      appendChunk(`\n[오류: ${err && err.message || String(err)}]`);
      debouncedSaveMessages(threadId);
    }
  }
  function addThreadMsgByDeptReport(threadId, deptId, report){
    const d = DEPT_BY_ID[deptId]; const name = d ? `${d.kr}팀` : deptId;
    const st = report?.structured;
    let html = '';
    if (st?.summary) html += `<p>${escapeHtml(st.summary)}</p>`;
    if (st?.keyFindings?.length) html += '<div class="sec">핵심</div><ul>' + st.keyFindings.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.risks?.length) html += '<div class="sec">리스크</div><ul>' + st.risks.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.assumptions?.length) html += '<div class="sec">가정</div><ul>' + st.assumptions.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.needsFollowup?.length) html += '<div class="sec">추가 확인</div><ul>' + st.needsFollowup.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (!html && report?.sections) {
      html = report.sections.map(s => `<div class="sec">${escapeHtml(s.heading)}</div><ul>` + (s.items || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>').join('');
    }
    if (!html) html = '(보고 내용 없음)';
    addMsgForThread(threadId, { who:name, body:html, kind:'dept', deptId, html:true });
  }
  function addThreadMsgByBriefing(threadId, b){
    let html = '';
    if (b?.summary) html += `<p>${escapeHtml(b.summary)}</p>`;
    if (b?.opportunities?.length) html += '<div class="sec">기회</div><ul>' + b.opportunities.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (b?.risks?.length) html += '<div class="sec">리스크</div><ul>' + b.risks.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (b?.recommendations?.length) html += '<div class="sec">권고</div><ul>' + b.recommendations.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (b?.conflictingSignals?.length) html += '<div class="sec">상충 신호</div><ul>' + b.conflictingSignals.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (typeof b?.overallConfidence === 'number') html += `<div class="sec">통합 신뢰도 ${Math.round(b.overallConfidence * 100)}%</div>`;
    addMsgForThread(threadId, { who:'CEO 브리핑', body:html || '통합 브리핑', kind:'ceo', html:true });
  }
  function addThreadMsgByCritic(threadId, r){
    const verdict = r?.verdict === 'pass' ? '✓ PASS' : '⚠ 보강 필요';
    let html = `<b>${verdict}</b><br>${escapeHtml(r?.summary || '')}`;
    const issues = (r?.keyIssues || []).concat(r?.contradictions || []);
    if (issues.length) html += '<ul>' + issues.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (r?.verificationNeeded?.length) html += '<div class="sec">검증 필요</div><ul>' + r.verificationNeeded.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    addMsgForThread(threadId, { who:'상무 검토', body:html, kind:'critic', html:true });
  }

  // ─── startRun / finishRun (per-thread) ──────────────────────────
  async function startRun(){
    const rawText = dom.directive.value.trim();
    if (!rawText && !state.attachments.length) return;
    // ensure we have an active thread before proceeding
    ensureThread();
    const threadId = state.activeThreadId;
    if (!threadId) return;
    const run = ensureRun(threadId);
    if (run.running) return;

    const atts = state.attachments.map(a => ({ id:a.id, name:a.name, size:a.size, type:a.type, thumb:a.thumb || null, text:a.text || null }));
    addMsg({ who:'', body:rawText, kind:'user', attachments:atts });

    let directive = rawText;
    for (const a of state.attachments) {
      if (a.text) directive += `\n\n[첨부: ${a.name}]\n${a.text.slice(0, 6000)}`;
      else directive += `\n\n[첨부: ${a.name} (${fmtSize(a.size)})]`;
    }

    // reset this run's state
    run.running = true;
    run.missionDeptCount = 9; run.deptCompletedCount = 0; run.executiveActive = false;
    run.lastBriefing = null; run.lastCritic = null;
    run.executiveStatus = 'idle';
    run.gateResult = null;
    run.gateMsgId = null;
    run.directive = directive;  // gate_redirect 시 /api/chat/stream 재호출에 사용
    run.reworkDepts = []; run.reworkReasons = {}; run._criticMsgShown = false;
    for (const d of DEPTS) run.deptStates[d.id] = 'idle';
    // reset scene only if this is the active thread
    if (isActive(threadId)) state.scene?.resetAll();

    const cur = getActiveThread();
    if (cur && (!cur.title || cur.title === '신규 대화')) {
      cur.title = directive.slice(0, 30); saveThreads(); renderSidebar();
      dom.chatTitle.textContent = cur.title;
      apiSaveThread(cur).catch(() => {});
    }
    applyRunToUI(run);
    dom.directive.value = ''; autoSize(); clearAttachments();

    const url = new URL(API_BASE + '/api/director/stream', location.href);
    url.searchParams.set('directive', directive);
    url.searchParams.set('projectName', getProjectTitleOrGeneral());

    // SSE 타임아웃 — 360s 총 상한, 180s 경고, 연결 오류시 5s 간격 재연결 (2회 한정)
    const SSE_TOTAL_TIMEOUT_MS = 360000;
    const SSE_WARNING_MS = 180000;
    const RECONNECT_DELAY_MS = 5000;
    const MAX_RECONNECTS = 2;
    run.reconnects = 0;

    const openSse = () => {
      try {
        const es = new EventSource(url.toString(), { withCredentials:true });
        run.es = es;
        const listener = (ev) => onRunEvent(threadId, ev);
        ['executive_gate_start','executive_gate_done','executive_gate_redirect',
         'mission_start','dept_start','dept_progress','dept_done','dept_error',
         'critic_review','critic_start','critic_done','critic_rework',
         'dept_rework_start','dept_rework_done',
         'ceo_briefing','all_done','error','stream_end']
          .forEach(n => es.addEventListener(n, listener));
        es.onerror = () => {
          if (!run.running) return;
          if (run.reconnects < MAX_RECONNECTS) {
            run.reconnects++;
            try { es.close(); } catch {}
            addMsgForThread(threadId, { who:'', body:`연결 끊김 — 5초 후 재연결 시도 (${run.reconnects}/${MAX_RECONNECTS})`, kind:'sys' });
            setTimeout(() => { if (run.running) openSse(); }, RECONNECT_DELAY_MS);
            return;
          }
          addMsgForThread(threadId, { who:'', body:'연결 오류 (재연결 한도 초과).', kind:'err' });
          finishRun(threadId, true);
        };
      } catch (e) {
        addMsgForThread(threadId, { who:'', body:'연결 실패: ' + e.message, kind:'err' });
        finishRun(threadId, true);
      }
    };
    openSse();

    // 180s 경고
    run.warnTimer = setTimeout(() => {
      if (run.running) addMsgForThread(threadId, { who:'', body:'응답이 없습니다 (180초 경과)', kind:'sys' });
    }, SSE_WARNING_MS);
    // 360s 전체 타임아웃 — 강제 종료
    run.totalTimer = setTimeout(() => {
      if (run.running) {
        addMsgForThread(threadId, { who:'', body:'응답 타임아웃 (6분) — 연결 종료', kind:'err' });
        finishRun(threadId, true);
      }
    }, SSE_TOTAL_TIMEOUT_MS);
  }
  function finishRun(threadId, isErr = false){
    const run = ensureRun(threadId);
    if (!run.running && !run.es) return;
    run.running = false;
    if (run.es) { try { run.es.close(); } catch {} run.es = null; }
    if (run.warnTimer) { clearTimeout(run.warnTimer); run.warnTimer = null; }
    if (run.totalTimer) { clearTimeout(run.totalTimer); run.totalTimer = null; }
    if (isActive(threadId)) {
      dom.officeStatusDot.className = 'dot' + (isErr ? ' err' : '');
      dom.officeStatusText.textContent = isErr ? '오류' : '대기 중';
      state.scene?.settleAll();
      applyRunToUI(run);
    }
    renderSidebar();
  }
  // Allow clicking the stop button on the active thread
  function stopActiveRun(){
    const tid = state.activeThreadId; if (!tid) return;
    const run = state.threadRuns?.[tid]; if (!run) return;
    finishRun(tid, false);
    addMsg({ who:'', body:'중단됨', kind:'sys' });
  }

            const row = document.createElement('div');
            row.className = 'dept-row';
            row.innerHTML = `<span></span><span class="dname">${escapeHtml(st.name)}</span><span class="dstate">${v.toLocaleString()}원</span>`;
            s2.appendChild(row);
          }
          body.appendChild(s2);
        }
      });
    } else if (state.currentTab === 'pos') {
      body.innerHTML = '<div class="panel-empty">POS 데이터 로딩중...</div>';
      fetchPos().then((d) => {
        if (state.currentTab !== 'pos') return;
        if (!d) { body.innerHTML = '<div class="panel-empty">POS 데이터 없음</div>'; return; }
        body.innerHTML = '';
        const sec = document.createElement('div'); sec.className = 'panel-sec'; sec.innerHTML = '<h4>최근 거래</h4>';
        const list = (d.transactions || []).slice(0, 8);
        if (!list.length) sec.innerHTML += '<div class="panel-empty">거래 없음</div>';
        for (const tx of list) {
          const time = new Date(tx.createdAt).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
          const row = document.createElement('div');
          row.className = 'dept-row';
          row.innerHTML = `<span></span><span class="dname">${escapeHtml(tx.storeName || '매장')} · ${escapeHtml(time)}</span><span class="dstate">${Number(tx.total || 0).toLocaleString()}원</span>`;
          sec.appendChild(row);
        }
        body.appendChild(sec);
      });
    } else if (state.currentTab === 'report') {
      if (state.lastBriefing || state.lastCritic) {
        if (state.lastBriefing) {
          const b = state.lastBriefing;
          const sec = document.createElement('div'); sec.className = 'panel-sec'; sec.innerHTML = '<h4>CEO 브리핑</h4>';
          const card = document.createElement('div');
          card.style.cssText = 'background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.55';
          let h = '';
          if (b.summary) h += escapeHtml(b.summary);
          if (b.recommendations?.length) h += '<div class="sec" style="font-size:12px;color:var(--text-dim);font-weight:700;margin-top:6px;text-transform:uppercase">권고</div><ul style="margin:4px 0;padding-left:18px">' + b.recommendations.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
          card.innerHTML = h || '(브리핑 내용 없음)';
          sec.appendChild(card); body.appendChild(sec);
        }
        if (state.lastCritic) {
          const r = state.lastCritic;
          const sec = document.createElement('div'); sec.className = 'panel-sec'; sec.innerHTML = '<h4>상무 검토</h4>';
          const card = document.createElement('div');
          card.style.cssText = 'background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--magenta);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.55';
          const v = r.verdict === 'pass' ? '✓ PASS' : '⚠ 보강 필요';
          let h = `<b>${v}</b><br>${escapeHtml(r.summary || '')}`;
          if (r.keyIssues?.length) h += '<ul style="margin:6px 0;padding-left:18px">' + r.keyIssues.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
          card.innerHTML = h;
          sec.appendChild(card); body.appendChild(sec);
        }
      } else body.innerHTML = '<div class="panel-empty">실행 완료 후 CEO 브리핑과 상무 검토가 여기에 표시됩니다.</div>';
    }
  }

  // ─── API ─────────────────────────────────────────────────────────
  async function apiLoadWorkspace(){
    try {
      const r = await fetch(API_BASE + '/api/workspace', { credentials:'include' });
      if (!r.ok) return null;
      const j = await r.json();
      return j?.data || null;
    } catch { return null; }
  }
  async function apiSaveProject(p){
    return fetch(API_BASE + '/api/workspace/projects', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id:p.id, title:p.title, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), meta:p.meta || {} }),
    });
  }
  async function apiDeleteProject(id){ return fetch(API_BASE + '/api/workspace/projects/' + encodeURIComponent(id), { method:'DELETE', credentials:'include' }); }
  async function apiSaveThread(t){
    return fetch(API_BASE + '/api/workspace/threads', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id:t.id, projectId:t.projectId || GENERAL, title:t.title || '신규 대화',
        createdAt:new Date(t.updatedAt || Date.now()).toISOString(),
        updatedAt:new Date(t.updatedAt || Date.now()).toISOString(),
        meta:t.meta || {},
      }),
    });
  }
  async function apiDeleteThread(id){ return fetch(API_BASE + '/api/workspace/threads/' + encodeURIComponent(id), { method:'DELETE', credentials:'include' }); }
  async function apiSaveMessages(threadId, messages){
    // 서버 messages 테이블은 role CHECK('user','assistant') 가 걸려 있다.
    // 로컬 메시지 모델(kind/body/ts/attachments) → 서버 스키마(role/content/createdAt/attachedFiles) 로 정규화.
    const normalized = (messages || []).map(m => {
      if (!m || typeof m !== 'object') return null;
      const kind = String(m.kind || '').toLowerCase();
      const role = kind === 'user' ? 'user' : 'assistant';
      const body = m.content ?? m.body ?? '';
      const content = typeof body === 'string' ? body : String(body ?? '');
      if (!m.id || !content) return null;
      const createdAt = typeof m.createdAt === 'string'
        ? m.createdAt
        : new Date(typeof m.ts === 'number' ? m.ts : Date.now()).toISOString();
      const requestMeta = {
        kind: kind || undefined,
        who: m.who ?? undefined,
        deptId: m.deptId ?? undefined,
        html: m.html ? true : undefined,
      };
      const attachedFiles = Array.isArray(m.attachments) && m.attachments.length ? m.attachments : undefined;
      return {
        id: m.id,
        role,
        content,
        createdAt,
        status: m.status || 'done',
        requestMeta,
        attachedFiles,
      };
    }).filter(Boolean);
    return fetch(API_BASE + '/api/workspace/messages', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ threadId, messages: normalized }),
    });
  }
  let syncStateTimer = null;
  function apiSyncState(){
    if (syncStateTimer) clearTimeout(syncStateTimer);
    syncStateTimer = setTimeout(() => {
      fetch(API_BASE + '/api/workspace/sync-state', {
        method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ activeProjectId:state.activeProjectId || GENERAL, activeThreadId:state.activeThreadId }),
      }).catch(() => {});
    }, 500);
  }

  // ─── Initial ────────────────────────────────────────────────────
  async function init(){
    applyToggles();
    // Pull server snapshot (auth required); falls back silently to localStorage
    const ws = await apiLoadWorkspace();
    if (ws?.projects && Array.isArray(ws.projects)) {
      // 서버 스냅샷에 __general__ 가 있어도 사이드바에는 절대 추가하지 않음
      state.projects = ws.projects
        .filter(p => p && p.id && p.id !== GENERAL)
        .map(p => ({ id:p.id, title:p.title, updatedAt:new Date(p.updatedAt || p.createdAt || Date.now()).getTime(), meta:p.meta || {} }));
      saveProjects();
    }
    if (ws?.threads && Array.isArray(ws.threads)) {
      const map = {};
      for (const t of ws.threads) {
        const pid = t.projectId || GENERAL;
        if (!map[pid]) map[pid] = [];
        map[pid].push({
          id:t.id, projectId:pid, title:t.title || '신규 대화',
          messages:Array.isArray(t.messages) ? t.messages : [],
          meta:t.meta || {}, updatedAt:new Date(t.updatedAt || Date.now()).getTime(),
        });
      }
      state.threads = map; saveThreads();
    }
    if (ws?.activeThreadId) { state.activeThreadId = ws.activeThreadId; localStorage.setItem(LS.ACTIVE_THREAD, ws.activeThreadId); }
    if (ws?.activeProjectId) state.activeProjectId = ws.activeProjectId;

    renderSidebar();
    switchTab(state.currentTab);

    const cur = getActiveThread();
    if (cur) {
      state.activeProjectId = cur.projectId || GENERAL;
      dom.chatTitle.textContent = cur.title || '신규 대화';
      if (cur.messages.length > 0) {
        dom.chatLog.innerHTML = '';
        for (const m of cur.messages) addMsg(m, false);
      }
    } else {
      // 스레드 없음 — 프로젝트 홈 또는 빈 채팅 placeholder 표시 (자동 스레드 생성 금지)
      state.activeThreadId = null;
      renderMainArea();
    }

    dom.navNewChat.addEventListener('click', (e) => { e.preventDefault(); newChat(); });
    dom.newProject.addEventListener('click', (e) => { e.stopPropagation(); newProject(); });

    setTimeout(() => { dom.directive.focus(); autoSize(); }, 200);
  }
  init();
})();
</script>
