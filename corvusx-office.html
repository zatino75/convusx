    chairBody:0x374151, chairSeat:0x1f2937,
    monitorBezel:0x0b1020, monitorOn:0x3b82f6, keyboard:0xcbd5e1,
    plantPot:0x5c3f22, plantLeaf:0x16a34a, plantLeafLt:0x22c55e,
    sofaPurple:0x6d28d9, sofaDark:0x4c1d95,
    bookshelf:0x422712, tableWood:0x78543a,
    executiveGlow:0xfbbf24, ceoGlow:0xf59e0b,
  };

  class OfficeScene extends Phaser.Scene {
    constructor(){ super('office'); }
    create(){
      state.scene = this;
      window.phaserScene = this;
      // CustomEvent 브리지 — SSE 핸들러에서 dispatch 하면 씬이 수신
      this._officeEventHandler = (e) => {
        const d = (e && e.detail) || {};
        switch (d.type) {
          case 'executive_gate_done': this.onGateDone(d.departments || []); break;
          case 'dept_start':          this.onDeptStart(d.deptId, d.objective); break;
          case 'dept_done':           this.onDeptDone(d.deptId); break;
          case 'dept_error':          this.goError(d.deptId); break;
          case 'dept_rework_start':   this.onDeptReworkStart(d.deptId, d.reason); break;
          case 'dept_rework_done':    this.onDeptDone(d.deptId); break;
          case 'critic_start':        this.onCriticStart(); break;
          case 'critic_done':         this.onCriticDone(); break;
          case 'ensemble_start':      this.onEnsembleStart(d.deptId, d.reason); break;
          case 'ensemble_voice':      this.onEnsembleVoice(d.deptId, d.model, d.message, d.confidence); break;
          case 'ensemble_done':       this.onEnsembleDone(d.deptId, d.verdict); break;
          case 'ceo_briefing':        this.onCeoBriefing(); break;
          case 'all_done':            this.onAllDone(); break;
        }
      };
      window.addEventListener('office-event', this._officeEventHandler);
      this.events.once('shutdown', () => {
        window.removeEventListener('office-event', this._officeEventHandler);
        if (window.phaserScene === this) window.phaserScene = null;
      });
      // map center is around (isoX(4,3), isoY(4,3)); compute and centerOn that
      const mapCX = isoX(3.5, 3.0), mapCY = isoY(3.5, 3.0);
      this.cameras.main.setZoom(2.2);
      this.cameras.main.centerOn(mapCX, mapCY);
      this.bg = this.add.container(0, 0);
      this.floorLayer = this.add.container(0, 0);
      this.staticFurn = this.add.container(0, 0);
      this.shadowLayer = this.add.container(0, 0);
      this.deskGlowLayer = this.add.container(0, 0);
      this.dynamicFurn = this.add.container(0, 0);
      this.charLayer = this.add.container(0, 0);
      this.lightLayer = this.add.container(0, 0);
      this.drawFloor();
      this.drawRooms();
      this.drawWalls();
      this.drawFurniture();
      this.deskGlows = {};
      this.createDeskGlows();
      this.createCharacters();
      this.addRoomLabels();
      this.initLights();
      this.initMonitorFlicker();

      // resize listener for responsive centering (keeps map centered on container resize)
      this.scale.on('resize', () => this.cameras.main.centerOn(mapCX, mapCY));
    }
    createDeskGlows(){
      for (const c of CUBICLES) {
        const g = this.add.graphics();
        g.setVisible(false);
        this.deskGlowLayer.add(g);
        this.deskGlows[c.deptId] = { g, tx:c.tx, ty:c.ty, tween:null };
      }
    }
    setDeskGlow(deptId, on, hex = '#3b82f6'){
      const dg = this.deskGlows[deptId]; if (!dg) return;
      if (dg.tween) { dg.tween.stop(); dg.tween = null; }
      dg.g.clear();
      if (!on) { dg.g.setVisible(false); return; }
      dg.g.setVisible(true);
      const cx = isoX(dg.tx, dg.ty), cy = isoY(dg.tx, dg.ty);
      const colorNum = Phaser.Display.Color.HexStringToColor(hex).color;
      dg.g.fillStyle(colorNum, 0.22);
      dg.g.fillEllipse(cx, cy + 2, 90, 44);
      dg.g.lineStyle(1, colorNum, 0.45);
      dg.g.strokeEllipse(cx, cy + 2, 90, 44);
      dg.tween = this.tweens.add({ targets:dg.g, alpha:{from:0.55,to:1}, duration:1100, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    }
    addRoomLabels(){
      const mk = (x, y, txt, c) => this.add.text(x, y, txt, {
        fontFamily:'Inter,system-ui,sans-serif', fontSize:'10px', fontStyle:'bold', color:c,
      }).setOrigin(0.5, 0.5);
      this.bg.add(mk(isoX(1, 0.5),   isoY(1, 0.5)   - 42, '회의실',     '#94a3b8'));
      this.bg.add(mk(isoX(3.5, 0.5), isoY(3.5, 0.5) - 42, '상무실',     '#fbbf24'));
      this.bg.add(mk(isoX(6.5, 0.5), isoY(6.5, 0.5) - 42, '상무실', '#f59e0b'));
      this.bg.add(mk(isoX(3.5, 3.0), isoY(3.5, 3.0) - 62, '업무공간',   '#64748b'));
      this.bg.add(mk(isoX(3.5, 5.0), isoY(3.5, 5.0) - 18, '휴게실',     '#64748b'));
    }
    drawFloor(){
      const g = this.add.graphics();
      this.floorLayer.add(g);
      for (let tx = 0; tx < 8; tx++) for (let ty = 0; ty < 6; ty++) {
        const cx = isoX(tx, ty), cy = isoY(tx, ty);
        g.fillStyle((tx+ty)%2===0 ? C.floorA : C.floorB, 1);
        g.beginPath(); g.moveTo(cx, cy - TILE_H/2); g.lineTo(cx + TILE_W/2, cy);
        g.lineTo(cx, cy + TILE_H/2); g.lineTo(cx - TILE_W/2, cy); g.closePath(); g.fillPath();
        g.lineStyle(1, C.floorEdge, 0.5); g.strokePath();
      }
    }
    drawRooms(){
      const g = this.add.graphics(); this.floorLayer.add(g);
      this.fillRoomFloor(g, 0, 2, 0, 2, 0x1e293b, 0.55);
      this.fillRoomFloor(g, 3, 5, 0, 2, 0x1f1a10, 0.45);
      this.fillRoomFloor(g, 5, 8, 0, 2, 0x2a1f0a, 0.55);
      this.fillRoomFloor(g, 2, 5, 5, 6, 0x1e1b4b, 0.45);
    }
    fillRoomFloor(g, x1, x2, y1, y2, color, alpha){
      const pts = [[x1,y1],[x2,y1],[x2,y2],[x1,y2]];
      g.fillStyle(color, alpha); g.beginPath();
      g.moveTo(isoX(pts[0][0], pts[0][1]), isoY(pts[0][0], pts[0][1]));
      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));
      g.closePath(); g.fillPath();
    }
    drawWalls(){
      const g = this.add.graphics(); this.floorLayer.add(g);
      const segs = [
        { a:{tx:0,ty:2}, b:{tx:2,ty:2}, c:0x334155 },
        { a:{tx:2,ty:0}, b:{tx:2,ty:2}, c:0x334155 },
        { a:{tx:3,ty:0}, b:{tx:3,ty:2}, c:0x4a3820 },
        { a:{tx:3,ty:2}, b:{tx:5,ty:2}, c:0x4a3820 },
        { a:{tx:5,ty:0}, b:{tx:5,ty:2}, c:0x4a3820 },
        { a:{tx:5,ty:2}, b:{tx:8,ty:2}, c:0x5a3f1f },
        { a:{tx:2,ty:5}, b:{tx:5,ty:5}, c:0x312e81 },
      ];
      for (const s of segs) {
        g.lineStyle(2.5, s.c, 0.9); g.beginPath();
        g.moveTo(isoX(s.a.tx, s.a.ty), isoY(s.a.tx, s.a.ty));
        g.lineTo(isoX(s.b.tx, s.b.ty), isoY(s.b.tx, s.b.ty));
        g.strokePath();
      }
    }
    isoBox(g, tx, ty, w, d, h, top, sL, sR){
      const x1 = isoX(tx, ty), y1 = isoY(tx, ty);
      const x2 = isoX(tx + w, ty), y2 = isoY(tx + w, ty);
      const x3 = isoX(tx + w, ty + d), y3 = isoY(tx + w, ty + d);
      const x4 = isoX(tx, ty + d), y4 = isoY(tx, ty + d);
      g.fillStyle(sR, 1); g.beginPath();
      g.moveTo(x2, y2); g.lineTo(x3, y3); g.lineTo(x3, y3 - h); g.lineTo(x2, y2 - h); g.closePath(); g.fillPath();
      g.fillStyle(sL, 1); g.beginPath();
      g.moveTo(x3, y3); g.lineTo(x4, y4); g.lineTo(x4, y4 - h); g.lineTo(x3, y3 - h); g.closePath(); g.fillPath();
      g.fillStyle(top, 1); g.beginPath();
      g.moveTo(x1, y1 - h); g.lineTo(x2, y2 - h); g.lineTo(x3, y3 - h); g.lineTo(x4, y4 - h); g.closePath(); g.fillPath();
      g.lineStyle(1, 0x050810, 0.5); g.strokePath();
    }
    drawMonitor(g, cx, cy){
      g.fillStyle(C.monitorBezel, 1); g.fillRect(cx - 9, cy - 13, 18, 12);
      g.fillStyle(0x0f172a, 1); g.fillRect(cx - 7, cy - 11, 14, 8);
      g.fillStyle(0x374151, 1); g.fillRect(cx - 2, cy - 1, 4, 3); g.fillRect(cx - 5, cy + 2, 10, 1);
    }
    drawKeyboard(g, cx, cy){ g.fillStyle(C.keyboard, 0.85); g.fillRect(cx - 8, cy + 4, 16, 4); }
    drawChair(g, tx, ty){
      this.isoBox(g, tx - 0.15, ty + 0.05, 0.3, 0.3, 6, C.chairSeat, 0x0b0f1a, 0x12182a);
      this.isoBox(g, tx - 0.15, ty + 0.05, 0.3, 0.08, 14, C.chairBody, 0x1e2742, 0x2a3454);
    }
    drawPlant(g, cx, cy){
      g.fillStyle(C.plantPot, 1); g.fillRect(cx - 5, cy - 2, 10, 8);
      g.fillStyle(C.plantLeaf, 1);   g.fillCircle(cx - 2, cy - 6, 5); g.fillCircle(cx + 3, cy - 7, 5);
      g.fillStyle(C.plantLeafLt, 1); g.fillCircle(cx, cy - 9, 4);     g.fillCircle(cx + 5, cy - 5, 3);
    }
    drawFurniture(){
      const g = this.add.graphics(); this.staticFurn.add(g);
      const mcx = isoX(1.0, 0.9), mcy = isoY(1.0, 0.9);
      g.fillStyle(C.tableWood, 1); g.fillEllipse(mcx, mcy, 84, 42);
      g.lineStyle(1, 0x3a2412, 0.8); g.strokeEllipse(mcx, mcy, 84, 42);
      g.fillStyle(0x553a20, 1); g.fillEllipse(mcx, mcy - 2, 66, 32);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const cx = mcx + Math.cos(a) * 52, cy = mcy + Math.sin(a) * 24;
        g.fillStyle(C.chairBody, 1); g.fillEllipse(cx, cy + 2, 13, 8);
        g.fillStyle(0x0b0f1a, 1); g.fillEllipse(cx, cy, 10, 6);
      }
      this.drawPlant(g, isoX(0.2, 0.2), isoY(0.2, 0.2));
      this.drawPlant(g, isoX(1.9, 1.9), isoY(1.9, 1.9));
      // 상무실
      this.isoBox(g, 3.3, 0.7, 1.2, 0.6, 13, C.deskTop, C.deskFront, C.deskSide);
      this.drawMonitor(g, isoX(3.9, 0.85), isoY(3.9, 0.85) - 8);
      this.drawKeyboard(g, isoX(3.9, 1.0), isoY(3.9, 1.0) - 8);
      this.drawChair(g, 3.9, 1.55);
      this.isoBox(g, 3.1, 0.1, 0.25, 0.8, 26, C.bookshelf, 0x2a1810, 0x35201b);
      const bx = isoX(3.15, 0.5), by = isoY(3.15, 0.5);
      for (let i = 0; i < 4; i++) { g.fillStyle([0xDC2626, 0x2563EB, 0x059669, 0xD97706][i], 1); g.fillRect(bx - 4, by - 24 + i * 5, 8, 4); }
      this.drawPlant(g, isoX(4.7, 0.3), isoY(4.7, 0.3));
      // CEO
      this.isoBox(g, 5.5, 0.4, 1.8, 0.9, 14, C.deskTop, C.deskFront, C.deskSide);
      this.drawMonitor(g, isoX(6.4, 0.65), isoY(6.4, 0.65) - 9);
      this.drawKeyboard(g, isoX(6.4, 0.85), isoY(6.4, 0.85) - 9);
      this.isoBox(g, 6.3, 1.35, 0.5, 0.5, 22, 0x0b0f1a, 0x05080f, 0x08101c);
      this.isoBox(g, 7.2, 0.5, 0.5, 1.3, 8, C.sofaPurple, C.sofaDark, 0x3730a3);
      this.isoBox(g, 7.2, 0.5, 0.5, 0.2, 14, 0x8B5CF6, C.sofaPurple, 0x5B21B6);
      this.isoBox(g, 5.1, 0.1, 0.25, 1.0, 26, C.bookshelf, 0x2a1810, 0x35201b);
      const cbx = isoX(5.15, 0.6), cby = isoY(5.15, 0.6);
      for (let i = 0; i < 5; i++) { g.fillStyle([0xDC2626, 0x2563EB, 0x059669, 0xD97706, 0x7C3AED][i], 1); g.fillRect(cbx - 4, cby - 24 + i * 5, 8, 4); }
      this.drawPlant(g, isoX(5.4, 1.8), isoY(5.4, 1.8));
      // 큐비클
      for (const c of CUBICLES) {
        this.isoBox(g, c.tx - 0.45, c.ty - 0.35, 0.9, 0.65, 10, C.deskTop, C.deskFront, C.deskSide);
        this.drawMonitor(g, isoX(c.tx, c.ty - 0.12), isoY(c.tx, c.ty - 0.12) - 8);
        this.drawKeyboard(g, isoX(c.tx, c.ty + 0.05), isoY(c.tx, c.ty + 0.05) - 8);
        this.drawChair(g, c.tx, c.ty + 0.35);
      }
      this.drawPlant(g, isoX(0.3, 3.5), isoY(0.3, 3.5));
      this.drawPlant(g, isoX(7.3, 3.0), isoY(7.3, 3.0));
      this.drawPlant(g, isoX(0.4, 2.0), isoY(0.4, 2.0));
      // 휴게실
      this.isoBox(g, 2.8, 5.3, 2.0, 0.4, 10, 0x334155, 0x1e293b, 0x263448);
      this.isoBox(g, 2.8, 5.15, 2.0, 0.15, 14, 0x475569, 0x334155, 0x3b4b66);
      this.isoBox(g, 3.4, 5.7, 0.8, 0.3, 6, C.tableWood, 0x3a2412, 0x513020);
      this.drawPlant(g, isoX(5.2, 5.8), isoY(5.2, 5.8));
    }
    initLights(){
      this.executiveLight = this.add.graphics(); this.ceoLight = this.add.graphics();
      this.lightLayer.add(this.executiveLight); this.lightLayer.add(this.ceoLight);
      this.executiveLight.setVisible(false); this.ceoLight.setVisible(false);
    }
    lightExecutive(on){
      const g = this.executiveLight; g.clear();
      if (!on) { g.setVisible(false); return; }
      g.setVisible(true);
      const pts = [[3,0],[5,0],[5,2],[3,2]];
      g.fillStyle(C.executiveGlow, 0.25); g.beginPath();
      g.moveTo(isoX(pts[0][0], pts[0][1]), isoY(pts[0][0], pts[0][1]));
      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));
      g.closePath(); g.fillPath();
      this.tweens.add({ targets:g, alpha:{from:0.6,to:1}, duration:900, yoyo:true, repeat:-1 });
    }
    lightCeo(on){
      const g = this.ceoLight; g.clear();
      if (!on) { g.setVisible(false); return; }
      g.setVisible(true);
      const pts = [[5,0],[8,0],[8,2],[5,2]];
      g.fillStyle(C.ceoGlow, 0.25); g.beginPath();
      g.moveTo(isoX(pts[0][0], pts[0][1]), isoY(pts[0][0], pts[0][1]));
      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));
      g.closePath(); g.fillPath();
      this.tweens.add({ targets:g, alpha:{from:0.6,to:1}, duration:1100, yoyo:true, repeat:-1 });
    }
    initMonitorFlicker(){
      this.monitorG = this.add.graphics(); this.dynamicFurn.add(this.monitorG);
      this.time.addEvent({
        delay:800, loop:true, callback:() => {
          this.monitorG.clear();
          for (const c of CUBICLES) {
            const mx = isoX(c.tx, c.ty - 0.12), my = isoY(c.tx, c.ty - 0.12) - 8;
            const on = Math.random() > 0.35;
            const col = on ? (Math.random() > 0.5 ? 0x3b82f6 : 0x10b981) : 0x0f172a;
            this.monitorG.fillStyle(col, 0.88); this.monitorG.fillRect(mx - 7, my - 11, 14, 8);
          }
        },
      });
    }
    createCharacters(){
      this.characters = {};
      DEPTS.forEach((d) => {
        const cub = CUBICLES.find(c => c.deptId === d.id);
        const sx = isoX(cub.tx, cub.ty + 0.3), sy = isoY(cub.tx, cub.ty + 0.3) - 4;

        // shadow under character
        const shadow = this.add.ellipse(sx, sy + 4, 14, 5, 0x000000, 0.35);
        this.shadowLayer.add(shadow);

        const container = this.add.container(sx, sy); container.setDepth(Math.floor(sy));
        const hair = this.add.rectangle(0, -22, 10, 3, 0x0a0d14).setOrigin(0.5, 0.5);
        const head = this.add.rectangle(0, -18, 10, 10, 0xf6d5ad).setOrigin(0.5, 0.5);
        const eyeL = this.add.rectangle(-2, -18, 1, 1, 0x000).setOrigin(0.5, 0.5);
        const eyeR = this.add.rectangle(2, -18, 1, 1, 0x000).setOrigin(0.5, 0.5);
        const body = this.add.rectangle(0, -8, 10, 12, d.color).setOrigin(0.5, 0.5);
        const armL = this.add.rectangle(-6, -8, 2, 8, d.color).setOrigin(0.5, 0.5);
        const armR = this.add.rectangle(6, -8, 2, 8, d.color).setOrigin(0.5, 0.5);
        const legL = this.add.rectangle(-2, 1, 3, 6, 0x0a0d14).setOrigin(0.5, 0.5);
        const legR = this.add.rectangle(2, 1, 3, 6, 0x0a0d14).setOrigin(0.5, 0.5);
        container.add([hair, head, eyeL, eyeR, body, armL, armR, legL, legR]);
        const data = {
          deptId:d.id, color:d.color, hex:d.hex, container, shadow,
          head, hair, body, armL, armR, legL, legR,
          cubicle:cub, meetingSeat:d._meetingSeat,
          state:'idle', bubble:null, bubbleTimer:null,
          bobTween:null, armTweenL:null, armTweenR:null, walkTween:null, shadowTween:null,
        };
        this.characters[d.id] = data;
        this.charLayer.add(container);
        this.startIdleBob(data);
      });
    }
    startIdleBob(c){
      this.stopTweens(c);
      c.bobTween = this.tweens.add({
        targets:c.container, y:c.container.y - 1.8,
        duration:800, yoyo:true, repeat:-1, ease:'Sine.easeInOut',
      });
      // shadow pulse in sync
      c.shadowTween = this.tweens.add({
        targets:c.shadow, scaleX:{from:1,to:0.9}, alpha:{from:0.35,to:0.28},
        duration:800, yoyo:true, repeat:-1, ease:'Sine.easeInOut',
      });
    }
    stopTweens(c){ [c.bobTween, c.armTweenL, c.armTweenR, c.walkTween, c.shadowTween].forEach(t => t && t.stop()); c.bobTween = c.armTweenL = c.armTweenR = c.walkTween = c.shadowTween = null; }
    walkCharTo(c, tx, ty, done){
      this.stopTweens(c);
      const destX = isoX(tx, ty), destY = isoY(tx, ty) - 4;
      c.walkTween = this.tweens.chain({
        targets:c.container,
        tweens:[
          { x:destX, duration:350, ease:'Sine.easeInOut' },
          { y:destY, duration:350, ease:'Sine.easeInOut' },
        ],
        onComplete:() => { c.container.setDepth(Math.floor(destY)); if (done) done(); },
      });
      // shadow follows
      this.tweens.chain({
        targets:c.shadow,
        tweens:[
          { x:destX, duration:350, ease:'Sine.easeInOut' },
          { y:destY + 4, duration:350, ease:'Sine.easeInOut' },
        ],
      });
      // legs step
      this.tweens.add({ targets:[c.legL, c.legR], y:{from:1,to:-1}, duration:90, yoyo:true, repeat:7 });
    }
    startTyping(c){
      this.stopTweens(c);
      c.armTweenL = this.tweens.add({ targets:c.armL, y:{from:-8,to:-5}, duration:170, yoyo:true, repeat:-1 });
      c.armTweenR = this.tweens.add({ targets:c.armR, y:{from:-5,to:-8}, duration:170, yoyo:true, repeat:-1 });
    }
    setBubble(c, text, colorHex = '#ffffff', autoHideMs = 3000){
      this.clearBubble(c);
      const bg = this.add.graphics();
      const t = this.add.text(0, 0, String(text).slice(0, 24), { fontFamily:'Inter,sans-serif', fontSize:'10px', color:'#1f2937' }).setOrigin(0.5, 0.5);
      const w = t.width + 10, h = 14;
      bg.fillStyle(Phaser.Display.Color.HexStringToColor(colorHex).color, 1);
      bg.fillRoundedRect(-w / 2, -h / 2, w, h, 3);
      bg.lineStyle(1, 0x1f2937, 1); bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 3);
      bg.fillTriangle(-3, h / 2 - 1, 3, h / 2 - 1, 0, h / 2 + 3);
      const bubble = this.add.container(0, -32, [bg, t]); c.container.add(bubble);
      bubble.alpha = 0; bubble.y = -26;
      this.tweens.add({ targets:bubble, alpha:1, y:-32, duration:220, ease:'Cubic.easeOut' });
      c.bubble = bubble;
      if (c.bubbleTimer) c.bubbleTimer.remove();
      if (autoHideMs > 0) c.bubbleTimer = this.time.delayedCall(autoHideMs, () => this.clearBubble(c));
    }
    clearBubble(c){
      if (c.bubble) {
        const b = c.bubble; c.bubble = null;
        this.tweens.add({ targets:b, alpha:0, y:b.y - 4, duration:180, ease:'Cubic.easeIn', onComplete:() => b.destroy() });
      }
      if (c.bubbleTimer) { c.bubbleTimer.remove(); c.bubbleTimer = null; }
    }
    emitStars(c){
      for (let i = 0; i < 3; i++) {
        const s = this.add.text(0, -28, '★', { fontFamily:'Inter,system-ui', fontSize:'13px', color:'#fbbf24' }).setOrigin(0.5, 0.5);
        c.container.add(s);
        this.tweens.add({ targets:s, x:(i - 1) * 10, y:-48 - Math.random() * 10, alpha:{from:1,to:0}, duration:900 + i * 120, ease:'Cubic.easeOut', onComplete:() => s.destroy() });
      }
    }
    // 2026-04-17 전면 개편: 책상 고정 타이핑 방식. walk-to-meeting 은 rework 만 사용.
    goWork(deptId, objective){ this.onDeptStart(deptId, objective); }
    progressMsg(deptId, msg){ const c = this.characters[deptId]; if (c && c.state === 'working' && msg) this.setBubble(c, msg, '#dbeafe', 0); }
    goDone(deptId){ this.onDeptDone(deptId); }

    // ─── 새 애니메이션 훅 (CustomEvent bridge 에서 호출) ─────────────────
    onGateDone(departments){
      const ids = new Set((departments || []).map(d => (d && d.id) || d).filter(Boolean));
      for (const deptId of Object.keys(this.characters)) {
        if (!ids.has(deptId)) continue;
        const c = this.characters[deptId];
        // 선택된 부서만: 살짝 점프 (일어나기)  + 데스크 글로우 예열
        this.stopTweens(c);
        this.tweens.add({ targets:c.container, y:c.container.y - 3, duration:140, yoyo:true, ease:'Sine.easeOut' });
        this.setDeskGlow(deptId, true, c.hex);
        this.setBubble(c, '네!', '#fef3c7', 1400);
        this.time.delayedCall(200, () => { if (c.state === 'idle') this.startIdleBob(c); });
      }
    }
    onDeptStart(deptId, objective){
      const c = this.characters[deptId]; if (!c) return;
      // 책상 고정 — walk-to-meeting 없이 바로 타이핑
      this.stopTweens(c);
      const homeX = isoX(c.cubicle.tx, c.cubicle.ty + 0.3);
      const homeY = isoY(c.cubicle.tx, c.cubicle.ty + 0.3) - 4;
      c.container.setPosition(homeX, homeY);
      c.shadow.setPosition(homeX, homeY + 4);
      c.state = 'working'; state.deptStates[deptId] = 'working';
      this.setDeskGlow(deptId, true, c.hex);
      this.startTyping(c);
      this.setBubble(c, objective ? String(objective).slice(0, 20) : '분석 중...', '#dbeafe', 0);
      renderPanel();
    }
    onDeptDone(deptId){
      const c = this.characters[deptId]; if (!c) return;
      this.stopTweens(c); this.clearBubble(c);
      c.state = 'idle'; state.deptStates[deptId] = 'done';
      // 뒤로 기대는 모션 — container 를 뒤로 살짝
      this.tweens.add({ targets:c.container, y:c.container.y + 2, duration:200, yoyo:true, ease:'Sine.easeInOut' });
      this.setBubble(c, '✓ 완료', '#d1fae5', 1800);
      this.emitStars(c);
      // 글로우 페이드
      const dg = this.deskGlows[deptId];
      if (dg) {
        if (dg.tween) { dg.tween.stop(); dg.tween = null; }
        this.tweens.add({
          targets:dg.g, alpha:0, duration:900, ease:'Sine.easeOut',
          onComplete:() => this.setDeskGlow(deptId, false),
        });
      }
      this.time.delayedCall(220, () => this.startIdleBob(c));
      renderPanel();
    }
    onCriticStart(){
      this.lightExecutive(true);
    }
    onCriticDone(){
      // critic 끝난 직후는 굳이 바로 끄지 않음 — all_done 에서 일괄 처리
    }
    onAllDone(){
      // CEO 잠깐 활성 (보고 받는 느낌)
      this.lightCeo(true);
      this.time.delayedCall(1200, () => {
        this.lightCeo(false);
        this.lightExecutive(false);
        for (const deptId of Object.keys(this.characters)) {
          const c = this.characters[deptId];
          this.setDeskGlow(deptId, false);
          if (c.state !== 'idle') { this.stopTweens(c); c.state = 'idle'; this.startIdleBob(c); }
          state.deptStates[deptId] = 'idle';
        }
        renderPanel();
      });
    }
    goError(deptId){
      const c = this.characters[deptId]; if (!c) return;
      this.stopTweens(c); this.clearBubble(c);
      state.deptStates[deptId] = 'err';
      // 빨간 글로우로 오류 표시
      this.setDeskGlow(deptId, true, '#ef4444');
      // shake 효과 — 좌우로 6번 진동
      const baseX = c.container.x;
      this.tweens.add({
        targets: c.container,
        x: { from: baseX - 3, to: baseX + 3 },
        duration: 60, yoyo: true, repeat: 5, ease: 'Sine.easeInOut',
        onComplete: () => { c.container.x = baseX; },
      });
      const homeX = isoX(c.cubicle.tx, c.cubicle.ty + 0.3);
      if (Math.abs(c.container.x - homeX) > 3) {
        c.state = 'returning';
        this.walkCharTo(c, c.cubicle.tx, c.cubicle.ty + 0.3, () => { c.state = 'idle'; this.setBubble(c, '! 오류', '#fecaca', 3000); this.startIdleBob(c); });
      } else { c.state = 'idle'; this.setBubble(c, '! 오류', '#fecaca', 3000); this.startIdleBob(c); }
      // 1.5s 후 오류 글로우 페이드
      this.time.delayedCall(1500, () => this.setDeskGlow(deptId, false));
      renderPanel();
    }
    resetAll(){
      this.lightExecutive(false); this.lightCeo(false);
      for (const d of DEPTS) this.setDeskGlow(d.id, false);
      for (const c of Object.values(this.characters)) {
        this.stopTweens(c); this.clearBubble(c);
        const hx = isoX(c.cubicle.tx, c.cubicle.ty + 0.3);
        const hy = isoY(c.cubicle.tx, c.cubicle.ty + 0.3) - 4;
        c.container.setPosition(hx, hy);
        c.shadow.setPosition(hx, hy + 4);
        c.state = 'idle'; this.startIdleBob(c);
      }
      DEPTS.forEach(d => { state.deptStates[d.id] = 'idle'; });
      state.lastBriefing = null; state.lastCritic = null;
      renderPanel();
    }
    settleAll(){
      for (const c of Object.values(this.characters)) {
        if (c.state !== 'working' && c.state !== 'walking') continue;
        this.stopTweens(c); this.clearBubble(c);
        c.state = 'returning';
        this.walkCharTo(c, c.cubicle.tx, c.cubicle.ty + 0.3, () => { c.state = 'idle'; this.startIdleBob(c); });
      }
    }
    recallToMeeting(deptId, reason){
      const c = this.characters[deptId]; if (!c) return;
      c.state = 'walking'; this.stopTweens(c);
      this.walkCharTo(c, c.meetingSeat.tx, c.meetingSeat.ty, () => { c.state = 'working'; this.startTyping(c); this.setBubble(c, reason || '보완 작업', '#ffe3a0', 4000); });
    }
    // ─── 앙상블 훅 — ensemble_start/voice/done ─────────────────────────
    onEnsembleStart(deptId, reason){
      const c = this.characters[deptId]; if (!c) return;
      // cyan 글로우로 앙상블 중임을 구분
      this.setDeskGlow(deptId, true, '#22d3ee');
      this.setBubble(c, '🧠 3-AI 앙상블', '#cffafe', 2400);
    }
    onEnsembleVoice(deptId, model, message, confidence){
      const c = this.characters[deptId]; if (!c) return;
      const label = (model || 'AI').replace(/^claude-opus.*/i, 'Claude')
                                   .replace(/^gpt.*/i, 'GPT')
                                   .replace(/^gemini.*/i, 'Gemini');
      const conf = (typeof confidence === 'number') ? ` (${Math.round(confidence * 100)}%)` : '';
      const preview = (message || '').slice(0, 28);
      this.setBubble(c, `${label}${conf}: ${preview}`, '#e0f2fe', 3200);
      // confidence 높음=초록, 보통=파랑, 낮음=주황
      const hex = (typeof confidence === 'number')
        ? (confidence >= 0.7 ? '#10b981' : confidence >= 0.45 ? '#22d3ee' : '#f59e0b')
        : '#22d3ee';
      const dg = this.deskGlows[deptId];
      if (dg && dg.g && dg.g.visible) {
        this.tweens.add({ targets: dg.g, alpha: { from: 1, to: 0.5 }, duration: 180, yoyo: true });
      } else {
        this.setDeskGlow(deptId, true, hex);
      }
    }
    onEnsembleDone(deptId, verdict){
      const c = this.characters[deptId]; if (!c) return;
      const bg = verdict === 'consensus' ? '#d1fae5'
              : verdict === 'split' ? '#fef3c7'
              : '#fee2e2';
      const label = verdict === 'consensus' ? '✓ 합의'
                  : verdict === 'split' ? '△ 분기'
                  : '? 불확실';
      this.setBubble(c, label, bg, 2000);
    }
    onDeptReworkStart(deptId, reason){
      const c = this.characters[deptId]; if (!c) return;
      this.stopTweens(c);
      c.state = 'working'; state.deptStates[deptId] = 'rework';
      // orange 글로우로 재작업 표시
      this.setDeskGlow(deptId, true, '#f59e0b');
      this.startTyping(c);
      this.setBubble(c, '🔁 ' + (reason ? String(reason).slice(0, 22) : '보강 중'), '#fed7aa', 0);
      renderPanel();
    }
    onCeoBriefing(){
      // 상무실 + CEO 동시 하이라이트 + 골드 펄스
      this.lightExecutive(true);
      this.lightCeo(true);
      this.time.delayedCall(5000, () => { this.lightExecutive(false); this.lightCeo(false); });
    }
  }

  // ─── Minimal markdown renderer ──────────────────────────────────
  function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderMarkdown(text){
    if (!text) return '';
    const fenceBlocks = [];
    let work = String(text).replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_m, lang, code) => {
      const safeLang = (lang || '').trim().toLowerCase();
      const escaped = escapeHtml(code.replace(/\n$/, ''));
      let highlighted = escaped;
      try {
        if (window.hljs && safeLang && window.hljs.getLanguage(safeLang)) {
          highlighted = window.hljs.highlight(code.replace(/\n$/, ''), { language:safeLang, ignoreIllegals:true }).value;
        } else if (window.hljs) {
          highlighted = window.hljs.highlightAuto(code.replace(/\n$/, '')).value;
        }
      } catch { highlighted = escaped; }
      fenceBlocks.push(`<pre><button class="copy-code" type="button">복사</button><code class="hljs language-${safeLang}">${highlighted}</code></pre>`);
      return `\u0000FENCE${fenceBlocks.length - 1}\u0000`;
    });
    work = escapeHtml(work);

    work = work.replace(/^### (.+)$/gm, '<h3>$1</h3>')
               .replace(/^## (.+)$/gm, '<h2>$1</h2>')
               .replace(/^# (.+)$/gm, '<h1>$1</h1>')
               .replace(/^#### (.+)$/gm, '<h4>$1</h4>');

    work = work.replace(/^---$/gm, '<hr>');

    // blockquote
    work = work.replace(/^&gt; ?(.+)$/gm, '<blockquote>$1</blockquote>');

    // table: | a | b |\n|---|---|\n| c | d |
    work = work.replace(/(^\|.+\|$\n^\|(?:\s*:?-+:?\s*\|)+$\n(?:^\|.+\|$\n?)+)/gm, (block) => {
      const lines = block.trim().split(/\n/);
      if (lines.length < 2) return block;
      const header = lines[0].slice(1, -1).split('|').map(x => x.trim());
      const rows = lines.slice(2).map(r => r.slice(1, -1).split('|').map(x => x.trim()));
      const th = header.map(h => `<th>${h}</th>`).join('');
      const trs = rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
      return `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;
    });

    // lists
    work = work.replace(/(^(?:- |\* ).+(?:\n(?:- |\* ).+)*)/gm, (block) => {
      const items = block.split(/\n/).map(l => l.replace(/^(?:- |\* )/, '').trim()).filter(Boolean);
      return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
    });
    work = work.replace(/(^\d+\. .+(?:\n\d+\. .+)*)/gm, (block) => {
      const items = block.split(/\n/).map(l => l.replace(/^\d+\. /, '').trim()).filter(Boolean);
      return '<ol>' + items.map(i => `<li>${i}</li>`).join('') + '</ol>';
    });

    // bold / italic / inline code
    work = work.replace(/`([^`\n]+?)`/g, '<code class="inline">$1</code>');
    work = work.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    work = work.replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<em>$2</em>');
    // strikethrough ~~text~~
    work = work.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');

    // links
    work = work.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // bare urls (avoid double-wrap)
    work = work.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

    // paragraph wrap (skip block-level)
    work = work.split(/\n{2,}/).map(p => {
      if (/^\s*<(h\d|ul|ol|table|pre|blockquote|hr)/i.test(p.trim())) return p;
      if (!p.trim()) return '';
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    // restore fences
    work = work.replace(/\u0000FENCE(\d+)\u0000/g, (_m, i) => fenceBlocks[Number(i)] || '');
    return work;
  }

  function bindCopyButtons(root){
    root.querySelectorAll('.copy-code').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const pre = btn.parentElement; const code = pre && pre.querySelector('code');
        if (!code) return;
        navigator.clipboard.writeText(code.innerText).then(() => toast('코드 복사됨')).catch(() => {});
      });
    });
  }

  // ─── Messages ───────────────────────────────────────────────────
  function addMsg(payload, persist = true){
    // ── 서버 포맷(role/content + requestMeta) → 신 포맷(kind/body/who/deptId) 호환 레이어 ──
    // 서버가 돌려준 requestMeta 안의 kind/who/deptId/html 를 최상위로 복원
    const rm = payload.requestMeta;
    if (rm && typeof rm === 'object') {
      if (!payload.kind && rm.kind) payload.kind = rm.kind;
      if (!payload.who && rm.who) payload.who = rm.who;
      if (!payload.deptId && rm.deptId) payload.deptId = rm.deptId;
      if (payload.html === undefined && rm.html !== undefined) payload.html = rm.html;
    }
    if (!payload.kind && payload.role) {
      const roleMap = { user:'user', assistant:'ai', system:'sys', error:'err' };
      payload.kind = roleMap[payload.role] || 'ai';
    }
    if (!payload.body && payload.content) {
      payload.body = payload.content;
    }
    const empty = dom.chatLog.querySelector('.chat-empty'); if (empty) empty.remove();
    const id = payload.id || ('m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    const kind = payload.kind || 'ai';
    const msg = document.createElement('div');
    msg.className = 'msg ' + kind;
    msg.dataset.mid = id;
    if (payload.deptId && DEPT_BY_ID[payload.deptId]) msg.style.setProperty('--dept-color', DEPT_BY_ID[payload.deptId].hex);

    const whoEl = document.createElement('div'); whoEl.className = 'who';
    if (kind === 'dept') whoEl.innerHTML = `<span class="dot"></span>${escapeHtml(payload.who || '')}`;
    else if (payload.who) whoEl.textContent = payload.who;

    const bodyEl = document.createElement('div'); bodyEl.className = 'body';

    const rendersMd = kind === 'ai' || kind === 'ceo' || kind === 'critic' || kind === 'dept';
    if (payload.html) {
      bodyEl.classList.add('md');
      bodyEl.innerHTML = payload.body || '';
    } else if (kind === 'user') {
      bodyEl.textContent = payload.body || '';
    } else if (rendersMd) {
      bodyEl.classList.add('md');
      bodyEl.innerHTML = renderMarkdown(payload.body || '');
      bindCopyButtons(bodyEl);
    } else {
      bodyEl.textContent = payload.body || '';
    }

    // attachments preview (user)
    if (kind === 'user' && Array.isArray(payload.attachments) && payload.attachments.length) {
      const ar = document.createElement('div');
      ar.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-top:6px';
      for (const a of payload.attachments) {
        const chip = document.createElement('div');
        chip.style.cssText = 'font-size:12.5px;background:rgba(0,0,0,.2);border:1px solid rgba(140,130,115,.28);border-radius:10px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px';
        if (a.thumb) chip.innerHTML = `<img src="${a.thumb}" style="width:14px;height:14px;border-radius:2px;object-fit:cover"/>${escapeHtml(a.name)}`;
        else chip.textContent = `📎 ${a.name}`;
        ar.appendChild(chip);
      }
      bodyEl.appendChild(ar);
    }

    if (kind !== 'user' || payload.who) msg.appendChild(whoEl);
    msg.appendChild(bodyEl);

    // actions
    if (kind !== 'sys' && kind !== 'err') {
      const actions = document.createElement('div'); actions.className = 'msg-actions';
      if (kind === 'user') {
        actions.appendChild(makeBtn('📋 복사', () => copyText(payload.body || '')));
        actions.appendChild(makeBtn('✎ 편집', () => beginEdit(msg, id, payload)));
        if (Array.isArray(payload.versions) && payload.versions.length > 1) {
          const nav = document.createElement('div'); nav.className = 'ver-nav';
          const cur = payload.versionIndex ?? payload.versions.length - 1;
          const prev = document.createElement('button'); prev.textContent = '◀'; prev.disabled = cur <= 0;
          const lbl = document.createElement('span'); lbl.textContent = `${cur + 1}/${payload.versions.length}`;
          const next = document.createElement('button'); next.textContent = '▶'; next.disabled = cur >= payload.versions.length - 1;
          prev.onclick = () => moveVersion(id, -1);
          next.onclick = () => moveVersion(id, +1);
          nav.appendChild(prev); nav.appendChild(lbl); nav.appendChild(next);
          actions.appendChild(nav);
        }
      } else {
        actions.appendChild(makeBtn('📋 복사', () => copyText(bodyEl.innerText)));
        if (kind === 'ai') actions.appendChild(makeBtn('↻ 재생성', () => regenerate(id)));
        const up = makeBtn('👍', () => toggleFeedback(id, 'up', up, down));
        const down = makeBtn('👎', () => toggleFeedback(id, 'down', up, down));
        up.classList.add('thumb-up'); down.classList.add('thumb-down');
        if (state.feedback[id] === 'up') up.classList.add('on');
        if (state.feedback[id] === 'down') down.classList.add('on');
        actions.appendChild(up); actions.appendChild(down);
        actions.appendChild(makeBtn('⬇ 내보내기', () => exportMsg(payload, bodyEl.innerText)));
      }
      msg.appendChild(actions);
    }

    dom.chatLog.appendChild(msg);
    autoScrollIfNeeded();

    if (persist && state.activeThreadId) {
      const stored = { id, kind, who:payload.who, body:payload.body, deptId:payload.deptId || null, html:!!payload.html, attachments:payload.attachments || [], versions:payload.versions, versionIndex:payload.versionIndex, ts:Date.now() };
      appendMessageToThread(state.activeThreadId, stored);
    }
    return msg;
  }
  function makeBtn(txt, onClick){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.onclick = onClick; return b;
  }
  function copyText(t){ navigator.clipboard.writeText(t || '').then(() => toast('복사됨')).catch(() => toast('복사 실패')); }
  function autoScrollIfNeeded(){
    if (state.userAtBottom) dom.chatLog.scrollTop = dom.chatLog.scrollHeight;
  }

  dom.chatLog.addEventListener('scroll', () => {
    const nearBottom = dom.chatLog.scrollHeight - dom.chatLog.scrollTop - dom.chatLog.clientHeight < 60;
    state.userAtBottom = nearBottom;
    dom.toBottom.classList.toggle('visible', !nearBottom);
  });
  dom.toBottom.addEventListener('click', () => { state.userAtBottom = true; dom.chatLog.scrollTop = dom.chatLog.scrollHeight; dom.toBottom.classList.remove('visible'); });

  function exportMsg(payload, text){
    const blob = new Blob([text || payload.body || ''], { type:'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `message-${Date.now()}.md`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('내보내기 완료');
  }
  function toggleFeedback(id, kind, upBtn, downBtn){
    if (state.feedback[id] === kind) delete state.feedback[id];
    else state.feedback[id] = kind;
    saveLS(LS.FEEDBACK, state.feedback);
    upBtn.classList.toggle('on', state.feedback[id] === 'up');
    downBtn.classList.toggle('on', state.feedback[id] === 'down');
    try {
      fetch(API_BASE + '/api/feedback', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ messageId:id, verdict:state.feedback[id] || null }),
      }).catch(() => {});
    } catch {}
    toast(state.feedback[id] === 'up' ? '👍 피드백 전송' : state.feedback[id] === 'down' ? '👎 피드백 전송' : '피드백 취소');
  }
  function regenerate(id){
    // find original user prompt preceding this AI msg
    const t = getActiveThread(); if (!t) return;
    const idx = t.messages.findIndex(m => m.id === id);
    if (idx <= 0) { toast('재생성할 사용자 메시지 없음'); return; }
    let userMsg = null;
    for (let i = idx - 1; i >= 0; i--) if (t.messages[i].kind === 'user') { userMsg = t.messages[i]; break; }
    if (!userMsg) { toast('재생성할 사용자 메시지 없음'); return; }
    // re-send same directive
    dom.directive.value = userMsg.body; autoSize();
    startRun();
  }
  function beginEdit(msgEl, id, payload){
    if (state.editingMsgId) return;
    state.editingMsgId = id;
    const body = msgEl.querySelector('.body');
    const originalHtml = body.innerHTML;
    const area = document.createElement('div'); area.className = 'edit-area';
    const ta = document.createElement('textarea'); ta.value = payload.body || '';
    const row = document.createElement('div'); row.className = 'row';
    const cancel = document.createElement('button'); cancel.textContent = '취소 (Esc)';
    const save = document.createElement('button'); save.textContent = '저장 (Enter)'; save.classList.add('primary');
    row.appendChild(cancel); row.appendChild(save);
    area.appendChild(ta); area.appendChild(row);
    body.innerHTML = ''; body.appendChild(area); ta.focus();
    const finish = (commit) => {
      state.editingMsgId = null;
      if (!commit) { body.innerHTML = originalHtml; return; }
      const next = ta.value;
      // update thread versions
      const t = getActiveThread(); if (!t) return;
      const m = t.messages.find(x => x.id === id); if (!m) return;
      m.versions = m.versions || [m.body];
      m.versions.push(next);
      m.versionIndex = m.versions.length - 1;
      m.body = next;
      saveThreads(); debouncedSaveMessages(t.id);
      body.textContent = next;
      toast('메시지 편집됨 (재전송 안 함, 재생성은 ↻ 버튼)');
    };
    cancel.onclick = () => finish(false);
    save.onclick = () => finish(true);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
  }
  function moveVersion(id, delta){
    const t = getActiveThread(); if (!t) return;
    const m = t.messages.find(x => x.id === id); if (!m || !Array.isArray(m.versions)) return;
    const ni = Math.max(0, Math.min(m.versions.length - 1, (m.versionIndex ?? m.versions.length - 1) + delta));
    if (ni === m.versionIndex) return;
    m.versionIndex = ni; m.body = m.versions[ni];
    saveThreads(); debouncedSaveMessages(t.id);
    reloadActiveThread();
  }

  // ─── Thread / project utilities ─────────────────────────────────
  function saveThreads(){ saveLS(LS.THREADS, state.threads); }
  function saveProjects(){ saveLS(LS.PROJECTS, state.projects); }
  function saveCollapsed(){ saveLS(LS.COLLAPSED, [...state.collapsedProjects]); }
  function projectThreads(pid){ if (!state.threads[pid]) state.threads[pid] = []; return state.threads[pid]; }
  function getProjectTitleOrGeneral(){
    if (state.activeProjectId === GENERAL) return '신규 프로젝트';
    return state.projects.find(x => x.id === state.activeProjectId)?.title || '신규 프로젝트';
  }
  function getActiveThread(){
    if (!state.activeThreadId) return null;
    for (const pid of Object.keys(state.threads)) {
      const t = state.threads[pid].find(x => x.id === state.activeThreadId);
      if (t) return t;
    }
    return null;
  }
  function ensureThread(){ if (!state.activeThreadId || !getActiveThread()) createNewThread(state.activeProjectId || GENERAL); }
  function createNewThread(projectId = GENERAL){
    const id = 'th_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const t = { id, projectId, title:'신규 대화', messages:[], meta:{ pinned:false }, updatedAt:Date.now() };
    projectThreads(projectId).unshift(t);
    state.activeThreadId = id; state.activeProjectId = projectId;
    localStorage.setItem(LS.ACTIVE_THREAD, id);
    // 서버 저장은 첫 메시지 전송 시에만 — 빈 스레드 고스트 방지
    saveThreads(); apiSyncState();
    return t;
  }
  function appendMessageToThread(threadId, msg){
    for (const pid of Object.keys(state.threads)) {
      const list = state.threads[pid];
      const t = list.find(x => x.id === threadId);
      if (t) { t.messages.push(msg); t.updatedAt = Date.now(); saveThreads(); renderSidebar(); debouncedSaveMessages(threadId); return; }
    }
  }
  const saveMessageTimers = {};
  function debouncedSaveMessages(threadId){
    if (saveMessageTimers[threadId]) clearTimeout(saveMessageTimers[threadId]);
    saveMessageTimers[threadId] = setTimeout(() => {
      for (const pid of Object.keys(state.threads)) {
        const t = state.threads[pid].find(x => x.id === threadId);
        if (t) apiSaveMessages(t.id, t.messages).catch(() => {});
      }
    }, 1200);
  }
  function loadThread(threadId){
    let t = null, pid = null;
    for (const k of Object.keys(state.threads)) {
      const m = state.threads[k].find(x => x.id === threadId);
      if (m) { t = m; pid = k; break; }
    }
    if (!t) return;
    state.activeThreadId = threadId; state.activeProjectId = pid;
    localStorage.setItem(LS.ACTIVE_THREAD, threadId);
    // Reset scene then replay the new thread's current run state (if any)
    state.scene?.resetAll();
    const run = ensureRun(threadId);
    applyRunToUI(run);
    // Replay working depts so characters are at meeting seats with glow
    if (state.scene) {
      for (const d of DEPTS) if (run.deptStates[d.id] === 'working') state.scene.goWork(d.id);
    }
    reloadActiveThread();
    apiSyncState();
  }
  function reloadActiveThread(){
    const t = getActiveThread(); if (!t) return;
    dom.chatLog.innerHTML = '';
    for (const m of t.messages) addMsg(m, false);
    if (!t.messages.length) dom.chatLog.innerHTML = `<div class="chat-empty"><h3>무엇을 도와드릴까요?</h3><p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p></div>`;
    dom.chatTitle.textContent = t.title;
    renderSidebar();
  }
  function newChat(){

    const pid = state.activeProjectId || GENERAL;

  // ─── 프로젝트 / 스레드 선택 ─────────────────────────────────────

    dom.chatLog.innerHTML = `

        <div class="project-home__desc">${threads.length ? '이 프로젝트의 대화를 이어가거나 새 스레드를 시작하세요.' : '이 프로젝트에 대화가 없습니다.<br>새 스레드를 시작하세요.'}</div>
        <button class="project-home__btn" type="button" data-act="new-thread">+ 새 스레드 시작하기</button>

  function escapeAttr(s){ return String(s ?? '').replace(/["&<>]/g, ch => ({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }

  function refreshHomeIfShown(){

    }

  // ─── SSE 텍스트 추출 (AI 응답 [object Object] / JSON 노출 방지) ─────────────
  // Provider 별 응답 구조와 done payload 의 nested .answer.text 까지 파고들어
  // 실제 본문 문자열만 찾아낸다. 모두 실패 시 "[응답 파싱 실패]" + 본문 미리보기.
  function extractText(data){
    if (typeof data === 'string') return data;
    if (data == null) return '';
    if (typeof data !== 'object') return String(data);

    // 1) 직속 string 키 (가장 빈번한 형태)
    const directKeys = ['text', 'content', 'answer', 'result', 'summary', 'output_text', 'message', 'delta', 'briefing', 'executiveSummary'];
    for (const k of directKeys) {
      const v = data[k];
      if (typeof v === 'string' && v.trim()) return v;
    }

    // 2) 한 단계 nested 추출 (예: makeDonePayload.answer.text, payload.answer.text)
    const nestedRoots = ['payload', 'answer', 'final_answer', 'result', 'response', 'data', 'briefing'];
    for (const root of nestedRoots) {
      const node = data[root];
      if (node && typeof node === 'object') {
        for (const k of ['text', 'content', 'answer', 'result', 'summary', 'output_text', 'message', 'briefing', 'executiveSummary']) {
          const v = node[k];
          if (typeof v === 'string' && v.trim()) return v;
        }
      }
    }

    // 2b) 두 단계 nested (payload.answer.text / payload.briefing.executiveSummary 등)
    if (data.payload && typeof data.payload === 'object') {
      for (const mid of ['answer', 'briefing', 'result', 'data']) {
        const node = data.payload[mid];
        if (node && typeof node === 'object') {
          for (const k of ['text', 'content', 'message', 'executiveSummary', 'summary']) {
            const v = node[k];
            if (typeof v === 'string' && v.trim()) return v;
          }
          if (Array.isArray(node.content) && node.content[0] && typeof node.content[0].text === 'string' && node.content[0].text.trim()) {
            return node.content[0].text;
          }
        }
      }
      // payload.content[0].text (Anthropic-style)
      if (Array.isArray(data.payload.content) && data.payload.content[0] && typeof data.payload.content[0].text === 'string') {
        const t = data.payload.content[0].text;
        if (t.trim()) return t;
      }
    }

    // 3) Anthropic content[]  ({ type: 'text', text: '...' })
    if (Array.isArray(data.content)) {
      const t = data.content.map(p => (p && typeof p.text === 'string') ? p.text : '').filter(Boolean).join('\n').trim();
      if (t) return t;
    }

    // 4) OpenAI choices[].message.content / delta.content
    if (Array.isArray(data.choices)) {
      for (const c of data.choices) {
        const m = c?.message?.content ?? c?.delta?.content;
        if (typeof m === 'string' && m.trim()) return m;
      }
    }

    // 5) Gemini candidates[].content.parts[].text
    if (Array.isArray(data.candidates)) {
      for (const cand of data.candidates) {
        const parts = cand?.content?.parts || [];
        for (const part of parts) {
          if (typeof part?.text === 'string' && part.text.trim()) return part.text;
        }
      }
    }

    // 6) delta 또는 chunk 형태
    if (data.delta && typeof data.delta === 'object') {
      const d = data.delta.text ?? data.delta.content;
      if (typeof d === 'string' && d.trim()) return d;
    }

    // 7) 마지막 수단: 디버깅용 콘솔 로그 + 사용자에게는 친절한 메시지
    try { console.warn('[extractText] 파싱 실패 payload:', data); } catch {}
    return '처리 중 오류가 발생했습니다. 다시 시도해 주세요.';
  }

  // ─── Sidebar render ─────────────────────────────────────────────
  function renderSidebar(){
    dom.generalThreads.innerHTML = '';
    const gen = projectThreads(GENERAL).slice().sort(compareThreads);
    if (!gen.length) {
      const e = document.createElement('div');
      e.className = 'thread-item'; e.style.color = 'var(--text-dim)'; e.style.fontStyle = 'italic';
      e.textContent = '대화 없음';
      dom.generalThreads.appendChild(e);
    } else for (const t of gen) dom.generalThreads.appendChild(threadItem(t, false));

    dom.projectList.innerHTML = '';
    // "__general__" 는 프로젝트 그룹으로 렌더링하지 않는다 (상단 "최근" 섹션 전용)
    const renderableProjects = (state.projects || []).filter(p => p && p.id && p.id !== GENERAL);
    for (const p of renderableProjects) {
      const ts = projectThreads(p.id);
      const row = document.createElement('div');
      const isCollapsed = state.collapsedProjects.has(p.id);

      row.innerHTML = `<span class="caret">▼</span><span class="name"></span><span class="count">${ts.length}</span><button class="row-menu" type="button">⋯</button>`;

      // 이름/카렛 클릭: selectProject(p.id) — 스레드 자동 생성 없이 홈 화면 진입
      row.addEventListener('click', (e) => {
        if (e.target && e.target.classList.contains('row-menu')) return;
        const caret = e.target && e.target.classList.contains('caret');

          // 카렛 전용: 접힘 토글만 (선택은 바꾸지 않음)
          if (isCollapsed) state.collapsedProjects.delete(p.id); else state.collapsedProjects.add(p.id);
          saveCollapsed(); renderSidebar();
          return;

      });

      dom.projectList.appendChild(row);

        nw.textContent = '+ 새 스레드';
        nw.onclick = (e) => { e.stopPropagation(); createThreadInProject(p.id); };
        dom.projectList.appendChild(nw);
        const sorted = ts.slice().sort(compareThreads);
        for (const t of sorted) dom.projectList.appendChild(threadItem(t, true));
      }
    }
  }
  function compareThreads(a, b){
    const pa = a.meta?.pinned ? 1 : 0, pb = b.meta?.pinned ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  }
  function threadItem(t, inProject){
    const item = document.createElement('div');
    item.className = 'thread-item' + (t.id === state.activeThreadId ? ' active' : '');
    const time = new Date(t.updatedAt || Date.now()).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    item.innerHTML = `<span class="t-main"><span class="t-title"></span><span class="t-meta"></span></span>${t.meta?.pinned ? '<span class="pin">📌</span>' : ''}<button class="row-menu" type="button">⋯</button>`;
    item.querySelector('.t-title').textContent = t.title || '신규 대화';
    item.querySelector('.t-meta').textContent = time;
    item.addEventListener('click', (e) => {
      if (e.target && e.target.classList.contains('row-menu')) return;
      loadThread(t.id);
    });
    item.querySelector('.row-menu').addEventListener('click', (e) => { e.stopPropagation(); openThreadMenu(e.currentTarget, t, inProject); });
    return item;

  // ─── Bubble menu ────────────────────────────────────────────────
  let currentMenu = null;
  function closeMenu(){ if (currentMenu) { currentMenu.remove(); currentMenu = null; } }
  document.addEventListener('click', (e) => {
    if (!currentMenu) return;
    if (currentMenu.contains(e.target)) return;
    closeMenu();
  });
  function openMenu(anchor, items){
    closeMenu();
    const m = document.createElement('div'); m.className = 'bubble-menu';
    for (const it of items) {
      if (it.divider) { const d = document.createElement('div'); d.className = 'divider'; m.appendChild(d); continue; }
      const mi = document.createElement('div'); mi.className = 'mi' + (it.danger ? ' danger' : '');
      mi.innerHTML = `<span>${escapeHtml(it.label)}</span>${it.submenu ? '<span class="chev">▸</span>' : ''}`;
      if (it.submenu) {
        mi.addEventListener('mouseenter', () => {
          // render submenu
          const existing = mi.querySelector('.bubble-menu.sub'); if (existing) return;
          const sub = document.createElement('div'); sub.className = 'bubble-menu sub';
          for (const s of it.submenu) {
            const si = document.createElement('div'); si.className = 'mi'; si.textContent = s.label;
            si.onclick = (e) => { e.stopPropagation(); s.onClick(); closeMenu(); };
            sub.appendChild(si);
          }
          mi.style.position = 'relative'; mi.appendChild(sub);
        });
        mi.addEventListener('mouseleave', () => { const sub = mi.querySelector('.bubble-menu.sub'); if (sub) sub.remove(); });
      } else if (it.onClick) {
        mi.onclick = (e) => { e.stopPropagation(); it.onClick(); closeMenu(); };
      }
      m.appendChild(mi);
    }
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    let left = r.right + 4, top = r.top;
    if (left + 220 > window.innerWidth) left = r.left - 220;
    if (top + m.offsetHeight > window.innerHeight) top = window.innerHeight - m.offsetHeight - 8;
    m.style.left = left + 'px'; m.style.top = top + 'px';
    currentMenu = m;
  }

  function openThreadMenu(anchor, t, inProject){
    const items = [];
    items.push({ label:'이름 바꾸기', onClick:() => renameThread(t.id) });
    if (!inProject) {
      const projList = state.projects.filter(p => p.id !== GENERAL).map(p => ({ label:projectDisplayName(p), onClick:() => moveThread(t.id, p.id) }));

  // ─── Attachments ────────────────────────────────────────────────
  const MAX_ATTACH = 10, MAX_BYTES = 20 * 1024 * 1024;
  function addAttachments(files){
    const list = [...files];
    for (const f of list) {
      if (state.attachments.length >= MAX_ATTACH) { toast('첨부 최대 10개'); break; }
      if (f.size > MAX_BYTES) { toast(`${f.name} 너무 큼 (20MB 초과)`); continue; }
      const reader = new FileReader();
      const id = 'att_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const chip = { id, name:f.name, size:f.size, type:f.type, dataUrl:null, text:null, thumb:null };
      state.attachments.push(chip);
      reader.onload = () => {
        chip.dataUrl = reader.result;
        if (/^image\//.test(f.type)) chip.thumb = reader.result;
        else if (/text\//.test(f.type) || /json|xml|csv|md|yml|yaml/i.test(f.name)) {
          try { chip.text = typeof reader.result === 'string' ? reader.result : ''; } catch {}
        }
        renderAttachRow();
      };
      if (/^image\//.test(f.type)) reader.readAsDataURL(f);
      else reader.readAsText(f);
      renderAttachRow();
    }
  }
  function renderAttachRow(){
    if (!state.attachments.length) { dom.attachRow.style.display = 'none'; dom.attachRow.innerHTML = ''; return; }
    dom.attachRow.style.display = 'flex';
    dom.attachRow.innerHTML = '';
    for (const a of state.attachments) {
      const chip = document.createElement('div'); chip.className = 'attach-chip';
      if (a.thumb) { const img = document.createElement('img'); img.className = 'thumb'; img.src = a.thumb; chip.appendChild(img); }
      const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = a.name; chip.appendChild(nm);
      const sz = document.createElement('span'); sz.className = 'size'; sz.textContent = fmtSize(a.size); chip.appendChild(sz);
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕'; rm.type = 'button';
      rm.onclick = () => { state.attachments = state.attachments.filter(x => x.id !== a.id); renderAttachRow(); };
      chip.appendChild(rm); dom.attachRow.appendChild(chip);
    }
  }
  function fmtSize(b){ if (b < 1024) return b + 'B'; if (b < 1024 * 1024) return (b / 1024).toFixed(0) + 'KB'; return (b / 1024 / 1024).toFixed(1) + 'MB'; }
  function clearAttachments(){ state.attachments = []; renderAttachRow(); }

  dom.attachBtn.addEventListener('click', () => dom.fileInput.click());
  dom.fileInput.addEventListener('change', (e) => { addAttachments(e.target.files); dom.fileInput.value = ''; });

  dom.chatInput.addEventListener('drop', (e) => {

    if (e.dataTransfer?.files?.length) addAttachments(e.dataTransfer.files);
  });
  dom.directive.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items || [];
    const files = [];
    for (const it of items) if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
    if (files.length) { e.preventDefault(); addAttachments(files); }
  });

  // ─── Slash commands ─────────────────────────────────────────────
  let slashActive = -1;
  function updateSlashMenu(){
    const v = dom.directive.value;
    const m = v.match(/^\/(\S*)$/);
    if (!m) { dom.slashMenu.style.display = 'none'; slashActive = -1; return; }
    const q = m[1].toLowerCase();
    const items = SLASH_COMMANDS.filter(c => c.cmd.slice(1).toLowerCase().startsWith(q));
    if (!items.length) { dom.slashMenu.style.display = 'none'; slashActive = -1; return; }
    dom.slashMenu.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div'); el.className = 'item' + (i === 0 ? ' active' : '');
      el.innerHTML = `<span class="cmd">${it.cmd}</span><span class="desc">${escapeHtml(it.desc)}</span>`;
      el.onclick = () => { applySlash(it.cmd); };
      dom.slashMenu.appendChild(el);
    });
    dom.slashMenu.style.display = 'block';
    slashActive = 0;
  }
  function applySlash(cmd){
    dom.directive.value = cmd + ' ';
    dom.slashMenu.style.display = 'none';
    slashActive = -1;
    dom.directive.focus();
    autoSize();
  }
  function moveSlash(delta){
    const items = [...dom.slashMenu.querySelectorAll('.item')];
    if (!items.length) return;
    slashActive = (slashActive + delta + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('active', i === slashActive));
  }
  function selectSlash(){
    const items = [...dom.slashMenu.querySelectorAll('.item')];
    if (slashActive >= 0 && items[slashActive]) items[slashActive].click();
  }

  // ─── Auto-size textarea (max 160px ≒ 6줄) ──────────────────────
  function autoSize(){
    const ta = dom.directive;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
    document.documentElement.style.setProperty('--input-h', (dom.chatInput.offsetHeight) + 'px');
  }

  // ─── Input binding ──────────────────────────────────────────────
  dom.directive.addEventListener('input', () => { autoSize(); updateSlashMenu(); });
  dom.directive.addEventListener('keydown', (e) => {
    if (dom.slashMenu.style.display === 'block') {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSlash(1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); moveSlash(-1); return; }
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); selectSlash(); return; }
      if (e.key === 'Escape')    { e.preventDefault(); dom.slashMenu.style.display = 'none'; slashActive = -1; return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); startRun(); }
  });

  dom.chatTitle.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); dom.chatTitle.blur(); } if (e.key === 'Escape') dom.chatTitle.blur(); });

  // ─── Dept / briefing / critic reports ───────────────────────────
  function renderDeptReport(deptId, report){

  // ─── SSE ─────────────────────────────────────────────────────────
  // ─── Per-thread run state ───────────────────────────────────────
  // Each thread has its own EventSource + dept status, runs independently.
  // The Phaser scene + chat log reflect the currently active thread only.
  function ensureRun(threadId){
    if (!state.threadRuns) state.threadRuns = {};
    if (!state.threadRuns[threadId]) {
      state.threadRuns[threadId] = {
        es:null, running:false,
        deptStates:Object.fromEntries(DEPTS.map(d => [d.id, 'idle'])),
        missionDeptCount:9, deptCompletedCount:0, executiveActive:false,
        lastBriefing:null, lastCritic:null,
      };
    }
    return state.threadRuns[threadId];
  }
  function isActive(threadId){ return state.activeThreadId === threadId; }
  function applyRunToUI(run){
    // Reflect current run state on shared office + panel + button
    Object.assign(state.deptStates, run.deptStates);
    state.missionDeptCount = run.missionDeptCount;
    state.deptCompletedCount = run.deptCompletedCount;
    state.executiveActive = run.executiveActive;
    state.lastBriefing = run.lastBriefing;
    state.lastCritic = run.lastCritic;
    state.running = run.running;
    dom.officeStatusDot.className = 'dot' + (run.running ? ' live' : '');
    dom.officeStatusText.textContent = run.running ? '실행 중...' : '대기 중';
    // Phaser scene — replay current dept glows/positions
    const scene = state.scene;
    if (scene) {
      for (const d of DEPTS) {
        const s = run.deptStates[d.id] || 'idle';
        scene.setDeskGlow(d.id, s === 'working', d.hex);
      }
      scene.lightExecutive(run.executiveActive);
    }
    // Send button toggles to stop if running
    if (run.running) {
      dom.sendBtn.classList.add('stop'); dom.sendBtn.title = '중단';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="10" height="10"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>';
      // 입력창 잠금 — 처리 중 중복 전송/입력 방지 (중단 버튼은 유효)
      dom.directive.disabled = true;
      dom.directive.placeholder = '처리 중입니다...';
      dom.directive.classList.add('is-locked');
    } else {
      dom.sendBtn.classList.remove('stop'); dom.sendBtn.title = '전송';
      dom.sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
      dom.directive.disabled = false;
      dom.directive.placeholder = '';
      dom.directive.classList.remove('is-locked');
    }
    renderPanel();
  }

  function onRunEvent(threadId, ev){
    let p; try { p = JSON.parse(ev.data); } catch { return; }
    const type = p.type || ev.type;
    const run = ensureRun(threadId);
    const active = isActive(threadId);
    const scene = state.scene;
    switch (type) {
      case 'executive_gate_start': {
        run.executiveStatus = 'reviewing';
        run.directive = p.directive || '';
        if (active) scene?.lightExecutive(true);
        // HUD 미션 텍스트 즉시 반영
        if (active && p.directive) {
          window.dispatchEvent(new CustomEvent('office-event', { detail:{
            type:'mission_start',
            topic: String(p.directive).slice(0, 60),
            deptCount: 10,
          }}));
          dom.officeStatusText.textContent = '분석 중...';
        }
        // "판단중..." 임시 메시지 — gate_redirect 시 제거하기 위해 ID 캡처
        const gateMsgId = 'gate_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        run.gateMsgId = gateMsgId;
        addMsgForThread(threadId, { id: gateMsgId, who:'상무', body:'지시를 분석하고 업무를 배분합니다...', kind:'sys' });
        break;
      }
      case 'executive_gate_done': {
        const action = p.action || 'single_agent';
        const depts = Array.isArray(p.departments) ? p.departments : [];
        run.executiveStatus = 'done';
        run.gateResult = { action, complexity: p.complexity, departments: depts, reason: p.reason };
        if (action === 'director' && depts.length) {
          // director 경로: 판단중 메시지 유지 가능하지만 라인 하나 더 추가
          const names = depts.map(d => (DEPT_BY_ID[d.id]?.kr || d.id) + '팀').join(', ');
          addMsgForThread(threadId, { who:'상무', body:`배분 완료: ${names}`, kind:'sys' });
          // Phaser: 선택된 부서만 "일어나기" 반응
          if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'executive_gate_done', departments:depts } }));
        }
        // single_agent 인 경우 별도 버블 추가 금지 (redirect 에서 "판단중" 제거 + 단일 에이전트 스트리밍)
        if (active && action === 'director') setTimeout(() => scene?.lightExecutive(false), 2500);
        break;
      }
      case 'executive_gate_redirect': {
        run.executiveStatus = 'done';
        if (active) scene?.lightExecutive(false);
        // "판단중..." 임시 메시지 제거
        if (run.gateMsgId) {
          removeMessageFromThread(threadId, run.gateMsgId);
          run.gateMsgId = null;
        }
        // 단일 에이전트 SSE 스트림에 연결 — 새 버블에 스트리밍 누적
        const directive = run.directive || '';
        if (directive) {
          startSingleAgentStreamInto(threadId, directive);
        }
        break;
      }
      case 'mission_start':
        run.missionDeptCount = Number(p.deptCount || 9);
        run.deptCompletedCount = 0; run.executiveActive = false;
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{
          type:'mission_start',
          topic: p.topic || p.directive || '',
          deptCount: Number(p.deptCount || 9),
        }}));
        break;
      case 'dept_start':
        run.deptStates[p.deptId] = 'working';
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'dept_start', deptId:p.deptId, objective:p.objective } }));
        break;
      case 'dept_progress':
        if (active) scene?.progressMsg(p.deptId, p.message);
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{
          type:'dept_progress', deptId:p.deptId, percent:p.percent, message:p.message,
        }}));
        break;
      case 'dept_done':
        run.deptStates[p.deptId] = 'done';
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'dept_done', deptId:p.deptId } }));
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        checkRunAllDone(threadId);
        break;
      case 'dept_error':
        run.deptStates[p.deptId] = 'err';
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'dept_error', deptId:p.deptId } }));
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`오류: ${p.error || '알 수 없는 오류'}`, kind:'err' });
        checkRunAllDone(threadId);
        break;
      case 'critic_start':
        run.executiveStatus = 'reviewing';
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'critic_start' } }));
        break;
      case 'critic_done':
        run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        run.lastCritic = p.review;
        if (active) { scene?.lightExecutive(true); setTimeout(() => scene?.lightExecutive(false), 5000); }
        addThreadMsgByCritic(threadId, p.review);
        break;
      case 'critic_review':
        run.lastCritic = p.review;
        if (!run.executiveStatus || run.executiveStatus === 'idle') {
          run.executiveStatus = p.review?.verdict === 'needs_rework' ? 'rework' : 'done';
        }
        if (active) { scene?.lightExecutive(true); setTimeout(() => scene?.lightExecutive(false), 5000); }
        if (!run._criticMsgShown) { run._criticMsgShown = true; addThreadMsgByCritic(threadId, p.review); }
        if ((p.review?.verdict === 'needs_followup' || p.review?.verdict === 'needs_rework') && (p.review?.targetDeptId || p.deptId)) {
          const tgt = p.review.targetDeptId || p.deptId;
          if (active) setTimeout(() => scene?.recallToMeeting(tgt, '상무 보완 지시'), 800);
        }
        break;
      case 'critic_rework':
        run.reworkDepts = Array.isArray(p.rework) ? p.rework.slice() : [];
        run.reworkReasons = p.rework_reason || {};
        for (const d of run.reworkDepts) run.deptStates[d] = 'rework';
        addMsgForThread(threadId, { who:'상무', body:`${run.reworkDepts.length}개 부서에 보강 지시`, kind:'sys' });
        break;
      case 'dept_rework_start':
        run.deptStates[p.deptId] = 'rework';
        if (active) { scene?.goWork(p.deptId, '[보강] ' + (p.reason || '')); }
        addMsgForThread(threadId, { who:(DEPT_BY_ID[p.deptId]?.kr || p.deptId) + '팀', body:`보강중: ${p.reason || ''}`, kind:'sys' });
        break;
      case 'dept_rework_done':
        run.deptStates[p.deptId] = 'rework_done';
        if (active) scene?.goDone(p.deptId);
        if (p.report) addThreadMsgByDeptReport(threadId, p.deptId, p.report);
        break;
      case 'ensemble_start':
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'ensemble_start', deptId:p.deptId, reason:p.reason } }));
        break;
      case 'ensemble_voice':
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'ensemble_voice', deptId:p.deptId, model:p.model, message:p.message, confidence:p.confidence } }));
        break;
      case 'ensemble_done':
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'ensemble_done', deptId:p.deptId, verdict:p.verdict } }));
        // 통합 synthesis 가 있으면 부서 메시지로 추가 (마크다운 그대로 렌더)
        if (p.synthesis && typeof p.synthesis === 'string' && p.synthesis.trim()) {
          const d = DEPT_BY_ID[p.deptId];
          const nm = d ? `${d.kr}팀 · 3-AI 앙상블` : `${p.deptId} · 3-AI 앙상블`;
          const verdictBadge = p.verdict === 'consensus' ? '✓ 합의'
                            : p.verdict === 'split' ? '△ 분기'
                            : p.verdict === 'contradictory' ? '⚠ 충돌'
                            : '? 불확실';
          const simStr = typeof p.similarity === 'number' ? ` (유사도 ${p.similarity.toFixed(2)})` : '';
          const headerLine = `**${verdictBadge}${simStr}**\n\n`;
          addMsgForThread(threadId, { who:nm, body: headerLine + p.synthesis, kind:'dept', deptId:p.deptId });
        }
        break;
      case 'ceo_briefing':
        run.lastBriefing = p.briefing;
        if (active) {
          window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'ceo_briefing' } }));
          scene?.lightCeo(true); setTimeout(() => scene?.lightCeo(false), 6000);
        }
        addThreadMsgByBriefing(threadId, p.briefing);
        break;
      case 'all_done':
        if (active) window.dispatchEvent(new CustomEvent('office-event', { detail:{ type:'all_done' } }));
        finishRun(threadId);
        break;
      case 'stream_end': if (run.running) finishRun(threadId, false); break;
      case 'error':
        addMsgForThread(threadId, { who:'오류', body:p.message, kind:'err' });
        finishRun(threadId, true);
        break;
    }
    if (active) applyRunToUI(run);
    else if (type === 'dept_done' || type === 'dept_error' || type === 'all_done') renderSidebar();
  }
  function checkRunAllDone(threadId){
    const run = ensureRun(threadId);
    run.deptCompletedCount++;
    if (!run.executiveActive && run.deptCompletedCount >= run.missionDeptCount) {
      run.executiveActive = true;

  // Wrappers to addMsg into a specific thread even when not active
  function addMsgForThread(threadId, payload){
    if (isActive(threadId)) { addMsg(payload); return; }
    // persist-only path: append to that thread's messages
    const id = payload.id || ('m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    const stored = { id, kind:payload.kind || 'ai', who:payload.who, body:payload.body, deptId:payload.deptId || null, html:!!payload.html, attachments:payload.attachments || [], ts:Date.now() };
    appendMessageToThread(threadId, stored);
  }

  // Remove a message from UI (if active) and from thread storage.
  function removeMessageFromThread(threadId, messageId){
    if (!messageId) return;
    if (isActive(threadId)) {
      const el = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(messageId)}"]`);
      if (el) el.remove();
    }
    for (const pid of Object.keys(state.threads)) {
      const t = state.threads[pid].find(x => x.id === threadId);
      if (t) {
        const before = t.messages.length;
        t.messages = t.messages.filter(m => m.id !== messageId);
        if (t.messages.length !== before) { saveThreads(); debouncedSaveMessages(threadId); }
        return;
      }
    }
  }

  // 단일 에이전트 SSE 스트림 연결 — 동일 버블에 누적.
  // /api/chat/stream 은 POST-only SSE → fetch ReadableStream 으로 파싱.
  async function startSingleAgentStreamInto(threadId, directive){
    if (!directive) return;
    const bubbleId = 'single_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    addMsgForThread(threadId, { id: bubbleId, who:'AI', body:'', kind:'ai' });
    // body 엘리먼트 찾기 — addMsg 가 방금 DOM 에 넣었음
    let bodyEl = null;
    if (isActive(threadId)) {
      const node = dom.chatLog.querySelector(`.msg[data-mid="${CSS.escape(bubbleId)}"] .body`);
      if (node) bodyEl = node;
    }
    let accumulated = '';
    const appendChunk = (text) => {
      accumulated += text;
      if (bodyEl) { bodyEl.textContent = accumulated; autoScrollIfNeeded(); }
      // 저장소 동기화
      for (const pid of Object.keys(state.threads)) {
        const t = state.threads[pid].find(x => x.id === threadId);
        if (t) {
          const m = t.messages.find(x => x.id === bubbleId);
          if (m) m.body = accumulated;
          t.updatedAt = Date.now();
        }
      }
    };

    try {
      const res = await fetch(API_BASE + '/api/chat/stream', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        // thread_id 포함 — 서버 sseRegistry 가 같은 스레드 신규 연결 시 기존 종료
        body: JSON.stringify({
          message: directive,
          thread_id: threadId,
          project_id: state.activeProjectId || null,
          force_single_agent: true,
          stream: true,
        }),
      });
      if (!res.ok || !res.body) {
        appendChunk(`\n[단일 에이전트 호출 실패: HTTP ${res.status}]`);
        debouncedSaveMessages(threadId);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        // 간단한 SSE 파서 — "data: {...}\n\n" 라인 단위
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = frame.split('\n');
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (!payload) continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'chunk' || ev.type === 'token' || ev.type === 'provider_chunk') {
                appendChunk(extractText(ev.content ?? ev.delta ?? ev.text ?? ev));
              } else if (ev.type === 'done') {
                const finalText = extractText(ev.payload) || extractText(ev);
                if (finalText && !accumulated) appendChunk(finalText);
              }
            } catch {/* ignore non-JSON frames */}
          }
        }
      }
      debouncedSaveMessages(threadId);
    } catch (err) {
      appendChunk(`\n[오류: ${err && err.message || String(err)}]`);
      debouncedSaveMessages(threadId);
    }
  }
  function addThreadMsgByDeptReport(threadId, deptId, report){
    const d = DEPT_BY_ID[deptId]; const name = d ? `${d.kr}팀` : deptId;
    const st = report?.structured;
    let html = '';
    if (st?.summary) html += `<p>${escapeHtml(st.summary)}</p>`;
    if (st?.keyFindings?.length) html += '<div class="sec">핵심</div><ul>' + st.keyFindings.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.risks?.length) html += '<div class="sec">리스크</div><ul>' + st.risks.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.assumptions?.length) html += '<div class="sec">가정</div><ul>' + st.assumptions.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (st?.needsFollowup?.length) html += '<div class="sec">추가 확인</div><ul>' + st.needsFollowup.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
    if (!html && report?.sections) {
      html = report.sections.map(s => `<div class="sec">${escapeHtml(s.heading)}</div><ul>` + (s.items || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>').join('');
    }
    if (!html) html = '(보고 내용 없음)';
    addMsgForThread(threadId, { who:name, body:html, kind:'dept', deptId, html:true });
  }
  function addThreadMsgByBriefing(threadId, b){
    let html = '';
    if (b?.summary) html += `<p>${escapeHtml(b.summary)}</p>`;
    if (b?.opportunities?.length) html += '<div class="sec">기회</div><ul>' + b.opportunities.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';

    if (b?.conflictingSignals?.length) html += '<div class="sec">상충 신호</div><ul>' + b.conflictingSignals.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';

  function addThreadMsgByCritic(threadId, r){
    const verdict = r?.verdict === 'pass' ? '✓ PASS' : '⚠ 보강 필요';
    let html = `<b>${verdict}</b><br>${escapeHtml(r?.summary || '')}`;
