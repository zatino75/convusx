<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>CORVUS X — Pixel Office</title>
<style>
  :root{
    --bg:#0a0e1a; --bg-2:#0f1420; --panel:#131a2a;
    --wall:#1a2540; --wall-lt:#2a3a5c;
    --floor-a:#1e2838; --floor-b:#242f42;
    --wood:#6b4a2b; --wood-lt:#8a623b;
    --ink:#e0e8f0; --dim:#7a8aa0; --mute:#4a5870;
    --cyan:#00d4ff; --gold:#ffc94a; --red:#ff5e5e; --green:#4ade80;
    --magenta:#ff3ea5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Courier New','D2Coding',monospace;overflow:hidden}

  .app{
    display:grid;
    grid-template-columns:160px 1fr 320px;
    grid-template-rows:44px 1fr;
    height:100vh;
  }

  /* ─── TOP BAR ─────────────────────────────────────────────────────────── */
  .topbar{
    grid-column:1 / -1;
    display:flex;align-items:center;gap:18px;
    padding:0 14px;
    background:#06090f;border-bottom:1px solid #1a2540;
    font-size:13px;
  }
  .logo{font-weight:bold;color:var(--cyan);letter-spacing:3px;font-size:14px}
  .proj{color:var(--dim)} .proj b{color:var(--ink);font-weight:normal}
  .status-dot{
    width:7px;height:7px;border-radius:50%;background:var(--mute);
    display:inline-block;margin-right:6px;transition:background .2s;
  }
  .status-dot.live{background:var(--green);animation:pulseDot 1.4s ease-in-out infinite}
  .status-dot.err{background:var(--red)}
  @keyframes pulseDot{0%,100%{opacity:.55}50%{opacity:1}}
  .statusText{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .settings-btn{
    background:none;border:1px solid #2a3a5c;color:var(--dim);
    padding:4px 10px;font-family:inherit;font-size:11px;letter-spacing:1.5px;
    cursor:pointer;border-radius:2px;
  }
  .settings-btn:hover{border-color:var(--cyan);color:var(--cyan)}

  /* ─── SIDEBAR ─────────────────────────────────────────────────────────── */
  .sidebar{
    background:#060a12;border-right:1px solid #1a2540;
    display:flex;flex-direction:column;
    font-size:11px;letter-spacing:1px;
    overflow-y:auto;
  }
  .side-btn{
    display:block;width:100%;text-align:left;
    background:none;border:0;border-left:3px solid transparent;
    color:var(--dim);padding:10px 14px;
    font-family:inherit;font-size:11px;letter-spacing:1.2px;
    cursor:pointer;transition:all .15s;
  }
  .side-btn:hover{color:var(--ink);background:rgba(0,212,255,.05)}
  .side-btn.primary{color:var(--cyan);font-weight:bold}
  .side-btn.primary:hover{background:rgba(0,212,255,.08)}
  .side-btn.active{border-left-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.06)}
  .side-divider{
    color:var(--mute);font-size:10px;letter-spacing:2px;
    padding:14px 14px 4px;border-top:1px solid #161e2e;margin-top:8px;
  }
  .proj-list{padding:0 0 4px;max-height:160px;overflow-y:auto}
  .proj-item{
    padding:6px 14px;color:var(--dim);font-size:11px;
    cursor:pointer;border-left:3px solid transparent;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .proj-item:hover{color:var(--ink);background:rgba(0,212,255,.04)}
  .proj-item.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(0,212,255,.06)}
  .proj-empty{padding:6px 14px;color:var(--mute);font-size:10px;font-style:italic}

  /* ─── OFFICE (MAIN) ───────────────────────────────────────────────────── */
  .office{
    position:relative;min-height:0;
    background:
      linear-gradient(45deg,var(--floor-a) 25%,transparent 25%),
      linear-gradient(-45deg,var(--floor-a) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,var(--floor-a) 75%),
      linear-gradient(-45deg,transparent 75%,var(--floor-a) 75%),
      var(--floor-b);
    background-size:28px 28px;
    background-position:0 0,0 14px,14px -14px,-14px 0;
    overflow:hidden;border-right:1px solid #1a2540;
  }

  /* 9 desks in 3x3 grid — filling the office area */
  .desks{
    position:absolute;inset:40px 40px 40px 40px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:38px 60px;
  }
  .desk{
    position:relative;
    background:linear-gradient(180deg,var(--wood-lt),var(--wood));
    border-radius:5px;
    box-shadow:inset 0 -8px 0 rgba(0,0,0,.35), 0 3px 0 rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:10px 8px;
    font-size:11px;color:#2b1a0d;font-weight:bold;letter-spacing:1.5px;
    transition:all .25s;
    min-height:80px;
  }
  .desk .dept-name{margin-top:auto}

  /* Department glow ring */
  .desk .ring{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    width:64px;height:64px;border-radius:50%;pointer-events:none;
    transition:all .25s;
  }
  .desk[data-state="working"] .ring,
  .desk[data-state="thinking"] .ring{
    background:radial-gradient(circle,rgba(0,212,255,.5) 30%,rgba(0,212,255,0) 70%);
    animation:ringPulse 1.2s ease-in-out infinite;
  }
  .desk[data-state="done"] .ring{
    background:radial-gradient(circle,rgba(255,201,74,.6) 30%,rgba(255,201,74,0) 70%);
    animation:sparkle 1.5s ease-in-out 2;
  }
  .desk[data-state="error"] .ring{
    background:radial-gradient(circle,rgba(255,94,94,.55) 30%,rgba(255,94,94,0) 70%);
  }
  @keyframes ringPulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(.95)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
  @keyframes sparkle{0%,100%{opacity:.3;transform:translateX(-50%) scale(.9)}50%{opacity:1;transform:translateX(-50%) scale(1.2)}}

  /* Check badge on complete */
  .desk .badge{
    position:absolute;top:-8px;right:-8px;
    width:22px;height:22px;border-radius:50%;
    background:var(--bg);border:2px solid var(--panel);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:bold;opacity:0;transition:opacity .3s;
  }
  .desk[data-state="done"] .badge{opacity:1;background:var(--gold);color:#111;border-color:var(--gold)}
  .desk[data-state="done"] .badge::before{content:"✓"}
  .desk[data-state="error"] .badge{opacity:1;background:var(--red);color:#fff;border-color:var(--red)}
  .desk[data-state="error"] .badge::before{content:"!"}

  /* Dim idle depts when any dept is active */
  .office[data-any-active="1"] .desk[data-state="idle"]{opacity:.45;filter:grayscale(.6)}
  .office[data-any-active="1"] .desk[data-state="idle"] .char{opacity:.6}

  /* Character pixel art */
  .char{
    position:absolute;width:34px;height:34px;pointer-events:none;
    transition:left .8s ease,top .8s ease,opacity .3s;
    z-index:5;
  }
  .char svg{image-rendering:pixelated;width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
  .char.working svg{animation:bop .5s ease-in-out infinite}
  @keyframes bop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .char .nametag{
    position:absolute;top:34px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--ink);background:rgba(10,14,26,.9);
    padding:1px 5px;border-radius:2px;white-space:nowrap;
    border:1px solid #2a3a5c;letter-spacing:.5px;
  }
  .bubble{
    position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    background:#fff;color:#111;font-size:10px;font-weight:normal;
    padding:3px 7px;border-radius:3px;white-space:nowrap;
    max-width:180px;overflow:hidden;text-overflow:ellipsis;
    animation:bob 1.8s ease-in-out infinite;
    z-index:10;
  }
  .bubble::after{
    content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
    border:4px solid transparent;border-top-color:#fff;
  }
  .bubble.done{background:#ffe3a0} .bubble.done::after{border-top-color:#ffe3a0}
  .bubble.crit{background:#ffd0d0} .bubble.crit::after{border-top-color:#ffd0d0}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}

  /* Empty-state hint on office */
  .office-hint{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:var(--mute);font-size:11px;letter-spacing:3px;text-align:center;
    pointer-events:none;opacity:.5;
    display:none;
  }
  .office.empty .office-hint{display:block}

  /* ─── CHAT PANEL ──────────────────────────────────────────────────────── */
  .chat{
    display:flex;flex-direction:column;
    background:var(--bg-2);border-left:1px solid #1a2540;
    min-height:0;
  }
  .chat-header{
    padding:12px 14px;border-bottom:1px solid #1a2540;
    font-size:11px;letter-spacing:2px;color:var(--cyan);
  }
  .chat-log{
    flex:1;overflow-y:auto;padding:14px;min-height:0;
  }
  .msg{
    margin-bottom:10px;font-size:13px;line-height:1.55;word-wrap:break-word;
  }
  .msg .who{
    display:inline-block;padding:1px 7px;margin-right:6px;
    border-radius:2px;background:#1f2a42;color:var(--cyan);
    font-size:10px;letter-spacing:1px;vertical-align:middle;
  }
  .msg.user{color:var(--ink)} .msg.user .who{background:var(--cyan);color:#000}
  .msg.sys{color:var(--dim);font-size:12px}
  .msg.err{color:var(--red);font-size:12px}
  .msg.err .who{background:var(--red);color:#fff}
  .msg.ok{color:var(--green);font-size:12px}
  .msg.ok .who{background:var(--green);color:#000}
  .msg.dept .who{background:var(--magenta);color:#fff}
  .chat-empty{color:var(--mute);text-align:center;padding:40px 20px;font-size:12px;line-height:1.8}

  .chat-input{
    padding:10px 12px;border-top:1px solid #1a2540;background:#0b1020;
    display:flex;gap:8px;
  }
  .chat-input textarea{
    flex:1;background:#050810;border:1px solid #2a3a5c;color:var(--ink);
    padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.4;
    border-radius:2px;resize:none;height:60px;
  }
  .chat-input textarea:focus{outline:none;border-color:var(--cyan)}
  .chat-input .btn-col{display:flex;flex-direction:column;gap:4px}
  .chat-input button{
    background:var(--cyan);border:none;color:#000;padding:0 12px;
    font-weight:bold;letter-spacing:1px;font-family:inherit;cursor:pointer;
    border-radius:2px;font-size:11px;min-height:28px;
  }
  .chat-input button:disabled{opacity:.4;cursor:not-allowed}
  .chat-input button.stop{background:var(--red);color:#fff;display:none}
  .chat-input button.ghost{background:transparent;border:1px solid #2a3a5c;color:var(--dim);font-size:10px}

  /* ─── SETTINGS MODAL ──────────────────────────────────────────────────── */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-backdrop.open{display:flex}
  .modal{
    background:var(--bg-2);border:1px solid #2a3a5c;border-radius:4px;
    padding:24px;width:420px;max-width:90vw;
    font-size:13px;
  }
  .modal h2{
    margin:0 0 16px;color:var(--cyan);font-size:15px;letter-spacing:2px;
    padding-bottom:10px;border-bottom:1px solid #2a3a5c;
  }
  .modal .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
  .modal .row label{color:var(--dim);font-size:12px}
  .modal .row .val{color:var(--ink);font-family:monospace}
  .modal .check{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
  .modal .check input{margin:0}
  .modal .close{margin-top:16px;width:100%;background:var(--cyan);border:0;color:#000;padding:8px;cursor:pointer;font-weight:bold;letter-spacing:1px;font-family:inherit}

  /* Hide stats by default */
  .show-stats .stat-line{display:flex !important}
  .stat-line{display:none !important}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4a6c}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <span class="logo">CORVUS X</span>
    <span class="proj">프로젝트: <b id="projName">새 채팅</b></span>
    <span><span class="status-dot" id="statusDot"></span><span class="statusText" id="statusText">IDLE</span></span>
    <span class="spacer"></span>
    <span class="stat-line" style="color:var(--dim);font-size:11px;gap:14px">
      <span>경과 <b id="elapsed" style="color:var(--ink)">0초</b></span>
      <span>도구 <b id="toolCount" style="color:var(--ink)">0</b></span>
    </span>
    <button class="settings-btn" onclick="CX.openSettings()">⚙ 설정</button>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <button class="side-btn primary active" id="btnNewChat" onclick="CX.newChat()">＋ 새 채팅</button>

    <div class="side-divider">프로젝트</div>
    <div id="projList" class="proj-list">
      <div class="proj-empty">아직 없음</div>
    </div>
    <button class="side-btn" onclick="CX.newProject()">＋ 새 프로젝트</button>

    <div class="side-divider">운영</div>
    <button class="side-btn" data-preset="sales">매출 대시보드</button>
    <button class="side-btn" data-preset="store">매장 운영</button>
    <button class="side-btn" data-preset="pos">POS 관리</button>
    <button class="side-btn" data-preset="risk">리스크 대응</button>
  </aside>

  <!-- PIXEL OFFICE -->
  <div class="office empty" id="office">
    <div class="office-hint">오른쪽 채팅창에 지시를 입력하세요</div>
    <div class="desks" id="desks"></div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat">
    <div class="chat-header">◢ 지시 & 결과</div>
    <div class="chat-log" id="chatLog">
      <div class="chat-empty">
        자연어로 지시를 입력하세요.<br>
        AI가 필요한 부서를 자동 선택합니다.<br><br>
        <span style="color:var(--mute)">Enter 전송 · Shift+Enter 줄바꿈</span>
      </div>
    </div>
    <div class="chat-input">
      <textarea id="directive" placeholder="예: 케토 김밥 신제품 런칭 전략을 분석해줘"></textarea>
      <div class="btn-col">
        <button id="sendBtn" onclick="CX.send()">전송</button>
        <button id="stopBtn" class="stop" onclick="CX.stop()">중단</button>
        <button class="ghost" onclick="CX.demo()">데모</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>설정</h2>
    <label class="check">
      <input type="checkbox" id="showStats" />
      <span>통계 표시 (경과 시간, 도구 호출 수)</span>
    </label>
    <label class="check">
      <input type="checkbox" id="showXp" />
      <span>XP · 레벨 · 비용 표시</span>
    </label>
    <div class="row"><label>API Base</label><span class="val" id="apiBase">-</span></div>
    <div class="row"><label>세션</label><span class="val" id="sessVal">-</span></div>
    <button class="close" onclick="CX.closeSettings()">닫기</button>
  </div>
</div>

<script>
(() => {
  // ─── 설정 ───────────────────────────────────────────────────────────
  const API_BASE = location.origin.includes('localhost') ? 'http://localhost:8000' : '';
  const DEPTS = [
    {id:'market',    label:'MARKET',    emoji:'📊', color:'#00d4ff'},
    {id:'compete',   label:'COMPETE',   emoji:'🔍', color:'#f97316'},
    {id:'legal',     label:'LEGAL',     emoji:'⚖️', color:'#a855f7'},
    {id:'finance',   label:'FINANCE',   emoji:'💰', color:'#ffc94a'},
    {id:'marketing', label:'MARKETING', emoji:'📢', color:'#ff3ea5'},
    {id:'rnd',       label:'R&D',       emoji:'🧪', color:'#4ade80'},
    {id:'data',      label:'DATA',      emoji:'📈', color:'#3b82f6'},
    {id:'content',   label:'CONTENT',   emoji:'✍️', color:'#ef4444'},
    {id:'sns',       label:'SNS',       emoji:'📱', color:'#ec4899'},
  ];

  const PRESETS = {
    sales: '오늘과 이번 주 매출을 분석하고 상세 대시보드 요약을 제공해줘.',
    store: '현재 각 매장의 운영 상황을 점검하고 특이사항을 알려줘.',
    pos:   'POS 시스템 상태를 점검하고 최근 24시간 거래 이상 징후를 확인해줘.',
    risk:  '최근 리스크 요소(법규/재고/경쟁/평판)를 분석하고 대응 우선순위를 제시해줘.',
  };

  // ─── 상태 ───────────────────────────────────────────────────────────
  const state = {
    eventSource: null, startTime: 0, elapsedTimer: null,
    toolCallCount: 0, deptStates: {},
    running: false, activeDepts: new Set(),
    projects: loadProjects(),
    currentProject: null,
  };

  // ─── DOM refs ───────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const dom = {
    projName: $('projName'), statusDot: $('statusDot'), statusText: $('statusText'),
    toolCount: $('toolCount'), elapsed: $('elapsed'),
    desks: $('desks'), office: $('office'),
    chatLog: $('chatLog'),
    directive: $('directive'), sendBtn: $('sendBtn'), stopBtn: $('stopBtn'),
    projList: $('projList'),
    settingsModal: $('settingsModal'),
    showStats: $('showStats'), showXp: $('showXp'),
    apiBase: $('apiBase'), sessVal: $('sessVal'),
  };
  dom.apiBase.textContent = API_BASE || '(same-origin)';

  // ─── 책상/캐릭터 초기 렌더 ───────────────────────────────────────────
  function renderDesks() {
    dom.desks.innerHTML = '';
    DEPTS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'desk';
      el.dataset.dept = d.id;
      el.dataset.state = 'idle';
      el.innerHTML = `
        <div class="ring"></div>
        <div class="badge"></div>
        <div class="dept-name">${d.emoji} ${d.label}</div>
      `;
      dom.desks.appendChild(el);
    });
    // Characters are positioned after layout stabilizes
    requestAnimationFrame(() => {
      DEPTS.forEach(d => createChar(d));
      requestAnimationFrame(positionAtHome);
    });
  }

  function createChar(d) {
    const char = document.createElement('div');
    char.className = 'char';
    char.id = 'char-' + d.id;
    char.dataset.homeDept = d.id;
    char.innerHTML = `
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="5" y="2" width="6" height="5" fill="#f6d5ad"/>
        <rect x="6" y="4" width="1" height="1" fill="#000"/>
        <rect x="9" y="4" width="1" height="1" fill="#000"/>
        <rect x="4" y="7" width="8" height="6" fill="${d.color}"/>
        <rect x="5" y="13" width="2" height="3" fill="#1a1a2e"/>
        <rect x="9" y="13" width="2" height="3" fill="#1a1a2e"/>
      </svg>
      <div class="nametag">${d.label}</div>
    `;
    dom.office.appendChild(char);
  }

  function positionAtHome() {
    const officeRect = dom.office.getBoundingClientRect();
    DEPTS.forEach(d => {
      const desk = dom.desks.querySelector(`.desk[data-dept="${d.id}"]`);
      const char = document.getElementById('char-' + d.id);
      if (!desk || !char) return;
      const rect = desk.getBoundingClientRect();
      char.style.left = (rect.left - officeRect.left + rect.width / 2 - 17) + 'px';
      char.style.top  = (rect.top  - officeRect.top  - 20) + 'px';
    });
  }

  // ─── 부서 상태 ─────────────────────────────────────────────────────
  function setDeptState(deptId, stateName) {
    const desk = dom.desks.querySelector(`.desk[data-dept="${deptId}"]`);
    if (desk) desk.dataset.state = stateName;
    const char = document.getElementById('char-' + deptId);
    if (char) {
      if (stateName === 'thinking' || stateName === 'working') char.classList.add('working');
      else char.classList.remove('working');
    }
    state.deptStates[deptId] = stateName;

    // Track if any dept is currently working → dim others
    if (stateName === 'thinking' || stateName === 'working') {
      state.activeDepts.add(deptId);
    } else if (stateName === 'idle' || stateName === 'done' || stateName === 'error') {
      state.activeDepts.delete(deptId);
    }
    dom.office.dataset.anyActive = state.activeDepts.size > 0 ? '1' : '0';
  }

  function setBubble(deptId, text, kind='think') {
    const char = document.getElementById('char-' + deptId);
    if (!char) return;
    const existing = char.querySelector('.bubble');
    if (existing) existing.remove();
    if (!text) return;
    const b = document.createElement('div');
    b.className = 'bubble ' + kind;
    b.textContent = text.length > 28 ? text.slice(0, 26) + '…' : text;
    char.appendChild(b);
  }
  function clearBubble(deptId) {
    const char = document.getElementById('char-' + deptId);
    if (!char) return;
    const b = char.querySelector('.bubble');
    if (b) b.remove();
  }

  // ─── 채팅 로그 ───────────────────────────────────────────────────────
  function logMsg(who, text, kind='sys') {
    const empty = dom.chatLog.querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.innerHTML = `<span class="who">${escapeHtml(who)}</span>${escapeHtml(text)}`;
    dom.chatLog.appendChild(div);
    dom.chatLog.scrollTop = dom.chatLog.scrollHeight;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ─── SSE 이벤트 핸들러 ───────────────────────────────────────────────
  function onEvent(ev) {
    let payload;
    try { payload = JSON.parse(ev.data); } catch { return; }
    const type = payload.type || ev.type;

    switch (type) {
      case 'mission_start':
        logMsg('DIRECTOR', `미션 분석 완료 · 도메인 ${payload.domain} · 부서 ${payload.deptCount}개`, 'ok');
        if (payload.topic) {
          dom.projName.textContent = payload.topic;
          if (state.currentProject) {
            state.currentProject.topic = payload.topic;
            saveProjects();
            renderProjList();
          }
        }
        break;

      case 'pmo_plan':
        logMsg('PMO', `실행 계획 수립 · ${payload.plan?.taskChecklist?.length||0}개 작업`, 'ok');
        // Highlight which depts are in the plan
        (payload.plan?.taskChecklist || []).forEach(t => {
          if (t.deptId) setDeptState(t.deptId, 'thinking');
        });
        break;

      case 'dept_start':
        setDeptState(payload.deptId, 'thinking');
        logMsg(payload.deptId.toUpperCase(), (payload.objective || '시작').slice(0, 80), 'dept');
        setBubble(payload.deptId, payload.objective || '분석 중', 'think');
        dom.office.classList.remove('empty');
        break;

      case 'dept_progress':
        setDeptState(payload.deptId, 'working');
        if (payload.message) setBubble(payload.deptId, payload.message, 'think');
        // Tool-call counter (hidden by default; visible in settings)
        const msg = (payload.message || '').toLowerCase();
        if (msg.includes('검색') || msg.includes('search') || msg.includes('tool') || msg.includes('api')) {
          state.toolCallCount++;
          dom.toolCount.textContent = state.toolCallCount;
        }
        break;

      case 'dept_done':
        setDeptState(payload.deptId, 'done');
        const sec = Math.round((payload.durationMs || 0) / 1000);
        logMsg(payload.deptId.toUpperCase(), `✓ 완료 · ${sec}초`, 'ok');
        setBubble(payload.deptId, '✓ 완료', 'done');
        setTimeout(() => clearBubble(payload.deptId), 3500);
        break;

      case 'dept_error':
        setDeptState(payload.deptId, 'error');
        logMsg(payload.deptId.toUpperCase(), `✗ 오류: ${payload.error || 'unknown'}`, 'err');
        setBubble(payload.deptId, payload.error || '오류', 'crit');
        break;

      case 'ensemble_start':
        logMsg('ENSEMBLE', `3-AI 앙상블 시작 · ${payload.reason || ''}`, 'sys');
        break;
      case 'ensemble_voice':
        if (payload.message) {
          const who = (payload.model || 'AI').toUpperCase().slice(0, 10);
          logMsg(who, payload.message.slice(0, 140), 'sys');
        }
        break;
      case 'ensemble_done':
        logMsg('ENSEMBLE', payload.summary || payload.verdict || '통합 완료', 'ok');
        break;

      case 'critic_review':
        const verdict = payload.review?.verdict || '';
        logMsg('CRITIC', `${verdict === 'pass' ? '✓ PASS' : '⚠ 재검토 필요'} · ${(payload.review?.summary || '').slice(0, 120)}`, verdict === 'pass' ? 'ok' : 'err');
        break;

      case 'ceo_briefing':
        const b = payload.briefing || {};
        if (b.executiveSummary) logMsg('CEO', b.executiveSummary, 'ok');
        if (Array.isArray(b.keyFindings)) {
          b.keyFindings.slice(0, 5).forEach((f, i) => logMsg('FINDING ' + (i+1), String(f), 'sys'));
        }
        if (Array.isArray(b.recommendations)) {
          b.recommendations.slice(0, 5).forEach((r, i) => logMsg('REC ' + (i+1), String(r), 'sys'));
        }
        break;

      case 'all_done':
        logMsg('SYSTEM', `전체 완료 · 라운드 ${payload.roundNumber||1}`, 'ok');
        finishRun();
        break;

      case 'error':
        logMsg('ERROR', payload.message || 'unknown error', 'err');
        finishRun(true);
        break;

      default:
        // unknown — just console
        console.log('[SSE]', type, payload);
    }
  }

  // ─── 실행 ───────────────────────────────────────────────────────────
  function startRun(directive) {
    if (state.running) return;
    resetRun();
    state.running = true;
    state.startTime = Date.now();
    dom.statusDot.className = 'status-dot live';
    dom.statusText.textContent = 'LIVE';
    dom.stopBtn.style.display = '';
    dom.sendBtn.disabled = true;
    dom.office.classList.remove('empty');
    logMsg('YOU', directive, 'user');

    // Ensure we have a current project
    if (!state.currentProject) {
      state.currentProject = { id: 'p_' + Date.now(), topic: directive.slice(0, 40), createdAt: Date.now() };
      state.projects.unshift(state.currentProject);
      saveProjects();
      renderProjList();
    }
    dom.projName.textContent = state.currentProject.topic;

    state.elapsedTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - state.startTime) / 1000);
      dom.elapsed.textContent = sec < 60 ? sec + '초' : Math.floor(sec/60) + '분 ' + (sec%60) + '초';
    }, 1000);

    const url = new URL(API_BASE + '/api/director/stream', location.href);
    url.searchParams.set('directive', directive);
    url.searchParams.set('projectName', state.currentProject.topic);

    try {
      const es = new EventSource(url.toString(), { withCredentials: true });
      state.eventSource = es;
      ['mission_start','pmo_plan','dept_start','dept_progress','dept_done','dept_error',
       'ensemble_start','ensemble_voice','ensemble_done','critic_review','ceo_briefing',
       'all_done','error','stream_end'].forEach(evName => es.addEventListener(evName, onEvent));
      es.onerror = () => {
        if (state.running) {
          logMsg('SYSTEM', 'SSE 연결 오류 · [데모] 버튼으로 오프라인 시연 가능', 'err');
          finishRun(true);
        }
      };
    } catch (err) {
      logMsg('SYSTEM', 'EventSource 생성 실패: ' + err.message, 'err');
      finishRun(true);
    }
  }

  function finishRun(isErr=false) {
    state.running = false;
    if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
    if (state.elapsedTimer) { clearInterval(state.elapsedTimer); state.elapsedTimer = null; }
    dom.statusDot.className = 'status-dot ' + (isErr ? 'err' : '');
    dom.statusText.textContent = isErr ? 'ERROR' : 'DONE';
    dom.stopBtn.style.display = 'none';
    dom.sendBtn.disabled = false;
    state.activeDepts.clear();
    dom.office.dataset.anyActive = '0';
  }

  function resetRun() {
    state.toolCallCount = 0;
    dom.toolCount.textContent = '0';
    dom.elapsed.textContent = '0초';
    state.activeDepts.clear();
    dom.office.dataset.anyActive = '0';
    DEPTS.forEach(d => {
      setDeptState(d.id, 'idle');
      clearBubble(d.id);
    });
    positionAtHome();
  }

  function stopRun() {
    if (!state.running) return;
    if (state.eventSource) state.eventSource.close();
    finishRun();
    logMsg('SYSTEM', '사용자 중단', 'err');
  }

  // ─── DEMO (백엔드 없이) ────────────────────────────────────────────
  async function runDemo() {
    if (state.running) return;
    resetRun();
    if (!dom.directive.value.trim()) {
      dom.directive.value = '케토 김밥 신제품 런칭 전략 분석. 마진 35% 이상, 식약처 규제 확인 필수, MZ 타겟.';
    }
    state.running = true;
    state.startTime = Date.now();
    dom.statusDot.className = 'status-dot live';
    dom.statusText.textContent = 'DEMO';
    dom.stopBtn.style.display = '';
    dom.sendBtn.disabled = true;
    dom.office.classList.remove('empty');
    logMsg('YOU', dom.directive.value, 'user');
    if (!state.currentProject) {
      state.currentProject = { id: 'p_' + Date.now(), topic: '데모 · ' + dom.directive.value.slice(0, 30), createdAt: Date.now() };
      state.projects.unshift(state.currentProject);
      saveProjects();
      renderProjList();
    }
    dom.projName.textContent = state.currentProject.topic;
    state.elapsedTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - state.startTime) / 1000);
      dom.elapsed.textContent = sec < 60 ? sec + '초' : Math.floor(sec/60) + '분 ' + (sec%60) + '초';
    }, 1000);

    // Subset of depts for demo
    const picked = ['market','compete','finance','legal','marketing','rnd'];
    await sleep(600);
    logMsg('DIRECTOR', '미션 분석 · 도메인 F&B · 부서 6개 선정', 'ok');
    await sleep(500);
    logMsg('PMO', '실행 계획 수립 · 6개 작업', 'ok');

    const objectives = {
      market:    '케토 시장 규모 분석',
      compete:   '경쟁사 조사',
      finance:   '원가 구조 · 마진 시뮬레이션',
      legal:     '식약처 라벨 규제 확인',
      marketing: 'MZ 타겟 캠페인 전략',
      rnd:       '레시피 · 영양 설계',
    };
    const durations = { market:2800, compete:3200, finance:3000, legal:3500, marketing:2500, rnd:4000 };

    for (const d of picked) setDeptState(d, 'thinking');
    picked.forEach(d => {
      logMsg(d.toUpperCase(), objectives[d], 'dept');
      setBubble(d, objectives[d], 'think');
    });

    await Promise.all(picked.map(async (d, i) => {
      await sleep(300 + i * 200);
      setDeptState(d, 'working');
      setBubble(d, '분석 중…', 'think');
      await sleep(durations[d]);
      setDeptState(d, 'done');
      setBubble(d, '✓ 완료', 'done');
      logMsg(d.toUpperCase(), '✓ 완료 · ' + Math.round(durations[d]/1000) + '초', 'ok');
      setTimeout(() => clearBubble(d), 3500);
    }));

    await sleep(600);
    logMsg('ENSEMBLE', '3-AI 통합 분석 중…', 'sys');
    await sleep(900);
    logMsg('ENSEMBLE', '통합 완료', 'ok');

    await sleep(400);
    logMsg('CRITIC', '✓ PASS · 자료 근거 충분, 재무 가정 현실적', 'ok');

    await sleep(500);
    logMsg('CEO', '케토 김밥은 프리미엄 편의점 채널에서 최적. 예상 마진 37%, 식약처 규제 클리어. 3개월 내 런칭 권고.', 'ok');
    logMsg('REC 1', '초도 3개월은 편의점 1,200개 매장 집중 출시', 'sys');
    logMsg('REC 2', 'MZ 타겟 SNS 프리뷰 캠페인 (인플루언서 8명)', 'sys');
    logMsg('REC 3', '원재료 공급처 이중화로 마진 변동성 완화', 'sys');

    logMsg('SYSTEM', '전체 완료 · 라운드 1', 'ok');
    finishRun();
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ─── 프로젝트 관리 ──────────────────────────────────────────────────
  function loadProjects() {
    try { return JSON.parse(localStorage.getItem('cx_projects') || '[]'); } catch { return []; }
  }
  function saveProjects() {
    localStorage.setItem('cx_projects', JSON.stringify(state.projects.slice(0, 30)));
  }
  function renderProjList() {
    if (state.projects.length === 0) {
      dom.projList.innerHTML = '<div class="proj-empty">아직 없음</div>';
      return;
    }
    dom.projList.innerHTML = '';
    state.projects.slice(0, 12).forEach(p => {
      const el = document.createElement('div');
      el.className = 'proj-item' + (state.currentProject?.id === p.id ? ' active' : '');
      el.textContent = p.topic || '(제목 없음)';
      el.title = p.topic;
      el.onclick = () => {
        state.currentProject = p;
        dom.projName.textContent = p.topic;
        renderProjList();
      };
      dom.projList.appendChild(el);
    });
  }

  // ─── Public API ──────────────────────────────────────────────────────
  window.CX = {
    send() {
      const v = dom.directive.value.trim();
      if (!v) { dom.directive.focus(); return; }
      startRun(v);
      dom.directive.value = '';
    },
    stop: stopRun,
    demo: runDemo,
    newChat() {
      if (state.running) return;
      state.currentProject = null;
      dom.projName.textContent = '새 채팅';
      dom.chatLog.innerHTML = '<div class="chat-empty">자연어로 지시를 입력하세요.<br>AI가 필요한 부서를 자동 선택합니다.<br><br><span style="color:var(--mute)">Enter 전송 · Shift+Enter 줄바꿈</span></div>';
      resetRun();
      dom.office.classList.add('empty');
      dom.statusDot.className = 'status-dot';
      dom.statusText.textContent = 'IDLE';
      renderProjList();
      dom.directive.focus();
    },
    newProject() {
      const name = prompt('프로젝트 이름:');
      if (!name) return;
      state.currentProject = { id: 'p_' + Date.now(), topic: name, createdAt: Date.now() };
      state.projects.unshift(state.currentProject);
      saveProjects();
      renderProjList();
      dom.projName.textContent = name;
      dom.chatLog.innerHTML = '<div class="chat-empty">프로젝트 "' + escapeHtml(name) + '"<br>지시를 입력해 시작하세요.</div>';
      resetRun();
      dom.office.classList.add('empty');
    },
    openSettings() {
      const show = document.body.classList.contains('show-stats');
      dom.showStats.checked = show;
      dom.showXp.checked = document.body.classList.contains('show-xp');
      dom.sessVal.textContent = state.currentProject?.id || '(없음)';
      dom.settingsModal.classList.add('open');
    },
    closeSettings() { dom.settingsModal.classList.remove('open'); },
  };

  // ─── Event wiring ────────────────────────────────────────────────────
  dom.directive.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      CX.send();
    }
  });

  // Preset ops buttons
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.preset;
      dom.directive.value = PRESETS[key] || '';
      dom.directive.focus();
    };
  });

  // Settings persistence
  dom.showStats.addEventListener('change', () => {
    document.body.classList.toggle('show-stats', dom.showStats.checked);
    localStorage.setItem('cx_showStats', dom.showStats.checked ? '1' : '0');
  });
  dom.showXp.addEventListener('change', () => {
    document.body.classList.toggle('show-xp', dom.showXp.checked);
    localStorage.setItem('cx_showXp', dom.showXp.checked ? '1' : '0');
  });
  if (localStorage.getItem('cx_showStats') === '1') document.body.classList.add('show-stats');
  if (localStorage.getItem('cx_showXp') === '1') document.body.classList.add('show-xp');

  // Close modal on backdrop click
  dom.settingsModal.addEventListener('click', (e) => {
    if (e.target === dom.settingsModal) CX.closeSettings();
  });

  // Reposition characters on window resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(positionAtHome, 150);
  });

  // Init
  renderDesks();
  renderProjList();
})();
</script>
</body>
