<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORVUS X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg:#F0EEE8;
    --bg-gradient:linear-gradient(135deg,#FEFEFE 0%,#F5F4EF 30%,#EFEEE8 55%,#F5F4EF 80%,#FEFEFE 100%);
    --sidebar:#E8E6E0;
    --chat:#F0EEE8;
    --panel:#E8E6E0;
    --input:#F5F4EF;
    --surface:#FFFFFF;
    --surface-hi:#F5F4EF;
    --border:#B8B4A8;
    --border-soft:rgba(140,130,115,0.22);
    --text:#1A1915;
    --text-soft:#6B6560;
    --text-dim:#9A938A;
    --accent:#C96442;
    --accent-hover:#B55737;
    --accent-alt:#8b5cf6;
    --gold:#c08835;
    --magenta:#c44a8b;
    --red:#b94141;
    --green:#3d8a55;
    --user-bubble:#C96442;
    --user-bubble-border:#B55737;
    --user-bubble-text:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    background:var(--bg-gradient);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;
    overflow:hidden;font-size:18px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* ─ layout: sidebar(resizable) / main / panel ───────────────────── */
  .app{
    display:grid;
    grid-template-columns:var(--sidebar-w,260px) 1fr var(--panel-w,300px);
    height:100vh;
    transition:grid-template-columns .22s ease;
  }
  .app.is-resizing{transition:none}
  .app[data-sidebar="closed"]{grid-template-columns:0 1fr var(--panel-w,300px)}
  .app[data-panel="closed"]{grid-template-columns:var(--sidebar-w,260px) 1fr 0}
  .app[data-sidebar="closed"][data-panel="closed"]{grid-template-columns:0 1fr 0}

  /* ─ sidebar ─────────────────────────────────────────────────────── */
  .sidebar{background:var(--sidebar);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
  .sidebar-inner{width:100%;display:flex;flex-direction:column;min-width:0;height:100%;padding:8px 0 8px}
  .sidebar-resize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:5;background:transparent}
  .sidebar-resize:hover{background:rgba(201,100,66,.3)}

  .sb-head{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;position:relative}
  .sb-head .logo{flex:1;font-size:15px;font-weight:700;letter-spacing:.4px;color:var(--text);display:flex;align-items:center;gap:7px}
  .sb-head .logo .mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt))}
  .sb-head button.icon-btn{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sb-head button.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

  .nav-btn{display:flex;align-items:center;gap:9px;padding:8px 14px;color:var(--text-soft);cursor:pointer;font-size:15px;text-decoration:none;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s;border-radius:0}
  .nav-btn:hover{background:rgba(0,0,0,.04);color:var(--text)}
  .nav-btn.active{background:rgba(201,100,66,.12);color:var(--accent)}
  .nav-btn .ic{width:14px;height:14px;flex-shrink:0;opacity:.85}

  .nav-divider{padding:14px 14px 4px;font-size:12px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .nav-divider .add{color:var(--text-dim);cursor:pointer;font-size:15px;padding:2px 4px}
  .nav-divider .add:hover{color:var(--accent)}

  .sidebar-scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:8px}
  .sidebar-scroll::-webkit-scrollbar{width:5px}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:3px}

  .thread-item{padding:6px 14px 6px 22px;color:var(--text-soft);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:background .12s;position:relative}
  .thread-item .t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .thread-item .t-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread-item .t-meta{font-size:12px;color:var(--text-dim)}
  .thread-item .pin{color:var(--gold);font-size:12px}
  .thread-item:hover{background:rgba(0,0,0,.05);color:var(--text)}
  .thread-item.active{background:rgba(201,100,66,.12);color:var(--accent)}
  .thread-item .row-menu{opacity:.35;padding:2px 6px;font-size:16px;color:var(--text-dim);cursor:pointer;border-radius:4px;line-height:1;border:none;background:transparent;flex-shrink:0}
  .thread-item:hover .row-menu,.thread-item .row-menu.is-open{opacity:1}
  .thread-item .row-menu:hover{background:rgba(0,0,0,.08);color:var(--text)}

  .thread-rename-input{background:var(--input);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:14px;padding:2px 6px;outline:none;width:100%}

  .project-row{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--text);user-select:none;transition:background .12s}
  .project-row:hover{background:rgba(0,0,0,.05)}
  .project-row.active{background:rgba(201,100,66,.08)}
  .project-row .caret{font-size:9px;transition:transform .15s;width:10px;display:inline-block;text-align:center}
  .project-row.collapsed .caret{transform:rotate(-90deg)}
  .project-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .project-row .count{color:var(--text-dim);font-size:12px}
  .project-row .row-menu{opacity:.35;padding:2px 6px;font-size:16px;color:var(--text-dim);cursor:pointer;border-radius:4px;line-height:1;border:none;background:transparent;flex-shrink:0}
  .project-row:hover .row-menu,.project-row .row-menu.is-open{opacity:.85}
  .project-row .row-menu:hover{background:rgba(0,0,0,.08);color:var(--text);opacity:1}
  .project-new-thread{padding:4px 14px 6px 34px;color:var(--text-dim);font-size:13px;cursor:pointer}
  .project-new-thread:hover{color:var(--accent)}

  /* bubble menu */
  .bubble-menu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 10px 30px rgba(100,90,70,.18);font-size:14px}
  .bubble-menu .mi{padding:7px 10px;cursor:pointer;border-radius:5px;color:var(--text-soft);display:flex;align-items:center;gap:8px}
  .bubble-menu .mi:hover{background:rgba(0,0,0,.05);color:var(--text)}
  .bubble-menu .mi.danger:hover{background:rgba(185,65,65,.12);color:#fca5a5}
  .bubble-menu .mi .chev{margin-left:auto;color:var(--text-dim)}
  .bubble-menu .divider{height:1px;background:var(--border-soft);margin:4px 2px}
  .bubble-menu .sub{position:absolute;left:100%;top:0;margin-left:2px}

  /* ─ main column ─ */
  .main-col{display:grid;grid-template-rows:30% 70%;min-height:0;min-width:0;background:var(--bg)}
  .office-wrap{position:relative;background:#2A2D3A;overflow:hidden;border-bottom:1px solid var(--border-soft)}
  .office-title{position:absolute;top:8px;left:14px;color:var(--text-soft);font-size:13px;letter-spacing:2px;font-weight:600;z-index:3;pointer-events:none;opacity:.7}
  .office-status{position:absolute;top:8px;right:14px;color:var(--text-soft);font-size:13px;display:flex;align-items:center;gap:6px;z-index:3;pointer-events:none}
  .office-status .dot{width:7px;height:7px;border-radius:50%;background:#374151}
  .office-status .dot.live{background:#22c55e;animation:pulse 1.4s ease-in-out infinite}
  .office-status .dot.err{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  #phaser-container{width:100%;height:100%}
  #phaser-container canvas{display:block}

  .chat{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--chat);position:relative}
  .chat-header{padding:10px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .chat-title{font-size:15.5px;font-weight:600;color:var(--text);cursor:pointer;padding:3px 8px;border-radius:5px;border:1px solid transparent;outline:none;max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-title:hover{border-color:var(--border)}
  .chat-title[contenteditable="true"]{border-color:var(--accent);background:var(--input)}

  .chat-log{flex:1;overflow-y:auto;padding:18px 28px 12px;display:flex;flex-direction:column;gap:14px;min-height:0;scroll-behavior:smooth}
  .chat-log::-webkit-scrollbar{width:6px}
  .chat-log::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:4px}
  .chat-empty{color:var(--text-dim);font-size:15px;text-align:center;padding:80px 20px}
  .chat-empty h3{margin:0 0 6px;font-size:18px;color:var(--text-soft);font-weight:600}

  /* Project Home (activeThreadId === null && activeProjectId !== __general__) */
  .project-home{max-width:720px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .project-home__icon{font-size:48px;line-height:1;margin-bottom:2px}
  .project-home__title{font-size:20px;font-weight:700;color:#1A1915;word-break:break-word}
  .project-home__desc{font-size:14px;color:#6B6560;line-height:1.6}
  .project-home__btn{background:#c96442;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s}
  .project-home__btn:hover{filter:brightness(1.08)}
  .project-home__threads{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .project-home__thread{background:#fff;border:1px solid #B8B4A8;border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
  .project-home__thread:hover{background:#F5F4EF;border-color:#9a9486}
  .project-home__thread-title{font-size:14.5px;font-weight:600;color:#1A1915;margin-bottom:2px}
  .project-home__thread-meta{font-size:12px;color:#6B6560}

  .msg{display:flex;flex-direction:column;gap:3px;animation:msg-in .2s ease-out;max-width:100%;position:relative}
  @keyframes msg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;align-items:flex-end;max-width:min(80%,760px)}
  .msg:not(.user){align-self:flex-start;align-items:flex-start;max-width:100%;width:100%}
  .msg .who{font-size:12.5px;color:var(--text-dim);margin-bottom:2px;padding:0 4px;display:flex;align-items:center;gap:5px}
  .msg .body{padding:11px 15px;border-radius:14px;font-size:15.5px;line-height:1.65;word-break:break-word;background:var(--surface);border:1px solid var(--border-soft);color:var(--text);max-width:100%;box-shadow:0 1px 3px rgba(100,90,70,.06)}
  .msg.user .body{background:var(--user-bubble);border-color:var(--user-bubble-border);color:var(--user-bubble-text);border-bottom-right-radius:4px;white-space:pre-wrap;box-shadow:0 2px 8px rgba(201,100,66,.18)}
  .msg:not(.user) .body{border-bottom-left-radius:4px}
  .msg.dept .who .dot{width:7px;height:7px;border-radius:50%;background:var(--dept-color,#9ca3af)}
  .msg.ceo .body{border-left:3px solid var(--gold);background:#FDF8EC}
  .msg.ceo .who{color:var(--gold);font-weight:600}
  .msg.critic .body{border-left:3px solid var(--magenta);background:#FBEFF3}
  .msg.critic .who{color:var(--magenta);font-weight:600}
  .msg.sys{align-self:center;max-width:100%;align-items:center}
  .msg.sys .body{background:transparent;border:none;padding:2px 6px;color:var(--text-dim);font-size:13.5px;font-style:italic}
  .msg.err .body{background:rgba(185,65,65,.08);border-color:rgba(185,65,65,.3);color:#fca5a5}

  /* markdown body */
  .md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;font-weight:700;color:var(--text)}
  .md h1{font-size:20px} .md h2{font-size:18px} .md h3{font-size:16.5px} .md h4{font-size:15px}
  .md p{margin:6px 0}
  .md ul,.md ol{margin:6px 0;padding-left:22px}
  .md li{margin:2px 0}
  .md code.inline{background:rgba(0,0,0,.06);border:1px solid var(--border-soft);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;color:#6c2fbf}
  .md pre{position:relative;background:#F7F5EE;border:1px solid var(--border-soft);border-radius:8px;padding:12px;margin:8px 0;overflow:auto;font-size:14.5px;color:#2a2520}
  .md pre code{font-family:ui-monospace,Menlo,Consolas,monospace;display:block;white-space:pre;background:transparent}
  .md pre .copy-code{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);border:1px solid var(--border-soft);color:var(--text-soft);font-size:12.5px;padding:2px 7px;border-radius:5px;cursor:pointer;opacity:0;transition:opacity .15s}
  .md pre:hover .copy-code{opacity:1}
  .md pre .copy-code:hover{background:rgba(140,130,115,.28)}
  .md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .md table{border-collapse:collapse;margin:8px 0;font-size:14.5px}
  .md th,.md td{border:1px solid var(--border);padding:5px 9px}
  .md th{background:rgba(0,0,0,.04);font-weight:600}
  .md strong{font-weight:700;color:var(--text)}
  .md em{font-style:italic}
  .md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--border);color:var(--text-soft)}
  .md .sec{font-size:12.5px;color:var(--text-dim);font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:.4px}
  .md hr{border:none;border-top:1px solid var(--border-soft);margin:12px 0}

  .msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;margin-top:4px;padding:0 4px}
  .msg:hover .msg-actions,.msg-actions.is-open{opacity:1}
  .msg-actions button{background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:13.5px;padding:3px 7px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .msg-actions button:hover{background:rgba(0,0,0,.06);border-color:var(--border-soft);color:var(--text)}
  .msg-actions button.thumb-up.on{color:var(--green)}
  .msg-actions button.thumb-down.on{color:var(--red)}

  .edit-area{display:flex;flex-direction:column;gap:6px;width:100%}
  .edit-area textarea{background:var(--input);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:15px;min-height:64px;resize:vertical;outline:none}
  .edit-area .row{display:flex;gap:6px;justify-content:flex-end;font-size:13px;color:var(--text-dim)}
  .edit-area button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-soft);cursor:pointer;font-size:14px}
  .edit-area button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .ver-nav{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--text-dim);margin-left:6px}
  .ver-nav button{background:transparent;border:1px solid transparent;color:var(--text-dim);padding:0 5px;border-radius:4px;cursor:pointer;font-size:14px;line-height:1.3}
  .ver-nav button:hover:not(:disabled){color:var(--text);border-color:var(--border-soft)}
  .ver-nav button:disabled{opacity:.35;cursor:not-allowed}

  .to-bottom{position:absolute;right:24px;bottom:calc(var(--input-h,96px) + 8px);width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-soft);cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(100,90,70,.14);z-index:8}
  .to-bottom.visible{display:flex}
  .to-bottom:hover{color:var(--text);background:var(--surface-hi)}

  /* chat input */
  .chat-input{padding:10px 20px 16px;border-top:1px solid var(--border-soft);background:var(--chat);flex-shrink:0;position:relative}
  .chat-input.drag-over .chat-input-wrap{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
  .chat-input-wrap{position:relative;background:var(--input);border:1px solid var(--border);border-radius:16px;padding:12px 54px 12px 48px;transition:border-color .15s,box-shadow .15s}
  .chat-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.16)}
  .chat-input-wrap textarea{width:100%;height:auto;background:transparent;border:none;outline:none;resize:none;min-height:24px;max-height:160px;line-height:1.55;color:var(--text);font-size:16px;display:block;overflow-y:auto}
  .chat-input-wrap textarea::placeholder{color:var(--text-dim)}

  .attach-btn{position:absolute;left:8px;bottom:8px;width:32px;height:32px;border:none;border-radius:9px;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .attach-btn:hover{background:rgba(0,0,0,.06);color:var(--text)}

  .send-btn{position:absolute;right:7px;bottom:7px;width:34px;height:34px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .15s,background .15s}
  .send-btn:hover:not(:disabled){filter:brightness(1.1)}
  .send-btn:disabled{opacity:.45;cursor:not-allowed}
  .send-btn.stop{background:var(--red)}

  .chat-hint{margin-top:6px;font-size:12.5px;color:var(--text-dim)}
  .chat-hint kbd{background:var(--input);border:1px solid var(--border);padding:1px 5px;border-radius:3px;font-size:12px;color:var(--text-soft)}

  .attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .attach-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:3px 8px 3px 10px;font-size:13.5px;color:var(--text-soft);max-width:240px}
  .attach-chip .name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach-chip .size{color:var(--text-dim);font-size:12px}
  .attach-chip .rm{cursor:pointer;color:var(--text-dim);border:none;background:none;padding:2px 4px;border-radius:4px}
  .attach-chip .rm:hover{color:var(--red);background:rgba(185,65,65,.1)}
  .attach-chip img.thumb{width:18px;height:18px;border-radius:3px;object-fit:cover}

  /* slash command dropdown */
  .slash-menu{position:absolute;left:16px;right:16px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(100,90,70,.22);overflow:hidden;z-index:20;max-height:280px;overflow-y:auto}
  .slash-menu .item{padding:8px 12px;display:grid;grid-template-columns:56px 1fr;gap:10px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--border-soft)}
  .slash-menu .item:last-child{border-bottom:none}
  .slash-menu .item .cmd{color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:600}
  .slash-menu .item .desc{color:var(--text-soft);font-size:14px}
  .slash-menu .item.active{background:rgba(201,100,66,.12)}

  /* right panel */
  .panel{background:var(--panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
  .panel-resize{position:absolute;top:0;left:-3px;width:6px;height:100%;cursor:ew-resize;z-index:5;background:transparent}
  .panel-resize:hover{background:rgba(201,100,66,.25)}
  .panel-inner{width:100%;display:flex;flex-direction:column;min-width:0;height:100%}
  .panel-tabs{display:flex;border-bottom:1px solid var(--border-soft);flex-shrink:0}
  .tab-btn{flex:1;padding:12px 8px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13.5px;font-weight:500;transition:color .12s,background .12s;position:relative}
  .tab-btn:hover{color:var(--text-soft);background:rgba(255,255,255,.02)}
  .tab-btn.active{color:var(--text)}
  .tab-btn.active::after{content:'';position:absolute;bottom:0;left:12px;right:12px;height:2px;background:var(--accent);border-radius:2px}
  .panel-body{flex:1;overflow-y:auto;padding:14px 16px}
  .panel-body::-webkit-scrollbar{width:5px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(140,130,115,.22);border-radius:3px}
  .panel-sec{margin-bottom:16px}
  .panel-sec h4{font-size:12px;color:var(--text-dim);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}
  .dept-row{display:grid;grid-template-columns:18px 1fr 54px;gap:8px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--border-soft)}
  .dept-row:last-child{border-bottom:none}
  .dept-row .ddot{width:8px;height:8px;border-radius:50%;background:var(--dept-color,#374151)}
  .dept-row .dname{color:var(--text-soft)}
  .dept-row.working .dname{color:var(--text)}
  .dept-row .dstate{font-size:12.5px;color:var(--text-dim);text-align:right;letter-spacing:.3px}
  .dept-row.working .dstate{color:var(--accent)}
  .dept-row.done .dstate{color:var(--green)}
  .dept-row.err .dstate{color:var(--red)}
  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .kpi-tile{background:var(--surface);border:1px solid var(--border-soft);padding:9px 10px;border-radius:8px}
  .kpi-tile .label{font-size:12px;color:var(--text-dim);margin-bottom:2px}
  .kpi-tile .val{font-size:16px;font-weight:600;color:var(--text)}
  .panel-empty{color:var(--text-dim);font-size:13.5px;font-style:italic;padding:40px 8px;text-align:center}

  /* toggle buttons */
  .toggle-btn{position:fixed;z-index:50;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.88);color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:background .12s,color .12s,transform .2s}
  .toggle-btn:hover{background:var(--surface);color:var(--text)}
  .toggle-sidebar{top:10px;left:8px;transition:left .25s ease}
  .app[data-sidebar="open"] .toggle-sidebar{left:calc(var(--sidebar-w,260px) - 38px)}
  .toggle-panel{top:50%;right:8px;transform:translateY(-50%);transition:right .25s ease}
  .app[data-panel="open"] .toggle-panel{right:264px}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:14.5px;z-index:300;box-shadow:0 10px 30px rgba(100,90,70,.22);opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app" data-sidebar="open" data-panel="open">

  <button class="toggle-btn toggle-sidebar" id="toggleSidebar" title="사이드바">☰</button>
  <button class="toggle-btn toggle-panel" id="togglePanel" title="우측 패널">◀</button>

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="sb-head">
        <span class="logo"><span class="mark"></span>CORVUS X</span>
        <button class="icon-btn" id="sbToggleCollapse" title="사이드바 접기">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4L6 8l4 4"/></svg>
        </button>
      </div>
      <button class="nav-btn active" id="navNewChat">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
        새 채팅
      </button>
      <a href="/?view=images" class="nav-btn">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="6" cy="7" r="1.5"/><path d="M2 11l4-4 3 3 5-5"/></svg>
        이미지
      </a>
      <a href="/?view=dashboard" class="nav-btn">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="5" height="5"/><rect x="9" y="3" width="5" height="5"/><rect x="2" y="10" width="5" height="3"/><rect x="9" y="10" width="5" height="3"/></svg>
        대시보드
      </a>
      <div class="sidebar-scroll" id="sidebarScroll">
        <div class="nav-divider">프로젝트 <span class="add" id="newProject" title="새 프로젝트">+</span></div>
        <div id="projectList"></div>
        <div class="nav-divider">최근 채팅</div>
        <div id="generalThreads"></div>
      </div>
      <div class="sidebar-resize" id="sidebarResize" title="드래그로 크기 조절"></div>
    </div>
  </aside>

  <!-- main -->
  <div class="main-col">
    <div class="office-wrap">
      <div class="office-title">CORVUS X OFFICE</div>
      <div class="office-status">
        <span class="dot" id="officeStatusDot"></span>
        <span id="officeStatusText">대기 중</span>
      </div>
      <div id="phaser-container"></div>
    </div>

    <section class="chat">
      <div class="chat-header">
        <span class="chat-title" id="chatTitle">신규 대화</span>
      </div>
      <div class="chat-log" id="chatLog">
        <div class="chat-empty">
          <h3>무엇을 도와드릴까요?</h3>
          <p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p>
        </div>
      </div>
      <button class="to-bottom" id="toBottom" title="맨 아래로">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 9l5 4 5-4"/></svg>
      </button>
      <div class="chat-input" id="chatInput">
        <div id="attachRow" class="attach-row" style="display:none"></div>
        <div class="chat-input-wrap" id="inputWrap">
          <button class="attach-btn" id="attachBtn" title="파일 첨부">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13 7l-5.5 5.5a3 3 0 11-4.2-4.2L8.5 3a2 2 0 112.8 2.8L5.8 11.3a1 1 0 11-1.4-1.4L9.5 4.8"/></svg>
          </button>
          <input type="file" id="fileInput" multiple style="display:none" />
          <textarea id="directive" rows="1" placeholder="무엇이든 물어보세요... ( / 로 명령 )"></textarea>
          <button class="send-btn" id="sendBtn" title="전송">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
          <div id="slashMenu" class="slash-menu" style="display:none"></div>
        </div>
        <div class="chat-hint"><kbd>Enter</kbd> 전송 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈 · <kbd>/</kbd> 명령 · 파일 드래그/붙여넣기 지원</div>
      </div>
    </section>
  </div>

  <!-- right panel -->
  <aside class="panel">
    <div class="panel-resize" id="panelResize" title="드래그로 크기 조절"></div>
    <div class="panel-inner">
      <div class="panel-tabs">
        <button class="tab-btn active" data-tab="depts">부서현황</button>
        <button class="tab-btn" data-tab="sales">매출</button>
        <button class="tab-btn" data-tab="pos">POS</button>
        <button class="tab-btn" data-tab="report">보고</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const API_BASE = location.origin.includes('localhost') ? 'http://localhost:8000' : '';

  // departments
  const DEPTS = [
    { id:'market',    kr:'시장조사', color:0x3b82f6, hex:'#3b82f6' },
    { id:'marketing', kr:'마케팅',   color:0xec4899, hex:'#ec4899' },
    { id:'finance',   kr:'재무',     color:0x22c55e, hex:'#22c55e' },
    { id:'legal',     kr:'법무',     color:0xa855f7, hex:'#a855f7' },
    { id:'compete',   kr:'경쟁분석', color:0xef4444, hex:'#ef4444' },
    { id:'rnd',       kr:'R&D',      color:0xf97316, hex:'#f97316' },
    { id:'data',      kr:'데이터',   color:0x06b6d4, hex:'#06b6d4' },
    { id:'content',   kr:'콘텐츠',   color:0xeab308, hex:'#eab308' },
    { id:'sns',       kr:'SNS',      color:0x14b8a6, hex:'#14b8a6' },
  ];
  const DEPT_BY_ID = Object.fromEntries(DEPTS.map(d => [d.id, d]));

  // slash commands
  const SLASH_COMMANDS = [
    { cmd:'/dalle',      desc:'OpenAI DALL-E 이미지 생성' },
    { cmd:'/imagen',     desc:'Gemini Imagen 4 이미지 생성' },
    { cmd:'/midjourney', desc:'Midjourney v6.1 이미지' },
    { cmd:'/runway',     desc:'Runway Gen4 영상' },
    { cmd:'/veo',        desc:'Gemini Veo 3.1 영상' },
    { cmd:'/research',   desc:'심층 리서치 (Perplexity 분할)' },
    { cmd:'/web',        desc:'웹 검색' },
    { cmd:'/legal',      desc:'법무 검토 + 자동 법규 갱신' },
    { cmd:'/finance',    desc:'재무 분석' },
    { cmd:'/product',    desc:'제품 개발 (도메인 도구)' },
    { cmd:'/data',       desc:'데이터 분석' },
    { cmd:'/code',       desc:'코드 작성 / 리뷰' },
    { cmd:'/slide',      desc:'슬라이드 (Slides Creator)' },
  ];

  const GENERAL = '__general__';
  const LS = {
    SIDEBAR:'cx-office.sidebar',
    PANEL:'cx-office.panel',
    SIDEBAR_W:'cx-office.sidebarWidth',
    PANEL_W:'cx-office.panelWidth',
    TAB:'cx-office.tab',
    PROJECTS:'cx-office.projects.v4',
    THREADS:'cx-office.threads.v4',
    ACTIVE_THREAD:'cx-office.activeThread.v4',
    COLLAPSED:'cx-office.collapsedProjects.v4',
    FEEDBACK:'cx-office.feedback.v4',
  };

  const state = {
    es:null,
    running:false,
    scene:null,
    projects:(loadLS(LS.PROJECTS, []) || []).filter(p => p && p.id && p.id !== '__general__'),
    threads:loadLS(LS.THREADS, {}),
    activeThreadId:localStorage.getItem(LS.ACTIVE_THREAD) || null,
    activeProjectId:GENERAL,
    collapsedProjects:new Set(loadLS(LS.COLLAPSED, [])),
    currentTab:localStorage.getItem(LS.TAB) || 'depts',
    deptStates:{},
    missionDeptCount:9,
    deptCompletedCount:0,
    executiveActive:false,
    lastBriefing:null,
    lastCritic:null,
    attachments:[],      // [{id, name, size, type, dataUrl, text}]
    feedback:loadLS(LS.FEEDBACK, {}),  // { [msgId]: 'up'|'down' }
    userAtBottom:true,
    editingMsgId:null,
  };

  function loadLS(key, fb){ try{const r=localStorage.getItem(key); return r?JSON.parse(r):fb;}catch{return fb;} }
  function saveLS(key, v){ try{localStorage.setItem(key, JSON.stringify(v));}catch{} }

  DEPTS.forEach(d => { state.deptStates[d.id] = 'idle'; });

  // ─── DOM ────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const dom = {
    app:$('app'),
    toggleSidebar:$('toggleSidebar'), togglePanel:$('togglePanel'),
    sbToggleCollapse:$('sbToggleCollapse'),
    navNewChat:$('navNewChat'), newProject:$('newProject'),
    generalThreads:$('generalThreads'), projectList:$('projectList'),
    chatTitle:$('chatTitle'), chatLog:$('chatLog'),
    directive:$('directive'), sendBtn:$('sendBtn'),
    attachBtn:$('attachBtn'), fileInput:$('fileInput'), attachRow:$('attachRow'),
    chatInput:$('chatInput'), inputWrap:$('inputWrap'),
    slashMenu:$('slashMenu'), toBottom:$('toBottom'),
    sidebarResize:$('sidebarResize'),
    panelResize:$('panelResize'),
    officeStatusDot:$('officeStatusDot'), officeStatusText:$('officeStatusText'),
    panelBody:$('panelBody'), toast:$('toast'),
  };

  // ─── Toast ──────────────────────────────────────────────────────
  let toastTimer = null;
  function toast(msg){
    dom.toast.textContent = msg;
    dom.toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => dom.toast.classList.remove('show'), 1800);
  }

  // ─── Sidebar width + toggles ────────────────────────────────────
  const sidebarWidth = Math.min(400, Math.max(200, Number(localStorage.getItem(LS.SIDEBAR_W) || 260)));
  document.documentElement.style.setProperty('--sidebar-w', sidebarWidth + 'px');
  const panelWidth = Math.min(500, Math.max(250, Number(localStorage.getItem(LS.PANEL_W) || 300)));
  document.documentElement.style.setProperty('--panel-w', panelWidth + 'px');

  function applyToggles(){
    dom.app.dataset.sidebar = localStorage.getItem(LS.SIDEBAR) === 'closed' ? 'closed' : 'open';
    dom.app.dataset.panel   = localStorage.getItem(LS.PANEL)   === 'closed' ? 'closed' : 'open';
    dom.togglePanel.textContent = dom.app.dataset.panel === 'open' ? '◀' : '▶';
  }
  dom.toggleSidebar.addEventListener('click', () => {
    const next = dom.app.dataset.sidebar === 'open' ? 'closed' : 'open';
    dom.app.dataset.sidebar = next;
    localStorage.setItem(LS.SIDEBAR, next);
  });
  dom.sbToggleCollapse.addEventListener('click', () => dom.toggleSidebar.click());
  dom.togglePanel.addEventListener('click', () => {
    const next = dom.app.dataset.panel === 'open' ? 'closed' : 'open';
    dom.app.dataset.panel = next;
    localStorage.setItem(LS.PANEL, next);
    dom.togglePanel.textContent = next === 'open' ? '◀' : '▶';
  });

  // sidebar resize
  (() => {
    let startX = 0, startW = 260, dragging = false;
    dom.sidebarResize.addEventListener('mousedown', (e) => {
      if (dom.app.dataset.sidebar !== 'open') return;
      dragging = true;
      startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 260;
      dom.app.classList.add('is-resizing');
      document.body.style.cursor = 'ew-resize';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      let w = startW + (e.clientX - startX);
      w = Math.max(200, Math.min(400, w));
      document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      dom.app.classList.remove('is-resizing');
      document.body.style.cursor = '';
      const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 260;
      localStorage.setItem(LS.SIDEBAR_W, String(w));
    });
  })();

  // panel resize (left-edge drag)
  (() => {
    let startX = 0, startW = 300, dragging = false;
    dom.panelResize.addEventListener('mousedown', (e) => {
      if (dom.app.dataset.panel !== 'open') return;
      dragging = true;
      startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w')) || 300;
      dom.app.classList.add('is-resizing');
      document.body.style.cursor = 'ew-resize';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      let w = startW - (e.clientX - startX);  // left-edge drag: inverse direction
      w = Math.max(250, Math.min(500, w));
      document.documentElement.style.setProperty('--panel-w', w + 'px');
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      dom.app.classList.remove('is-resizing');
      document.body.style.cursor = '';
      const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w')) || 300;
      localStorage.setItem(LS.PANEL_W, String(w));
    });
  })();

  // ─── Phaser scene (isometric, zoom 1.8) ─────────────────────────
  const W = 1600, H = 520;
  const TILE_W = 56, TILE_H = 28;
  const ORIGIN_X = W / 2;
  const ORIGIN_Y = 120;
  function isoX(tx, ty){ return ORIGIN_X + (tx - ty) * (TILE_W / 2); }
  function isoY(tx, ty){ return ORIGIN_Y + (tx + ty) * (TILE_H / 2); }

  const CUBICLES = DEPTS.map((d, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    return { deptId: d.id, tx: 2.0 + col * 1.6, ty: 2.3 + row * 1.0 };
  });
  const MEETING_SEATS = DEPTS.map((_d, i) => ({
    tx: 0.5 + (i % 3) * 0.6,
    ty: 0.3 + Math.floor(i / 3) * 0.5,
  }));
  DEPTS.forEach((d, i) => { d._meetingSeat = MEETING_SEATS[i]; });

  const C = {
    floorA:0x151b2d, floorB:0x1b2238, floorEdge:0x0a0d14,
    deskTop:0x2d3752, deskSide:0x1b223a, deskFront:0x242c47,
    chairBody:0x374151, chairSeat:0x1f2937,
    monitorBezel:0x0b1020, monitorOn:0x3b82f6, keyboard:0xcbd5e1,
    plantPot:0x5c3f22, plantLeaf:0x16a34a, plantLeafLt:0x22c55e,
    sofaPurple:0x6d28d9, sofaDark:0x4c1d95,
    bookshelf:0x422712, tableWood:0x78543a,
    executiveGlow:0xfbbf24, ceoGlow:0xf59e0b,
  };

  class OfficeScene extends Phaser.Scene {
    constructor(){ super('office'); }
    create(){
      state.scene = this;
      // map center is around (isoX(4,3), isoY(4,3)); compute and centerOn that
      const mapCX = isoX(3.5, 3.0), mapCY = isoY(3.5, 3.0);
      this.cameras.main.setZoom(2.2);
      this.cameras.main.centerOn(mapCX, mapCY);
      this.bg = this.add.container(0, 0);
      this.floorLayer = this.add.container(0, 0);
      this.staticFurn = this.add.container(0, 0);
      this.shadowLayer = this.add.container(0, 0);
      this.deskGlowLayer = this.add.container(0, 0);
      this.dynamicFurn = this.add.container(0, 0);
      this.charLayer = this.add.container(0, 0);
      this.lightLayer = this.add.container(0, 0);
      this.drawFloor();
      this.drawRooms();
      this.drawWalls();
      this.drawFurniture();
      this.deskGlows = {};
      this.createDeskGlows();
      this.createCharacters();
      this.addRoomLabels();
      this.initLights();
      this.initMonitorFlicker();

      // resize listener for responsive centering (keeps map centered on container resize)
      this.scale.on('resize', () => this.cameras.main.centerOn(mapCX, mapCY));
    }
    createDeskGlows(){
      for (const c of CUBICLES) {
        const g = this.add.graphics();
        g.setVisible(false);
        this.deskGlowLayer.add(g);
        this.deskGlows[c.deptId] = { g, tx:c.tx, ty:c.ty, tween:null };
      }
    }
    setDeskGlow(deptId, on, hex = '#3b82f6'){
      const dg = this.deskGlows[deptId]; if (!dg) return;
      if (dg.tween) { dg.tween.stop(); dg.tween = null; }
      dg.g.clear();
      if (!on) { dg.g.setVisible(false); return; }
      dg.g.setVisible(true);
      const cx = isoX(dg.tx, dg.ty), cy = isoY(dg.tx, dg.ty);
      const colorNum = Phaser.Display.Color.HexStringToColor(hex).color;
      dg.g.fillStyle(colorNum, 0.22);
      dg.g.fillEllipse(cx, cy + 2, 90, 44);
      dg.g.lineStyle(1, colorNum, 0.45);
      dg.g.strokeEllipse(cx, cy + 2, 90, 44);
      dg.tween = this.tweens.add({ targets:dg.g, alpha:{from:0.55,to:1}, duration:1100, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    }
    addRoomLabels(){
      const mk = (x, y, txt, c) => this.add.text(x, y, txt, {
        fontFamily:'Inter,system-ui,sans-serif', fontSize:'10px', fontStyle:'bold', color:c,
      }).setOrigin(0.5, 0.5);
      this.bg.add(mk(isoX(1, 0.5),   isoY(1, 0.5)   - 42, '회의실',     '#94a3b8'));
      this.bg.add(mk(isoX(3.5, 0.5), isoY(3.5, 0.5) - 42, '상무실',     '#fbbf24'));
      this.bg.add(mk(isoX(6.5, 0.5), isoY(6.5, 0.5) - 42, 'CEO 사장실', '#f59e0b'));
      this.bg.add(mk(isoX(3.5, 3.0), isoY(3.5, 3.0) - 62, '업무공간',   '#64748b'));
      this.bg.add(mk(isoX(3.5, 5.0), isoY(3.5, 5.0) - 18, '휴게실',     '#64748b'));
    }
    drawFloor(){
      const g = this.add.graphics();
      this.floorLayer.add(g);
      for (let tx = 0; tx < 8; tx++) for (let ty = 0; ty < 6; ty++) {
        const cx = isoX(tx, ty), cy = isoY(tx, ty);
        g.fillStyle((tx+ty)%2===0 ? C.floorA : C.floorB, 1);
        g.beginPath(); g.moveTo(cx, cy - TILE_H/2); g.lineTo(cx + TILE_W/2, cy);
        g.lineTo(cx, cy + TILE_H/2); g.lineTo(cx - TILE_W/2, cy); g.closePath(); g.fillPath();
        g.lineStyle(1, C.floorEdge, 0.5); g.strokePath();
      }
    }
    drawRooms(){
      const g = this.add.graphics(); this.floorLayer.add(g);
      this.fillRoomFloor(g, 0, 2, 0, 2, 0x1e293b, 0.55);
      this.fillRoomFloor(g, 3, 5, 0, 2, 0x1f1a10, 0.45);
      this.fillRoomFloor(g, 5, 8, 0, 2, 0x2a1f0a, 0.55);
      this.fillRoomFloor(g, 2, 5, 5, 6, 0x1e1b4b, 0.45);
    }
    fillRoomFloor(g, x1, x2, y1, y2, color, alpha){
      const pts = [[x1,y1],[x2,y1],[x2,y2],[x1,y2]];
      g.fillStyle(color, alpha); g.beginPath();
      g.moveTo(isoX(pts[0][0], pts[0][1]), isoY(pts[0][0], pts[0][1]));
      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));
      g.closePath(); g.fillPath();
    }
    drawWalls(){
      const g = this.add.graphics(); this.floorLayer.add(g);
      const segs = [
        { a:{tx:0,ty:2}, b:{tx:2,ty:2}, c:0x334155 },
        { a:{tx:2,ty:0}, b:{tx:2,ty:2}, c:0x334155 },
        { a:{tx:3,ty:0}, b:{tx:3,ty:2}, c:0x4a3820 },
        { a:{tx:3,ty:2}, b:{tx:5,ty:2}, c:0x4a3820 },
        { a:{tx:5,ty:0}, b:{tx:5,ty:2}, c:0x4a3820 },
        { a:{tx:5,ty:2}, b:{tx:8,ty:2}, c:0x5a3f1f },
        { a:{tx:2,ty:5}, b:{tx:5,ty:5}, c:0x312e81 },
      ];
      for (const s of segs) {
        g.lineStyle(2.5, s.c, 0.9); g.beginPath();
        g.moveTo(isoX(s.a.tx, s.a.ty), isoY(s.a.tx, s.a.ty));
        g.lineTo(isoX(s.b.tx, s.b.ty), isoY(s.b.tx, s.b.ty));
        g.strokePath();
      }
    }
    isoBox(g, tx, ty, w, d, h, top, sL, sR){
      const x1 = isoX(tx, ty), y1 = isoY(tx, ty);
      const x2 = isoX(tx + w, ty), y2 = isoY(tx + w, ty);
      const x3 = isoX(tx + w, ty + d), y3 = isoY(tx + w, ty + d);
      const x4 = isoX(tx, ty + d), y4 = isoY(tx, ty + d);
      g.fillStyle(sR, 1); g.beginPath();
      g.moveTo(x2, y2); g.lineTo(x3, y3); g.lineTo(x3, y3 - h); g.lineTo(x2, y2 - h); g.closePath(); g.fillPath();
      g.fillStyle(sL, 1); g.beginPath();
      g.moveTo(x3, y3); g.lineTo(x4, y4); g.lineTo(x4, y4 - h); g.lineTo(x3, y3 - h); g.closePath(); g.fillPath();
      g.fillStyle(top, 1); g.beginPath();
      g.moveTo(x1, y1 - h); g.lineTo(x2, y2 - h); g.lineTo(x3, y3 - h); g.lineTo(x4, y4 - h); g.closePath(); g.fillPath();
      g.lineStyle(1, 0x050810, 0.5); g.strokePath();
    }
    drawMonitor(g, cx, cy){
      g.fillStyle(C.monitorBezel, 1); g.fillRect(cx - 9, cy - 13, 18, 12);
      g.fillStyle(0x0f172a, 1); g.fillRect(cx - 7, cy - 11, 14, 8);
      g.fillStyle(0x374151, 1); g.fillRect(cx - 2, cy - 1, 4, 3); g.fillRect(cx - 5, cy + 2, 10, 1);
    }
    drawKeyboard(g, cx, cy){ g.fillStyle(C.keyboard, 0.85); g.fillRect(cx - 8, cy + 4, 16, 4); }
    drawChair(g, tx, ty){
      this.isoBox(g, tx - 0.15, ty + 0.05, 0.3, 0.3, 6, C.chairSeat, 0x0b0f1a, 0x12182a);
      this.isoBox(g, tx - 0.15, ty + 0.05, 0.3, 0.08, 14, C.chairBody, 0x1e2742, 0x2a3454);
    }
    drawPlant(g, cx, cy){
      g.fillStyle(C.plantPot, 1); g.fillRect(cx - 5, cy - 2, 10, 8);
      g.fillStyle(C.plantLeaf, 1);   g.fillCircle(cx - 2, cy - 6, 5); g.fillCircle(cx + 3, cy - 7, 5);
      g.fillStyle(C.plantLeafLt, 1); g.fillCircle(cx, cy - 9, 4);     g.fillCircle(cx + 5, cy - 5, 3);
    }
    drawFurniture(){
      const g = this.add.graphics(); this.staticFurn.add(g);
      const mcx = isoX(1.0, 0.9), mcy = isoY(1.0, 0.9);
      g.fillStyle(C.tableWood, 1); g.fillEllipse(mcx, mcy, 84, 42);
      g.lineStyle(1, 0x3a2412, 0.8); g.strokeEllipse(mcx, mcy, 84, 42);
      g.fillStyle(0x553a20, 1); g.fillEllipse(mcx, mcy - 2, 66, 32);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const cx = mcx + Math.cos(a) * 52, cy = mcy + Math.sin(a) * 24;
        g.fillStyle(C.chairBody, 1); g.fillEllipse(cx, cy + 2, 13, 8);
        g.fillStyle(0x0b0f1a, 1); g.fillEllipse(cx, cy, 10, 6);
      }
      this.drawPlant(g, isoX(0.2, 0.2), isoY(0.2, 0.2));
      this.drawPlant(g, isoX(1.9, 1.9), isoY(1.9, 1.9));
      // 상무실
      this.isoBox(g, 3.3, 0.7, 1.2, 0.6, 13, C.deskTop, C.deskFront, C.deskSide);
      this.drawMonitor(g, isoX(3.9, 0.85), isoY(3.9, 0.85) - 8);
      this.drawKeyboard(g, isoX(3.9, 1.0), isoY(3.9, 1.0) - 8);
      this.drawChair(g, 3.9, 1.55);
      this.isoBox(g, 3.1, 0.1, 0.25, 0.8, 26, C.bookshelf, 0x2a1810, 0x35201b);
      const bx = isoX(3.15, 0.5), by = isoY(3.15, 0.5);
      for (let i = 0; i < 4; i++) { g.fillStyle([0xDC2626, 0x2563EB, 0x059669, 0xD97706][i], 1); g.fillRect(bx - 4, by - 24 + i * 5, 8, 4); }
      this.drawPlant(g, isoX(4.7, 0.3), isoY(4.7, 0.3));
      // CEO
      this.isoBox(g, 5.5, 0.4, 1.8, 0.9, 14, C.deskTop, C.deskFront, C.deskSide);
      this.drawMonitor(g, isoX(6.4, 0.65), isoY(6.4, 0.65) - 9);
      this.drawKeyboard(g, isoX(6.4, 0.85), isoY(6.4, 0.85) - 9);
      this.isoBox(g, 6.3, 1.35, 0.5, 0.5, 22, 0x0b0f1a, 0x05080f, 0x08101c);
      this.isoBox(g, 7.2, 0.5, 0.5, 1.3, 8, C.sofaPurple, C.sofaDark, 0x3730a3);
      this.isoBox(g, 7.2, 0.5, 0.5, 0.2, 14, 0x8B5CF6, C.sofaPurple, 0x5B21B6);
      this.isoBox(g, 5.1, 0.1, 0.25, 1.0, 26, C.bookshelf, 0x2a1810, 0x35201b);
      const cbx = isoX(5.15, 0.6), cby = isoY(5.15, 0.6);
      for (let i = 0; i < 5; i++) { g.fillStyle([0xDC2626, 0x2563EB, 0x059669, 0xD97706, 0x7C3AED][i], 1); g.fillRect(cbx - 4, cby - 24 + i * 5, 8, 4); }
      this.drawPlant(g, isoX(5.4, 1.8), isoY(5.4, 1.8));
      // 큐비클
      for (const c of CUBICLES) {
        this.isoBox(g, c.tx - 0.45, c.ty - 0.35, 0.9, 0.65, 10, C.deskTop, C.deskFront, C.deskSide);
        this.drawMonitor(g, isoX(c.tx, c.ty - 0.12), isoY(c.tx, c.ty - 0.12) - 8);
        this.drawKeyboard(g, isoX(c.tx, c.ty + 0.05), isoY(c.tx, c.ty + 0.05) - 8);
        this.drawChair(g, c.tx, c.ty + 0.35);
      }
      this.drawPlant(g, isoX(0.3, 3.5), isoY(0.3, 3.5));
      this.drawPlant(g, isoX(7.3, 3.0), isoY(7.3, 3.0));
      this.drawPlant(g, isoX(0.4, 2.0), isoY(0.4, 2.0));
      // 휴게실
      this.isoBox(g, 2.8, 5.3, 2.0, 0.4, 10, 0x334155, 0x1e293b, 0x263448);
      this.isoBox(g, 2.8, 5.15, 2.0, 0.15, 14, 0x475569, 0x334155, 0x3b4b66);
      this.isoBox(g, 3.4, 5.7, 0.8, 0.3, 6, C.tableWood, 0x3a2412, 0x513020);

    initLights(){
      this.executiveLight = this.add.graphics(); this.ceoLight = this.add.graphics();
      this.lightLayer.add(this.executiveLight); this.lightLayer.add(this.ceoLight);
      this.executiveLight.setVisible(false); this.ceoLight.setVisible(false);

    lightExecutive(on){
      const g = this.executiveLight; g.clear();
      if (!on) { g.setVisible(false); return; }
      g.setVisible(true);
      const pts = [[3,0],[5,0],[5,2],[3,2]];
      g.fillStyle(C.executiveGlow, 0.25); g.beginPath();
      g.moveTo(isoX(pts[0][0], pts[0][1]), isoY(pts[0][0], pts[0][1]));
      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));
      g.closePath(); g.fillPath();
      this.tweens.add({ targets:g, alpha:{from:0.6,to:1}, duration:900, yoyo:true, repeat:-1 });

    lightCeo(on){
      const g = this.ceoLight; g.clear();

      const pts = [[5,0],[8,0],[8,2],[5,2]];
      g.fillStyle(C.ceoGlow, 0.25); g.beginPath();

      for (let i = 1; i < pts.length; i++) g.lineTo(isoX(pts[i][0], pts[i][1]), isoY(pts[i][0], pts[i][1]));

    initMonitorFlicker(){
      this.monitorG = this.add.graphics(); this.dynamicFurn.add(this.monitorG);
      this.time.addEvent({
        delay:800, loop:true, callback:() => {
          this.monitorG.clear();
          for (const c of CUBICLES) {
            const mx = isoX(c.tx, c.ty - 0.12), my = isoY(c.tx, c.ty - 0.12) - 8;
            const on = Math.random() > 0.35;
            const col = on ? (Math.random() > 0.5 ? 0x3b82f6 : 0x10b981) : 0x0f172a;
            this.monitorG.fillStyle(col, 0.88); this.monitorG.fillRect(mx - 7, my - 11, 14, 8);
          }
        },
      });
    }
    createCharacters(){
      this.characters = {};
      DEPTS.forEach((d) => {
        const cub = CUBICLES.find(c => c.deptId === d.id);
        const sx = isoX(cub.tx, cub.ty + 0.3), sy = isoY(cub.tx, cub.ty + 0.3) - 4;

        // shadow under character
        const shadow = this.add.ellipse(sx, sy + 4, 14, 5, 0x000000, 0.35);
        this.shadowLayer.add(shadow);

        const container = this.add.container(sx, sy); container.setDepth(Math.floor(sy));
        const hair = this.add.rectangle(0, -22, 10, 3, 0x0a0d14).setOrigin(0.5, 0.5);
        const head = this.add.rectangle(0, -18, 10, 10, 0xf6d5ad).setOrigin(0.5, 0.5);
        const eyeL = this.add.rectangle(-2, -18, 1, 1, 0x000).setOrigin(0.5, 0.5);
        const eyeR = this.add.rectangle(2, -18, 1, 1, 0x000).setOrigin(0.5, 0.5);
        const body = this.add.rectangle(0, -8, 10, 12, d.color).setOrigin(0.5, 0.5);
        const armL = this.add.rectangle(-6, -8, 2, 8, d.color).setOrigin(0.5, 0.5);
        const armR = this.add.rectangle(6, -8, 2, 8, d.color).setOrigin(0.5, 0.5);
        const legL = this.add.rectangle(-2, 1, 3, 6, 0x0a0d14).setOrigin(0.5, 0.5);
        const legR = this.add.rectangle(2, 1, 3, 6, 0x0a0d14).setOrigin(0.5, 0.5);
        container.add([hair, head, eyeL, eyeR, body, armL, armR, legL, legR]);
        const data = {
          deptId:d.id, color:d.color, hex:d.hex, container, shadow,
          head, hair, body, armL, armR, legL, legR,
          cubicle:cub, meetingSeat:d._meetingSeat,
          state:'idle', bubble:null, bubbleTimer:null,
          bobTween:null, armTweenL:null, armTweenR:null, walkTween:null, shadowTween:null,
        };
        this.characters[d.id] = data;
        this.charLayer.add(container);
        this.startIdleBob(data);
      });
    }
    startIdleBob(c){
      this.stopTweens(c);
      c.bobTween = this.tweens.add({
        targets:c.container, y:c.container.y - 1.8,
        duration:800, yoyo:true, repeat:-1, ease:'Sine.easeInOut',
      });
      // shadow pulse in sync
      c.shadowTween = this.tweens.add({
        targets:c.shadow, scaleX:{from:1,to:0.9}, alpha:{from:0.35,to:0.28},
        duration:800, yoyo:true, repeat:-1, ease:'Sine.easeInOut',
      });
    }
    stopTweens(c){ [c.bobTween, c.armTweenL, c.armTweenR, c.walkTween, c.shadowTween].forEach(t => t && t.stop()); c.bobTween = c.armTweenL = c.armTweenR = c.walkTween = c.shadowTween = null; }
    walkCharTo(c, tx, ty, done){
      this.stopTweens(c);
      const destX = isoX(tx, ty), destY = isoY(tx, ty) - 4;
      c.walkTween = this.tweens.chain({
        targets:c.container,
        tweens:[
          { x:destX, duration:350, ease:'Sine.easeInOut' },
          { y:destY, duration:350, ease:'Sine.easeInOut' },
        ],
        onComplete:() => { c.container.setDepth(Math.floor(destY)); if (done) done(); },
      });
      // shadow follows
      this.tweens.chain({
        targets:c.shadow,
        tweens:[
          { x:destX, duration:350, ease:'Sine.easeInOut' },
          { y:destY + 4, duration:350, ease:'Sine.easeInOut' },
        ],
      });
      // legs step
      this.tweens.add({ targets:[c.legL, c.legR], y:{from:1,to:-1}, duration:90, yoyo:true, repeat:7 });
    }
    startTyping(c){
      this.stopTweens(c);
      c.armTweenL = this.tweens.add({ targets:c.armL, y:{from:-8,to:-5}, duration:170, yoyo:true, repeat:-1 });
      c.armTweenR = this.tweens.add({ targets:c.armR, y:{from:-5,to:-8}, duration:170, yoyo:true, repeat:-1 });
    }
    setBubble(c, text, colorHex = '#ffffff', autoHideMs = 3000){
      this.clearBubble(c);
      const bg = this.add.graphics();
      const t = this.add.text(0, 0, String(text).slice(0, 24), { fontFamily:'Inter,sans-serif', fontSize:'10px', color:'#1f2937' }).setOrigin(0.5, 0.5);
      const w = t.width + 10, h = 14;
      bg.fillStyle(Phaser.Display.Color.HexStringToColor(colorHex).color, 1);
      bg.fillRoundedRect(-w / 2, -h / 2, w, h, 3);
      bg.lineStyle(1, 0x1f2937, 1); bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 3);
      bg.fillTriangle(-3, h / 2 - 1, 3, h / 2 - 1, 0, h / 2 + 3);
      const bubble = this.add.container(0, -32, [bg, t]); c.container.add(bubble);
      bubble.alpha = 0; bubble.y = -26;
      this.tweens.add({ targets:bubble, alpha:1, y:-32, duration:220, ease:'Cubic.easeOut' });
      c.bubble = bubble;
      if (c.bubbleTimer) c.bubbleTimer.remove();
      if (autoHideMs > 0) c.bubbleTimer = this.time.delayedCall(autoHideMs, () => this.clearBubble(c));
    }
    clearBubble(c){
      if (c.bubble) {
        const b = c.bubble; c.bubble = null;
        this.tweens.add({ targets:b, alpha:0, y:b.y - 4, duration:180, ease:'Cubic.easeIn', onComplete:() => b.destroy() });
      }
      if (c.bubbleTimer) { c.bubbleTimer.remove(); c.bubbleTimer = null; }
    }
    emitStars(c){
      for (let i = 0; i < 3; i++) {
        const s = this.add.text(0, -28, '★', { fontFamily:'Inter,system-ui', fontSize:'13px', color:'#fbbf24' }).setOrigin(0.5, 0.5);
        c.container.add(s);
        this.tweens.add({ targets:s, x:(i - 1) * 10, y:-48 - Math.random() * 10, alpha:{from:1,to:0}, duration:900 + i * 120, ease:'Cubic.easeOut', onComplete:() => s.destroy() });
      }
    }
    goWork(deptId, objective){
      const c = this.characters[deptId]; if (!c) return;
      c.state = 'walking'; state.deptStates[deptId] = 'working';
      this.setDeskGlow(deptId, true, c.hex);
      this.walkCharTo(c, c.meetingSeat.tx, c.meetingSeat.ty, () => { c.state = 'working'; this.startTyping(c); if (objective) this.setBubble(c, objective, '#dbeafe', 0); });
      renderPanel();
    }
    progressMsg(deptId, msg){ const c = this.characters[deptId]; if (c && c.state === 'working' && msg) this.setBubble(c, msg, '#dbeafe', 0); }
    goDone(deptId){
      const c = this.characters[deptId]; if (!c) return;
      this.stopTweens(c); this.clearBubble(c);
      c.state = 'returning'; state.deptStates[deptId] = 'done';
      this.walkCharTo(c, c.cubicle.tx, c.cubicle.ty + 0.3, () => {
        c.state = 'idle';
        this.setDeskGlow(deptId, false);
        this.setBubble(c, '✓ 완료', '#d1fae5', 1800);
        this.emitStars(c);
        this.startIdleBob(c);
      });
      renderPanel();
    }
    goError(deptId){
      const c = this.characters[deptId]; if (!c) return;
      this.stopTweens(c); this.clearBubble(c);
      state.deptStates[deptId] = 'err';
      this.setDeskGlow(deptId, false);
      const homeX = isoX(c.cubicle.tx, c.cubicle.ty + 0.3);
      if (Math.abs(c.container.x - homeX) > 3) {
        c.state = 'returning';
        this.walkCharTo(c, c.cubicle.tx, c.cubicle.ty + 0.3, () => { c.state = 'idle'; this.setBubble(c, '! 오류', '#fecaca', 3000); this.startIdleBob(c); });
      } else { c.state = 'idle'; this.setBubble(c, '! 오류', '#fecaca', 3000); this.startIdleBob(c); }
      renderPanel();
    }
    resetAll(){
      this.lightExecutive(false); this.lightCeo(false);
      for (const d of DEPTS) this.setDeskGlow(d.id, false);
      for (const c of Object.values(this.characters)) {
        this.stopTweens(c); this.clearBubble(c);
        const hx = isoX(c.cubicle.tx, c.cubicle.ty + 0.3);
        const hy = isoY(c.cubicle.tx, c.cubicle.ty + 0.3) - 4;
        c.container.setPosition(hx, hy);
        c.shadow.setPosition(hx, hy + 4);
        c.state = 'idle'; this.startIdleBob(c);
      }
      DEPTS.forEach(d => { state.deptStates[d.id] = 'idle'; });
      state.lastBriefing = null; state.lastCritic = null;
      renderPanel();
    }
    settleAll(){
      for (const c of Object.values(this.characters)) {
        if (c.state !== 'working' && c.state !== 'walking') continue;
        this.stopTweens(c); this.clearBubble(c);
        c.state = 'returning';
        this.walkCharTo(c, c.cubicle.tx, c.cubicle.ty + 0.3, () => { c.state = 'idle'; this.startIdleBob(c); });
      }
    }
    recallToMeeting(deptId, reason){
      const c = this.characters[deptId]; if (!c) return;
      c.state = 'walking'; this.stopTweens(c);
      this.walkCharTo(c, c.meetingSeat.tx, c.meetingSeat.ty, () => { c.state = 'working'; this.startTyping(c); this.setBubble(c, reason || '보완 작업', '#ffe3a0', 4000); });
    }
  }

  // ─── Minimal markdown renderer ──────────────────────────────────
  function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderMarkdown(text){
    if (!text) return '';
    const fenceBlocks = [];
    let work = String(text).replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_m, lang, code) => {
      const safeLang = (lang || '').trim().toLowerCase();
      const escaped = escapeHtml(code.replace(/\n$/, ''));
      let highlighted = escaped;
      try {
        if (window.hljs && safeLang && window.hljs.getLanguage(safeLang)) {
          highlighted = window.hljs.highlight(code.replace(/\n$/, ''), { language:safeLang, ignoreIllegals:true }).value;
        } else if (window.hljs) {
          highlighted = window.hljs.highlightAuto(code.replace(/\n$/, '')).value;
        }
      } catch { highlighted = escaped; }
      fenceBlocks.push(`<pre><button class="copy-code" type="button">복사</button><code class="hljs language-${safeLang}">${highlighted}</code></pre>`);
      return `\u0000FENCE${fenceBlocks.length - 1}\u0000`;
    });
    work = escapeHtml(work);

    work = work.replace(/^### (.+)$/gm, '<h3>$1</h3>')
               .replace(/^## (.+)$/gm, '<h2>$1</h2>')
               .replace(/^# (.+)$/gm, '<h1>$1</h1>')
               .replace(/^#### (.+)$/gm, '<h4>$1</h4>');

    work = work.replace(/^---$/gm, '<hr>');

    // blockquote
    work = work.replace(/^&gt; ?(.+)$/gm, '<blockquote>$1</blockquote>');

    // table: | a | b |\n|---|---|\n| c | d |
    work = work.replace(/(^\|.+\|$\n^\|(?:\s*:?-+:?\s*\|)+$\n(?:^\|.+\|$\n?)+)/gm, (block) => {
      const lines = block.trim().split(/\n/);
      if (lines.length < 2) return block;
      const header = lines[0].slice(1, -1).split('|').map(x => x.trim());
      const rows = lines.slice(2).map(r => r.slice(1, -1).split('|').map(x => x.trim()));
      const th = header.map(h => `<th>${h}</th>`).join('');
      const trs = rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
      return `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;
    });

    // lists
    work = work.replace(/(^(?:- |\* ).+(?:\n(?:- |\* ).+)*)/gm, (block) => {
      const items = block.split(/\n/).map(l => l.replace(/^(?:- |\* )/, '').trim()).filter(Boolean);
      return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
    });
    work = work.replace(/(^\d+\. .+(?:\n\d+\. .+)*)/gm, (block) => {
      const items = block.split(/\n/).map(l => l.replace(/^\d+\. /, '').trim()).filter(Boolean);
      return '<ol>' + items.map(i => `<li>${i}</li>`).join('') + '</ol>';
    });

    // bold / italic / inline code
    work = work.replace(/`([^`\n]+?)`/g, '<code class="inline">$1</code>');
    work = work.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    work = work.replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<em>$2</em>');

    // links
    work = work.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // bare urls (avoid double-wrap)
    work = work.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

    // paragraph wrap (skip block-level)
    work = work.split(/\n{2,}/).map(p => {
      if (/^\s*<(h\d|ul|ol|table|pre|blockquote|hr)/i.test(p.trim())) return p;
      if (!p.trim()) return '';
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    // restore fences
    work = work.replace(/\u0000FENCE(\d+)\u0000/g, (_m, i) => fenceBlocks[Number(i)] || '');
    return work;
  }

  function bindCopyButtons(root){
    root.querySelectorAll('.copy-code').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const pre = btn.parentElement; const code = pre && pre.querySelector('code');
        if (!code) return;
        navigator.clipboard.writeText(code.innerText).then(() => toast('코드 복사됨')).catch(() => {});
      });
    });
  }

  // ─── Messages ───────────────────────────────────────────────────
  function addMsg(payload, persist = true){
    const empty = dom.chatLog.querySelector('.chat-empty'); if (empty) empty.remove();
    const id = payload.id || ('m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    const kind = payload.kind || 'ai';
    const msg = document.createElement('div');
    msg.className = 'msg ' + kind;
    msg.dataset.mid = id;
    if (payload.deptId && DEPT_BY_ID[payload.deptId]) msg.style.setProperty('--dept-color', DEPT_BY_ID[payload.deptId].hex);

    const whoEl = document.createElement('div'); whoEl.className = 'who';
    if (kind === 'dept') whoEl.innerHTML = `<span class="dot"></span>${escapeHtml(payload.who || '')}`;
    else if (payload.who) whoEl.textContent = payload.who;

    const bodyEl = document.createElement('div'); bodyEl.className = 'body';

    const rendersMd = kind === 'ai' || kind === 'ceo' || kind === 'critic' || kind === 'dept';
    if (payload.html) {
      bodyEl.classList.add('md');
      bodyEl.innerHTML = payload.body || '';
    } else if (kind === 'user') {
      bodyEl.textContent = payload.body || '';
    } else if (rendersMd) {
      bodyEl.classList.add('md');
      bodyEl.innerHTML = renderMarkdown(payload.body || '');
      bindCopyButtons(bodyEl);
    } else {
      bodyEl.textContent = payload.body || '';
    }

    // attachments preview (user)
    if (kind === 'user' && Array.isArray(payload.attachments) && payload.attachments.length) {
      const ar = document.createElement('div');
      ar.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-top:6px';
      for (const a of payload.attachments) {
        const chip = document.createElement('div');
        chip.style.cssText = 'font-size:12.5px;background:rgba(0,0,0,.2);border:1px solid rgba(140,130,115,.28);border-radius:10px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px';
        if (a.thumb) chip.innerHTML = `<img src="${a.thumb}" style="width:14px;height:14px;border-radius:2px;object-fit:cover"/>${escapeHtml(a.name)}`;
        else chip.textContent = `📎 ${a.name}`;
        ar.appendChild(chip);
      }
      bodyEl.appendChild(ar);
    }

    if (kind !== 'user' || payload.who) msg.appendChild(whoEl);
    msg.appendChild(bodyEl);

    // actions
    if (kind !== 'sys' && kind !== 'err') {
      const actions = document.createElement('div'); actions.className = 'msg-actions';
      if (kind === 'user') {
        actions.appendChild(makeBtn('📋 복사', () => copyText(payload.body || '')));
        actions.appendChild(makeBtn('✎ 편집', () => beginEdit(msg, id, payload)));
        if (Array.isArray(payload.versions) && payload.versions.length > 1) {
          const nav = document.createElement('div'); nav.className = 'ver-nav';
          const cur = payload.versionIndex ?? payload.versions.length - 1;
          const prev = document.createElement('button'); prev.textContent = '◀'; prev.disabled = cur <= 0;
          const lbl = document.createElement('span'); lbl.textContent = `${cur + 1}/${payload.versions.length}`;
          const next = document.createElement('button'); next.textContent = '▶'; next.disabled = cur >= payload.versions.length - 1;
          prev.onclick = () => moveVersion(id, -1);
          next.onclick = () => moveVersion(id, +1);
          nav.appendChild(prev); nav.appendChild(lbl); nav.appendChild(next);
          actions.appendChild(nav);
        }
      } else {
        actions.appendChild(makeBtn('📋 복사', () => copyText(bodyEl.innerText)));
        if (kind === 'ai') actions.appendChild(makeBtn('↻ 재생성', () => regenerate(id)));
        const up = makeBtn('👍', () => toggleFeedback(id, 'up', up, down));
        const down = makeBtn('👎', () => toggleFeedback(id, 'down', up, down));
        up.classList.add('thumb-up'); down.classList.add('thumb-down');
        if (state.feedback[id] === 'up') up.classList.add('on');
        if (state.feedback[id] === 'down') down.classList.add('on');
        actions.appendChild(up); actions.appendChild(down);
        actions.appendChild(makeBtn('⬇ 내보내기', () => exportMsg(payload, bodyEl.innerText)));
      }
      msg.appendChild(actions);
    }

    dom.chatLog.appendChild(msg);
    autoScrollIfNeeded();

    if (persist && state.activeThreadId) {
      const stored = { id, kind, who:payload.who, body:payload.body, deptId:payload.deptId || null, html:!!payload.html, attachments:payload.attachments || [], versions:payload.versions, versionIndex:payload.versionIndex, ts:Date.now() };
      appendMessageToThread(state.activeThreadId, stored);
    }
    return msg;
  }
  function makeBtn(txt, onClick){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.onclick = onClick; return b;
  }
  function copyText(t){ navigator.clipboard.writeText(t || '').then(() => toast('복사됨')).catch(() => toast('복사 실패')); }
  function autoScrollIfNeeded(){
    if (state.userAtBottom) dom.chatLog.scrollTop = dom.chatLog.scrollHeight;
  }

  dom.chatLog.addEventListener('scroll', () => {
    const nearBottom = dom.chatLog.scrollHeight - dom.chatLog.scrollTop - dom.chatLog.clientHeight < 60;
    state.userAtBottom = nearBottom;
    dom.toBottom.classList.toggle('visible', !nearBottom);
  });
  dom.toBottom.addEventListener('click', () => { state.userAtBottom = true; dom.chatLog.scrollTop = dom.chatLog.scrollHeight; dom.toBottom.classList.remove('visible'); });

  function exportMsg(payload, text){
    const blob = new Blob([text || payload.body || ''], { type:'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `message-${Date.now()}.md`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('내보내기 완료');
  }
  function toggleFeedback(id, kind, upBtn, downBtn){
    if (state.feedback[id] === kind) delete state.feedback[id];
    else state.feedback[id] = kind;
    saveLS(LS.FEEDBACK, state.feedback);
    upBtn.classList.toggle('on', state.feedback[id] === 'up');
    downBtn.classList.toggle('on', state.feedback[id] === 'down');
    try {
      fetch(API_BASE + '/api/feedback', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ messageId:id, verdict:state.feedback[id] || null }),
      }).catch(() => {});
    } catch {}
    toast(state.feedback[id] === 'up' ? '👍 피드백 전송' : state.feedback[id] === 'down' ? '👎 피드백 전송' : '피드백 취소');
  }
  function regenerate(id){
    // find original user prompt preceding this AI msg
    const t = getActiveThread(); if (!t) return;
    const idx = t.messages.findIndex(m => m.id === id);
    if (idx <= 0) { toast('재생성할 사용자 메시지 없음'); return; }
    let userMsg = null;
    for (let i = idx - 1; i >= 0; i--) if (t.messages[i].kind === 'user') { userMsg = t.messages[i]; break; }
    if (!userMsg) { toast('재생성할 사용자 메시지 없음'); return; }
    // re-send same directive
    dom.directive.value = userMsg.body; autoSize();
    startRun();
  }
  function beginEdit(msgEl, id, payload){
    if (state.editingMsgId) return;
    state.editingMsgId = id;
    const body = msgEl.querySelector('.body');
    const originalHtml = body.innerHTML;
    const area = document.createElement('div'); area.className = 'edit-area';
    const ta = document.createElement('textarea'); ta.value = payload.body || '';
    const row = document.createElement('div'); row.className = 'row';
    const cancel = document.createElement('button'); cancel.textContent = '취소 (Esc)';
    const save = document.createElement('button'); save.textContent = '저장 (Enter)'; save.classList.add('primary');
    row.appendChild(cancel); row.appendChild(save);
    area.appendChild(ta); area.appendChild(row);
    body.innerHTML = ''; body.appendChild(area); ta.focus();
    const finish = (commit) => {
      state.editingMsgId = null;
      if (!commit) { body.innerHTML = originalHtml; return; }
      const next = ta.value;
      // update thread versions
      const t = getActiveThread(); if (!t) return;
      const m = t.messages.find(x => x.id === id); if (!m) return;
      m.versions = m.versions || [m.body];
      m.versions.push(next);
      m.versionIndex = m.versions.length - 1;
      m.body = next;
      saveThreads(); debouncedSaveMessages(t.id);
      body.textContent = next;
      toast('메시지 편집됨 (재전송 안 함, 재생성은 ↻ 버튼)');
    };
    cancel.onclick = () => finish(false);
    save.onclick = () => finish(true);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
  }
  function moveVersion(id, delta){
    const t = getActiveThread(); if (!t) return;
    const m = t.messages.find(x => x.id === id); if (!m || !Array.isArray(m.versions)) return;
    const ni = Math.max(0, Math.min(m.versions.length - 1, (m.versionIndex ?? m.versions.length - 1) + delta));
    if (ni === m.versionIndex) return;
    m.versionIndex = ni; m.body = m.versions[ni];
    saveThreads(); debouncedSaveMessages(t.id);
    reloadActiveThread();
  }

  // ─── Thread / project utilities ─────────────────────────────────
  function saveThreads(){ saveLS(LS.THREADS, state.threads); }
  function saveProjects(){ saveLS(LS.PROJECTS, state.projects); }
  function saveCollapsed(){ saveLS(LS.COLLAPSED, [...state.collapsedProjects]); }
  function projectThreads(pid){ if (!state.threads[pid]) state.threads[pid] = []; return state.threads[pid]; }
  function getProjectTitleOrGeneral(){
    if (state.activeProjectId === GENERAL) return '신규 프로젝트';
    return state.projects.find(x => x.id === state.activeProjectId)?.title || '신규 프로젝트';
  }
  function getActiveThread(){
    if (!state.activeThreadId) return null;
    for (const pid of Object.keys(state.threads)) {
      const t = state.threads[pid].find(x => x.id === state.activeThreadId);
      if (t) return t;
    }
    return null;
  }
  function ensureThread(){ if (!state.activeThreadId || !getActiveThread()) createNewThread(state.activeProjectId || GENERAL); }
  function createNewThread(projectId = GENERAL){
    const id = 'th_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const t = { id, projectId, title:'신규 대화', messages:[], meta:{ pinned:false }, updatedAt:Date.now() };
    projectThreads(projectId).unshift(t);
    state.activeThreadId = id; state.activeProjectId = projectId;
    localStorage.setItem(LS.ACTIVE_THREAD, id);
    saveThreads(); apiSaveThread(t).catch(() => {}); apiSyncState();
    return t;
  }
  function appendMessageToThread(threadId, msg){
    for (const pid of Object.keys(state.threads)) {
      const list = state.threads[pid];
      const t = list.find(x => x.id === threadId);
      if (t) { t.messages.push(msg); t.updatedAt = Date.now(); saveThreads(); renderSidebar(); debouncedSaveMessages(threadId); return; }
    }
  }
  const saveMessageTimers = {};
  function debouncedSaveMessages(threadId){
    if (saveMessageTimers[threadId]) clearTimeout(saveMessageTimers[threadId]);
    saveMessageTimers[threadId] = setTimeout(() => {
      for (const pid of Object.keys(state.threads)) {
        const t = state.threads[pid].find(x => x.id === threadId);
        if (t) apiSaveMessages(t.id, t.messages).catch(() => {});
      }
    }, 1200);
  }
  function loadThread(threadId){
    let t = null, pid = null;
    for (const k of Object.keys(state.threads)) {
      const m = state.threads[k].find(x => x.id === threadId);
      if (m) { t = m; pid = k; break; }
    }
    if (!t) return;
    state.activeThreadId = threadId; state.activeProjectId = pid;
    localStorage.setItem(LS.ACTIVE_THREAD, threadId);
    // Reset scene then replay the new thread's current run state (if any)
    state.scene?.resetAll();
    const run = ensureRun(threadId);
    applyRunToUI(run);
    // Replay working depts so characters are at meeting seats with glow
    if (state.scene) {
      for (const d of DEPTS) if (run.deptStates[d.id] === 'working') state.scene.goWork(d.id);
    }
    reloadActiveThread();
    apiSyncState();
  }
  function reloadActiveThread(){
    const t = getActiveThread(); if (!t) return;
    dom.chatLog.innerHTML = '';
    for (const m of t.messages) addMsg(m, false);
    if (!t.messages.length) dom.chatLog.innerHTML = `<div class="chat-empty"><h3>무엇을 도와드릴까요?</h3><p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p></div>`;
    dom.chatTitle.textContent = t.title;
    renderSidebar();
  }
  function newChat(){
    // "+ 새 채팅" — activeProjectId 아래 스레드 생성 후 채팅창으로 이동
    const pid = state.activeProjectId || GENERAL;
    createNewThread(pid);
    dom.chatLog.innerHTML = `<div class="chat-empty"><h3>무엇을 도와드릴까요?</h3><p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p></div>`;
    state.scene?.resetAll();
    dom.directive.value = ''; autoSize(); clearAttachments();
    dom.directive.focus();
    dom.chatTitle.textContent = '신규 대화';
    applyRunToUI(ensureRun(state.activeThreadId));
    renderSidebar();
  }
  function newProject(){
    const name = prompt('새 프로젝트 이름'); if (!name || !name.trim()) return;
    const p = { id:'proj_' + Date.now().toString(36), title:name.trim(), updatedAt:Date.now(), meta:{} };
    state.projects.unshift(p); saveProjects(); apiSaveProject(p).catch(() => {});
    // 스레드 자동 생성 금지 — 프로젝트 홈 화면으로 진입

  // ─── 프로젝트 / 스레드 선택 ─────────────────────────────────────
  function selectProject(projectId){
    if (!projectId || projectId === GENERAL) {
      state.activeProjectId = GENERAL;
    } else {
      state.activeProjectId = projectId;
    }
    state.activeThreadId = null;
    localStorage.removeItem(LS.ACTIVE_THREAD);
    // 선택 시 자동 펼침 (사용자가 스레드 목록 바로 보게)
    state.collapsedProjects.delete(state.activeProjectId);
    saveCollapsed();
    state.scene?.resetAll();
    renderSidebar();
    renderMainArea();
    apiSyncState();
  }
  function selectThread(threadId){ loadThread(threadId); }
  function createThreadInProject(projectId){
    state.activeProjectId = projectId || GENERAL;
    createNewThread(state.activeProjectId);
    dom.chatLog.innerHTML = `<div class="chat-empty"><h3>무엇을 도와드릴까요?</h3><p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p></div>`;
    state.scene?.resetAll();
    dom.directive.value = ''; autoSize(); clearAttachments();
    dom.directive.focus();
    dom.chatTitle.textContent = '신규 대화';
    applyRunToUI(ensureRun(state.activeThreadId));
    renderSidebar();

  // ─── 메인 영역 렌더링: 프로젝트 홈 vs 채팅 ─────────────────────
  function renderMainArea(){
    const pid = state.activeProjectId;
    const inRealProject = pid && pid !== GENERAL;
    if (inRealProject && !state.activeThreadId) {
      renderProjectHome(pid);
      return;
    }
    const cur = getActiveThread();
    if (cur) {
      reloadActiveThread();
    } else {
      dom.chatLog.innerHTML = `<div class="chat-empty"><h3>무엇을 도와드릴까요?</h3><p>지시를 입력하면 필요한 부서 직원이 움직입니다.</p></div>`;
      dom.chatTitle.textContent = '신규 대화';
    }
  }
  function renderProjectHome(projectId){
    const p = (state.projects || []).find(x => x && x.id === projectId);
    if (!p) { renderSidebar(); return; }
    dom.chatTitle.textContent = p.title;
    const threads = projectThreads(projectId).slice().sort(compareThreads);
    const cardsHtml = threads.map(t => {
      const when = new Date(t.updatedAt || Date.now()).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      return `<div class="project-home__thread" data-tid="${escapeAttr(t.id)}">
        <div class="project-home__thread-title">${escapeHtml(t.title || '신규 대화')}</div>
        <div class="project-home__thread-meta">${escapeHtml(when)} · 메시지 ${Array.isArray(t.messages) ? t.messages.length : 0}개</div>
      </div>`;
    }).join('');
    dom.chatLog.innerHTML = `
      <div class="project-home">
        <div class="project-home__icon">📁</div>
        <div class="project-home__title">${escapeHtml(p.title)}</div>
        <div class="project-home__desc">${threads.length ? '이 프로젝트의 대화를 이어가거나 새 스레드를 시작하세요.' : '이 프로젝트에 대화가 없습니다.<br>새 스레드를 시작하세요.'}</div>
        <button class="project-home__btn" type="button" data-act="new-thread">+ 새 스레드 시작하기</button>
        ${threads.length ? `<div class="project-home__threads">${cardsHtml}</div>` : ''}
      </div>`;
    const btn = dom.chatLog.querySelector('[data-act="new-thread"]');
    if (btn) btn.addEventListener('click', () => createThreadInProject(projectId));
    dom.chatLog.querySelectorAll('.project-home__thread').forEach(el => {
      el.addEventListener('click', () => selectThread(el.dataset.tid));
    });
  }
  function escapeAttr(s){ return String(s ?? '').replace(/["&<>]/g, ch => ({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }

  // ─── SSE 텍스트 추출 (AI 응답 [object Object] 방지) ─────────────
  function extractText(data){
    if (typeof data === 'string') return data;
    if (data == null) return '';
    if (typeof data === 'object') {
      const candidates = [
        data.text, data.content, data.answer,
        data.final_answer?.text, data.final_answer?.content,
        data.payload?.final_answer?.text, data.payload?.final_answer?.content,
        data.delta?.text,
      ];
      for (const c of candidates) {
        if (typeof c === 'string') return c;
      }
      try { return JSON.stringify(data); } catch { return String(data); }
    }
    return String(data);
  }

  // ─── Sidebar render ─────────────────────────────────────────────
  function renderSidebar(){
    dom.generalThreads.innerHTML = '';
    const gen = projectThreads(GENERAL).slice().sort(compareThreads);
    if (!gen.length) {
      const e = document.createElement('div');
      e.className = 'thread-item'; e.style.color = 'var(--text-dim)'; e.style.fontStyle = 'italic';
      e.textContent = '대화 없음';
      dom.generalThreads.appendChild(e);
    } else for (const t of gen) dom.generalThreads.appendChild(threadItem(t, false));

    dom.projectList.innerHTML = '';
    // "__general__" 는 프로젝트 그룹으로 렌더링하지 않는다 (상단 "최근" 섹션 전용)
    const renderableProjects = (state.projects || []).filter(p => p && p.id && p.id !== GENERAL);
    for (const p of renderableProjects) {
      const ts = projectThreads(p.id);
      const row = document.createElement('div');
      const isCollapsed = state.collapsedProjects.has(p.id);
      row.className = 'project-row' + (isCollapsed ? ' collapsed' : '') + (state.activeProjectId === p.id ? ' active' : '');
      row.innerHTML = `<span class="caret">▼</span><span class="name"></span><span class="count">${ts.length}</span><button class="row-menu" type="button">⋯</button>`;
      row.querySelector('.name').textContent = p.title;
      // 이름/카렛 클릭: selectProject(p.id) — 스레드 자동 생성 없이 홈 화면 진입
      row.addEventListener('click', (e) => {
        if (e.target && e.target.classList.contains('row-menu')) return;
        const caret = e.target && e.target.classList.contains('caret');
        if (caret) {
          // 카렛 전용: 접힘 토글만 (선택은 바꾸지 않음)
          if (isCollapsed) state.collapsedProjects.delete(p.id); else state.collapsedProjects.add(p.id);
          saveCollapsed(); renderSidebar();
          return;
        }
        selectProject(p.id);
      });
      row.querySelector('.row-menu').addEventListener('click', (e) => { e.stopPropagation(); openProjectMenu(e.currentTarget, p); });
      dom.projectList.appendChild(row);
      if (!isCollapsed) {

  function compareThreads(a, b){
    const pa = a.meta?.pinned ? 1 : 0, pb = b.meta?.pinned ? 1 : 0;

  // ─── Bubble menu ────────────────────────────────────────────────
  let currentMenu = null;
