# ═══════════════════════════════════════════════════════════
# CORVUS X — nginx 최종 구성 (2026.04)
#
# 설계 요약:
#   1) cloudcookie.co.kr / www.cloudcookie.co.kr
#      → 완전 빈 HTML + Clear-Site-Data 헤더 (서비스워커·캐시 무효화)
#      → CORVUS X 흔적을 남기지 않는다
#
#   2) app.cloudcookie.co.kr
#      → CORVUS X 프론트 + /api + /ws 리버스 프록시
#      → nginx basic auth 사용하지 않음
#      → 로그인은 CORVUS X 내부 인증(scrypt + HMAC 세션 쿠키)이 처리
#
# 설치 위치: /etc/nginx/sites-available/cloudcookie.conf
# 활성화:    sudo ln -sf /etc/nginx/sites-available/cloudcookie.conf \
#                        /etc/nginx/sites-enabled/cloudcookie.conf
# 기존 분리 파일(cloudcookie.co.kr, app.cloudcookie.co.kr) 은 deploy.sh 가 자동 제거.
# ═══════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# 1) apex + www — HTTP : 80 → HTTPS 로 리다이렉트
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cloudcookie.co.kr www.cloudcookie.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 2) apex + www — HTTPS : 443 → 빈 HTML + Clear-Site-Data
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloudcookie.co.kr www.cloudcookie.co.kr;

    ssl_certificate     /etc/letsencrypt/live/cloudcookie.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudcookie.co.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blank;
    index index.html;

    # 브라우저 캐시·쿠키·스토리지·서비스워커 전부 폐기
    add_header Clear-Site-Data "\"cache\", \"cookies\", \"storage\", \"executionContexts\"" always;
    add_header Cache-Control   "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma          "no-cache" always;
    add_header X-Robots-Tag    "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        add_header Clear-Site-Data "";
    }

    location / {
        try_files /index.html =404;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 3) app.cloudcookie.co.kr — HTTP : 80 → HTTPS 리다이렉트
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.cloudcookie.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.cloudcookie.co.kr$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 4) app.cloudcookie.co.kr — HTTPS : 443 → CORVUS X 본체
#    * basic auth 없음 (내부 /api/auth 가 처리)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.cloudcookie.co.kr;

    ssl_certificate     /etc/letsencrypt/live/app.cloudcookie.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cloudcookie.co.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/corvusx;
    index index.html;

    client_max_body_size 100M;

    # SSE 스트리밍 + WebSocket 지원
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # 보안 헤더
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /api/* → Node 백엔드
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 프론트 정적 파일 (Vite build)
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
