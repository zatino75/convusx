# ═══════════════════════════════════════════════════════════
# CORVUS X — 응급 리다이렉트 전용 nginx 설정
#
# 목적:
#   cloudcookie.co.kr / www.cloudcookie.co.kr 에 CORVUS X 가
#   열리지 않도록 즉시 차단. app.cloudcookie.co.kr 로 301 이동.
#
# 특징:
#   - app 블록 없음 → 백엔드/프론트 빌드 상태 무관하게 작동
#   - 기존 운영 중인 nginx 에 단독 추가 가능
#   - 설치 후 nginx -t && systemctl reload nginx 만 하면 끝
#
# 설치:
#   sudo cp cloudcookie-emergency-redirect.conf \
#           /etc/nginx/sites-available/cloudcookie-redirect.conf
#   sudo ln -sf /etc/nginx/sites-available/cloudcookie-redirect.conf \
#               /etc/nginx/sites-enabled/cloudcookie-redirect.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name cloudcookie.co.kr www.cloudcookie.co.kr;

    # Let's Encrypt 챌린지는 허용 (추후 HTTPS 발급용)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 나머지는 전부 app 으로 301
    location / {
        return 301 https://app.cloudcookie.co.kr$request_uri;
    }
}

# HTTPS 블록 — 기존에 인증서가 발급돼 있으면 아래 블록도 활성화 필요
# 없으면 이 블록은 주석 유지 (nginx -t 에서 에러 방지)
