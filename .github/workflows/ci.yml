name: CI

on:
  push:
    branches: [main]
  pull_request:
    # 어떤 브랜치 대상 PR 이든 검증 (feature → main, feature → feature 등)
    branches: ["**"]

env:
  NODE_VERSION: "20"

jobs:
  # ── 1. 서버 검증 (TypeScript + 유닛 테스트) ──
  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (server)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Server tests with coverage
        run: npx vitest run --reporter=verbose --coverage
        env:
          NODE_ENV: test

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/
          retention-days: 14

  # ── 2. 프론트엔드 검증 (TypeScript + 테스트 + 빌드) ──
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript check (frontend)
        run: cd frontend && npx tsc --noEmit

      - name: Frontend tests
        run: cd frontend && npx vitest run --reporter=verbose --passWithNoTests

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 3. Lint (eslint) ──
  # .eslintrc.json 만 있고 eslint 가 devDependencies 에 없어도 npx 가 on-demand 로
  # 가져온다. 규칙 위반은 경고만으로도 가시화하기 위해 `|| true` 로 비차단.
  # 추후 규칙 안정화되면 `|| true` 제거해 블로킹 전환 권장.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: ESLint (server + shared)
        run: |
          if [ -f .eslintrc.json ] || [ -f eslint.config.js ]; then
            npx --yes eslint@8 \
              --ext .ts,.tsx \
              --config .eslintrc.json \
              server/src/ || true
          else
            echo "No ESLint config — skipping."
          fi

      - name: ESLint (frontend)
        run: |
          cd frontend && npm ci
          cd ..
          if [ -f .eslintrc.json ]; then
            npx --yes eslint@8 \
              --ext .ts,.tsx \
              --config .eslintrc.json \
              frontend/src/ || true
          fi

  # ── 4. Docker 빌드 검증 (main push 에서만 수행) ──
  docker-build:
    runs-on: ubuntu-latest
    needs: [server-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: corvus-x:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. 의존성 보안 감사 ──
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        run: cd frontend && npm ci && npm audit --audit-level=high || true
